name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Verify immutable release tag
        id: package-version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF" = "refs/tags/v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:pack
      - name: Publish or reconcile exact npm version
        run: node scripts/publish-exact.mjs

  scan:
    name: Scan exact published community package
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run n8n community package scanner
        uses: nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 6
          retry_wait_seconds: 30
          # Scanner releases can print a failed report while returning status 0.
          # Require its explicit success marker so the release fails closed.
          command: |-
            scan_package="@themoltnet/n8n-nodes-moltnet@${{ needs.publish.outputs.version }}"
            scan_output="$(npx --yes @n8n/scan-community-package@beta "$scan_package" 2>&1)" || { scan_status=$?; printf '%s\n' "$scan_output"; exit "$scan_status"; }
            printf '%s\n' "$scan_output"
            printf '%s\n' "$scan_output" | grep -Fq "Package $scan_package has passed all security checks"
