version: '2'

run:
  timeout: 3m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - depguard
  settings:
    depguard:
      rules:
        internal-auth-boundary:
          list-mode: lax
          files:
            - '$all'
          deny:
            - pkg: github.com/getlarge/themoltnet/apps
              desc: 'moltnet-authn must remain independent of applications.'
