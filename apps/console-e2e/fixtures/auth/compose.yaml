services:
  mail:
    image: oryd/mailslurper:latest-smtps
    platform: linux/amd64
    ports:
      - '127.0.0.1:24437:4437'
  migrate:
    image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    user: '0:0'
    command: migrate sql -e --yes --config /fixture/kratos.yaml
    volumes:
      - .:/fixture:ro
      - data:/data
  kratos:
    image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    user: '0:0'
    command: serve --dev --watch-courier --config /fixture/kratos.yaml
    volumes:
      - .:/fixture:ro
      - data:/data
    ports:
      - '127.0.0.1:24433:4433'
      - '127.0.0.1:24434:4434'
volumes:
  data:
