# Fly.io configuration for MoltNet REST API
# See https://github.com/getlarge/themoltnet/issues/192

app = "moltnet"
primary_region = "fra"  # Frankfurt — EU data residency
kill_signal = "SIGTERM"
kill_timeout = 30        # seconds to wait for graceful shutdown before SIGKILL

# Only used for local `fly deploy`; CI deploys a pre-built image from GHCR
[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  ORY_PROJECT_URL = "https://auth.themolt.net"
  ORY_TALOS_ADMIN_URL = "https://auth.themolt.net"
  # Administratively registered public PKCE clients; must match Desktop defaults.
  MOLTNET_NATIVE_OAUTH_CLIENT_ID = "moltnet-native"
  # Publisher release-signing PUBLIC key: the only maintained copy. Served in
  # /.well-known/moltnet.json (endpoints.downloads.release_signer_public_key),
  # embedded into the installers by release.yml (which refuses to publish if
  # it does not match RELEASE_SIGNING_KEY), and checked against the Desktop
  # embedded key by tools/release/agent-desktop/validate.sh. Read through
  # tools/release/release-signer-pubkey.sh; keep this exact one-line shape.
  # Rotation: docs/understand/infrastructure.md#release-signer-key-rotation
  RELEASE_SIGNER_PUBKEY = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIsffodWdp+Y0UUFJq8yaFcI08nhSfxkVe4hZKhGGv5Y"
  # REDIS_URL is a Fly secret (it carries credentials), so it is not set here.
  # It backs both the rate limiter and the OAuth2 grant cache, and is REQUIRED
  # in production — loadConfig refuses to start without it. This app runs more
  # than one machine, so a per-instance memory store would mean a client secret
  # rotation handled by one instance never evicts grants cached on another
  # (issue #1860). Provision with:
  #   fly redis status moltnet-redis            # private URL, region fra
  #   fly secrets set REDIS_URL="<url>" -a moltnet
  # Shares the moltnet-redis instance with moltnet-mcp; keys are namespaced
  # (`moltnet:oauth-token:` here) so the two cannot collide.
  ORY_AUTH_CACHE_TTL_MS = "60000"
  ORY_AUTH_CACHE_MAX_ENTRIES = "10000"
  ORY_KETO_PERMISSION_CACHE_TTL_MS = "30000"
  ORY_KETO_PERMISSION_CACHE_MAX_ENTRIES = "10000"
  ORY_AUTH_REQUEST_TIMEOUT_MS = "5000"
  CORS_ORIGINS = "https://themolt.net,https://api.themolt.net,https://console.themolt.net,https://docs.themolt.net"
  OTLP_ENDPOINT = "https://eu-central-1.aws.edge.axiom.co"
  AXIOM_DATASET = "moltnet"
  AXIOM_LOGS_DATASET = "moltnet-logs"
  AXIOM_TRACES_DATASET = "moltnet-traces"
  AXIOM_METRICS_DATASET = "moltnet-metrics"
  # AXIOM_API_TOKEN — set via fly secrets
  # Proxy metadata for request handling.
  TRUST_PROXY = "1"
  RATE_LIMIT_CLIENT_IP_HEADER = "fly-client-ip"
  RATE_LIMIT_TRUSTED_PROXY_CIDRS = "172.16.0.0/12"
  DBOS_WORKFLOW_RETENTION_ENABLED = "true"
  DBOS_WORKFLOW_RETENTION_DAYS = "30"
  DBOS_WORKFLOW_RETENTION_BATCH_SIZE = "1000"
  DBOS_WORKFLOW_RETENTION_CRON = "15 * * * *"
  TASK_EXPIRY_SWEEPER_CRON = "0 * * * *"
  TASK_EXPIRY_SWEEPER_BATCH_SIZE = "50"

[deploy]
  release_command = "node dist/migrate.js"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  # Two machines have been running since well before this was written; the
  # floor now matches reality so a scale-down cannot silently drop below it.
  min_machines_running = 2
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
