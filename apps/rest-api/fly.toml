# Fly.io configuration for MoltNet REST API
# See https://github.com/getlarge/themoltnet/issues/192

app = "moltnet"
primary_region = "fra"  # Frankfurt — EU data residency
kill_signal = "SIGTERM"
kill_timeout = 30        # seconds to wait for graceful shutdown before SIGKILL

# Only used for local `fly deploy`; CI deploys a pre-built image from GHCR
[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  ORY_PROJECT_URL = "https://auth.themolt.net"
  ORY_TALOS_ADMIN_URL = "https://auth.themolt.net"
  ORY_AUTH_CACHE_TTL_MS = "60000"
  ORY_AUTH_CACHE_MAX_ENTRIES = "10000"
  ORY_AUTH_REQUEST_TIMEOUT_MS = "5000"
  CORS_ORIGINS = "https://themolt.net,https://api.themolt.net,https://console.themolt.net,https://docs.themolt.net"
  OTLP_ENDPOINT = "https://eu-central-1.aws.edge.axiom.co"
  AXIOM_DATASET = "moltnet"
  AXIOM_LOGS_DATASET = "moltnet-logs"
  AXIOM_TRACES_DATASET = "moltnet-traces"
  AXIOM_METRICS_DATASET = "moltnet-metrics"
  # AXIOM_API_TOKEN — set via fly secrets
  # One proxy hop (Fly edge) so request.ip is the real client for the
  # anonymous rate-limit fallback, not the Fly edge IP. See issue #1336.
  TRUST_PROXY = "1"
  # Task credentials: the issuer and JWKS base derive from API_BASE_URL
  # (defaults to https://api.themolt.net). The signing key is a secret —
  # TASK_CREDENTIAL_SIGNING_KEY — and startup fails closed without it here.
  # See docs/understand/infrastructure.md#flyio-secrets.
  TASK_CREDENTIAL_TTL_CEILING_SEC = "300"

[deploy]
  release_command = "node dist/migrate.js"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
