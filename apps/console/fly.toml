# Fly.io configuration for MoltNet Console

app = "moltnet-console"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  API_BASE_URL = "https://api.themolt.net"
  KRATOS_PUBLIC_URL = "https://auth.themolt.net"
  CONSOLE_BASE_URL = "https://console.themolt.net"
  # The signer runs on each operator's machine, not inside Fly.
  SIGNER_BASE_URL = "http://127.0.0.1:17373"
  # The agent supervisor also runs on the operator's machine.
  MOLTNET_SERVE_URL = "http://127.0.0.1:17374"
  # Must match the rest-api deployment's PACK_GC_COMPILE_TTL_DAYS: the console
  # computes the unpin retention window from it. See #1858.
  PACK_GC_COMPILE_TTL_DAYS = "7"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 75

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/"
  timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
