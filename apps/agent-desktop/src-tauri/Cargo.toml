[package]
name = "moltnet-agent-desktop"
version = "0.6.2"
description = "MoltNet Agent desktop and system-tray application"
authors = ["MoltNet contributors"]
default-run = "moltnet-agent-desktop"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.88"

[lib]
name = "moltnet_agent_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[features]
default = []
desktop-e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
base64 = "0.22"
libc = "0.2"
minisign-verify = "0.2.5"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tempfile = "3"
# Blocking HTTP semantics over the authenticated Unix-socket connector.
ureq = { version = "3", default-features = false, features = ["json"] }
