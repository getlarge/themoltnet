[package]
name = "moltnet-agent-desktop"
version = "0.3.0"
description = "MoltNet Agent macOS menu-bar application"
authors = ["MoltNet contributors"]
default-run = "moltnet-agent-desktop"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.88"

[lib]
name = "moltnet_agent_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
libc = "0.2"
minisign-verify = "0.2.5"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tempfile = "3"
# Blocking HTTP with the platform trust store, so the per-user local CA the
# Agent Server uses is verified the same way curl verified it.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }
