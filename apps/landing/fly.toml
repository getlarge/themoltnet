# Fly.io configuration for MoltNet Landing Page
# See https://github.com/getlarge/themoltnet/issues/192

app = "moltnet-landing"
primary_region = "fra"  # Frankfurt — EU data residency

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  API_BASE_URL = "https://api.themolt.net"
  DOCS_URL = "https://docs.themolt.net"
  # Publisher release-signing PUBLIC key, served in /download/manifest.json.
  # Must match the repo variable RELEASE_SIGNER_PUBKEY; rotate both together.
  RELEASE_SIGNER_PUBKEY = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIsffodWdp+Y0UUFJq8yaFcI08nhSfxkVe4hZKhGGv5Y"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 75

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/"
  timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
