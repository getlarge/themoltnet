name: moltnet

x-restart: &restart
  restart: unless-stopped
  logging:
    options:
      max-size: 10m
      max-file: '3'

services:
  caddy:
    <<: *restart
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    networks: [ingress]
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN:?set CONSOLE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      MCP_DOMAIN: ${MCP_DOMAIN:?set MCP_DOMAIN}
      IDENTITY_DOMAIN: ${IDENTITY_DOMAIN:?set IDENTITY_DOMAIN}
      OAUTH_DOMAIN: ${OAUTH_DOMAIN:?set OAUTH_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      console:
        condition: service_started
      rest-api:
        condition: service_started
      mcp-server:
        condition: service_started

  postgres:
    <<: *restart
    image: pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    networks: [database]
    shm_size: 256m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20

  db-migrate:
    image: ${DB_MIGRATE_IMAGE:?set DB_MIGRATE_IMAGE}
    networks: [database]
    environment:
      DATABASE_URL: postgresql://moltnet:${APP_DB_PASSWORD}@postgres:5432/moltnet
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure:3

  kratos-migrate:
    extends:
      file: ../ory/compose.yaml
      service: kratos-migrate

  kratos:
    extends:
      file: ../ory/compose.yaml
      service: kratos

  hydra-migrate:
    extends:
      file: ../ory/compose.yaml
      service: hydra-migrate

  hydra:
    extends:
      file: ../ory/compose.yaml
      service: hydra

  hydra-native-client:
    extends:
      file: ../ory/compose.yaml
      service: hydra-native-client

  keto-migrate:
    extends:
      file: ../ory/compose.yaml
      service: keto-migrate

  keto:
    extends:
      file: ../ory/compose.yaml
      service: keto

  talos:
    extends:
      file: ../ory/compose.yaml
      service: talos

  talos-init:
    extends:
      file: ../ory/compose.yaml
      service: talos-init

  talos-migrate:
    extends:
      file: ../ory/compose.yaml
      service: talos-migrate

  ory-db-init:
    extends:
      file: ../ory/compose.yaml
      service: ory-db-init

  valkey:
    <<: *restart
    image: valkey/valkey:8-alpine@sha256:9971099af41c36e887aabdfe22b80c0fe45df949163dfc9cb434febc57cfc3fc
    networks: [cache]
    command: valkey-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - valkey-data:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12

  object-store:
    <<: *restart
    image: chrislusf/seaweedfs:4.36@sha256:800b2115c63236e8bd0e5d572dc25dd493dc2feed08b54a2a269dc0101c9d94a
    networks: [objects]
    command: server -s3 -s3.port=8333 -dir=/data -master.volumeSizeLimitMB=1024
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      # The volume server sizes its slot count from free disk (one slot per
      # volumeSizeLimitMB), and each new collection grows 7 volumes by
      # default. On a small disk the first bucket takes every slot and writes
      # to the second bucket fail. Grow one volume at a time instead.
      WEED_MASTER_VOLUME_GROWTH_COPY_1: '1'
    volumes:
      - object-data:/data
    healthcheck:
      # The S3 gateway answers /status before a volume server has joined the
      # master, so also require a registered data node. Read-only on purpose:
      # /dir/assign would allocate volumes in the unused default collection.
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:8333/status >/dev/null &&
          curl -fsS http://127.0.0.1:9333/dir/status | grep -q '"DataNodes":\[{'
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  rest-api:
    <<: *restart
    image: ${REST_API_IMAGE:?set REST_API_IMAGE}
    networks: [ingress, database, services, credentials, cache, objects]
    environment:
      NODE_ENV: production
      PORT: '8080'
      DATABASE_URL: postgresql://moltnet:${APP_DB_PASSWORD}@postgres:5432/moltnet
      DBOS_SYSTEM_DATABASE_URL: postgresql://moltnet:${APP_DB_PASSWORD}@postgres:5432/moltnet?schema=dbos
      ORY_KRATOS_PUBLIC_URL: http://kratos:4433
      ORY_KRATOS_ADMIN_URL: http://kratos:4434
      ORY_HYDRA_PUBLIC_URL: http://hydra:4444
      ORY_HYDRA_JWKS_URL: http://hydra:4444/.well-known/jwks.json
      ORY_HYDRA_ISSUER_URL: https://${OAUTH_DOMAIN}/
      ORY_HYDRA_ADMIN_URL: http://hydra:4445
      ORY_KETO_PUBLIC_URL: http://keto:4466
      ORY_KETO_ADMIN_URL: http://keto:4467
      ORY_TALOS_ADMIN_URL: http://talos:4420
      ORY_ACTION_API_KEY: ${ORY_ACTION_API_KEY:?set ORY_ACTION_API_KEY}
      RECOVERY_CHALLENGE_SECRET: ${RECOVERY_CHALLENGE_SECRET:?set RECOVERY_CHALLENGE_SECRET}
      RELEASE_SIGNER_PUBKEY: ${RELEASE_SIGNER_PUBKEY:?set RELEASE_SIGNER_PUBKEY}
      CORS_ORIGINS: https://${CONSOLE_DOMAIN},https://${IDENTITY_DOMAIN},https://${API_DOMAIN}
      API_BASE_URL: https://${API_DOMAIN}
      # The API publishes no ports, so only peers on its private Docker
      # networks (Caddy on ingress) can reach it.
      TRUST_PROXY: uniquelocal
      AUTH_SCOPE_ENFORCEMENT: enforce
      REDIS_HOST: valkey
      REDIS_PORT: '6379'
      RUNTIME_SESSION_STORAGE_ENDPOINT: http://object-store:8333
      RUNTIME_SESSION_STORAGE_BUCKET: moltnet-runtime-sessions
      RUNTIME_SESSION_STORAGE_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      RUNTIME_SESSION_STORAGE_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      RUNTIME_SESSION_STORAGE_FORCE_PATH_STYLE: 'true'
      TASK_ARTIFACT_STORAGE_ENDPOINT: http://object-store:8333
      TASK_ARTIFACT_STORAGE_BUCKET: moltnet-task-artifacts
      TASK_ARTIFACT_STORAGE_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      TASK_ARTIFACT_STORAGE_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      TASK_ARTIFACT_STORAGE_FORCE_PATH_STYLE: 'true'
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kratos:
        condition: service_healthy
      hydra:
        condition: service_healthy
      keto:
        condition: service_healthy
      talos:
        condition: service_healthy
      valkey:
        condition: service_healthy
      object-store:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  console:
    <<: *restart
    image: ${CONSOLE_IMAGE:?set CONSOLE_IMAGE}
    networks: [ingress]
    environment:
      KRATOS_PUBLIC_URL: https://${IDENTITY_DOMAIN}
      API_BASE_URL: https://${API_DOMAIN}
      CONSOLE_BASE_URL: https://${CONSOLE_DOMAIN}
      SIGNER_BASE_URL: http://127.0.0.1:17373
    depends_on:
      rest-api:
        condition: service_healthy

  mcp-server:
    <<: *restart
    image: ${MCP_SERVER_IMAGE:?set MCP_SERVER_IMAGE}
    networks: [ingress, services, cache]
    environment:
      NODE_ENV: production
      PORT: '8001'
      REST_API_URL: http://rest-api:8080
      CONSOLE_BASE_URL: https://${CONSOLE_DOMAIN}
      AUTH_ENABLED: 'true'
      ORY_PROJECT_URL: http://hydra:4444
      ORY_HYDRA_PUBLIC_URL: https://${OAUTH_DOMAIN}/
      ORY_HYDRA_JWKS_URL: http://hydra:4444/.well-known/jwks.json
      ORY_HYDRA_REGISTRATION_URL: http://hydra:4444/oauth2/register
      ORY_HYDRA_ADMIN_URL: http://hydra:4445
      CLIENT_CREDENTIALS_PROXY: 'true'
      MCP_RESOURCE_URI: https://${MCP_DOMAIN}
      MCP_APP_DOMAIN: https://${MCP_DOMAIN}
      MCP_APP_CONNECT_DOMAINS: https://${MCP_DOMAIN},https://${API_DOMAIN}
      MCP_REDIS_HOST: valkey
      MCP_REDIS_PORT: '6379'
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
    depends_on:
      rest-api:
        condition: service_healthy
      hydra:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:8001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15

networks:
  ingress:
  database:
    internal: true
  services:
    internal: true
  identity:
    internal: true
  credentials:
    internal: true
  cache:
    internal: true
  objects:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  talos-data:
    name: ${TALOS_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-moltnet}_talos-data}
  valkey-data:
  object-data:
