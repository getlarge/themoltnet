version: v1.3.1

serve:
  public:
    cors:
      enabled: true
      allowed_origins:
        - https://${CONSOLE_DOMAIN}
        - https://${IDENTITY_DOMAIN}
      allow_credentials: true
  admin:
    base_url: http://kratos:4434/

identity:
  default_schema_id: moltnet_human
  schemas:
    - id: moltnet_agent
      url: file:///etc/config/kratos/identity-schema.json
    - id: moltnet_human
      url: file:///etc/config/kratos/human-identity-schema.json

selfservice:
  default_browser_return_url: https://${CONSOLE_DOMAIN}/
  allowed_return_urls:
    - https://${CONSOLE_DOMAIN}/
    - https://${IDENTITY_DOMAIN}/
  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: true
        min_password_length: 16
    code:
      enabled: true
      config:
        lifespan: 15m
    totp:
      enabled: true
      config:
        issuer: MoltNet
  flows:
    registration:
      enabled: true
      ui_url: https://${IDENTITY_DOMAIN}/registration
      lifespan: 1h
      after:
        password:
          hooks: &after_registration_hooks
            - hook: web_hook
              config:
                url: http://rest-api:8080/hooks/kratos/after-registration
                method: POST
                auth:
                  type: api_key
                  config:
                    name: X-Ory-Api-Key
                    value: ${ORY_ACTION_API_KEY}
                    in: header
                body: 'base64://ZnVuY3Rpb24oY3R4KSB7IGlkZW50aXR5OiBjdHguaWRlbnRpdHkgfQ=='
                response:
                  ignore: false
                  parse: true
                can_interrupt: true
        oidc:
          hooks: *after_registration_hooks
    login:
      ui_url: https://${IDENTITY_DOMAIN}/login
      lifespan: 1h
      after:
        password:
          hooks: &after_login_hooks
            - hook: web_hook
              config:
                url: http://rest-api:8080/hooks/kratos/after-login
                method: POST
                auth:
                  type: api_key
                  config:
                    name: X-Ory-Api-Key
                    value: ${ORY_ACTION_API_KEY}
                    in: header
                body: 'base64://ZnVuY3Rpb24oY3R4KSB7IGlkZW50aXR5OiBjdHguaWRlbnRpdHkgfQ=='
                response:
                  ignore: false
                  parse: false
                can_interrupt: false
        oidc:
          hooks: *after_login_hooks
    recovery:
      enabled: true
      use: code
      ui_url: https://${IDENTITY_DOMAIN}/recovery
      lifespan: 15m
    verification:
      enabled: true
      use: code
      ui_url: https://${IDENTITY_DOMAIN}/verification
    settings:
      ui_url: https://${IDENTITY_DOMAIN}/settings
      lifespan: 1h
      privileged_session_max_age: 15m
      after:
        password:
          hooks: &after_settings_hooks
            - hook: web_hook
              config:
                url: http://rest-api:8080/hooks/kratos/validate-settings
                method: POST
                auth:
                  type: api_key
                  config:
                    name: X-Ory-Api-Key
                    value: ${ORY_ACTION_API_KEY}
                    in: header
                body: 'base64://ZnVuY3Rpb24oY3R4KSB7IGlkZW50aXR5OiBjdHguaWRlbnRpdHkgfQ=='
                response:
                  ignore: false
                  parse: true
                can_interrupt: true
            - hook: web_hook
              config:
                url: http://rest-api:8080/hooks/kratos/after-settings
                method: POST
                auth:
                  type: api_key
                  config:
                    name: X-Ory-Api-Key
                    value: ${ORY_ACTION_API_KEY}
                    in: header
                body: 'base64://ZnVuY3Rpb24oY3R4KSB7IGlkZW50aXR5OiBjdHguaWRlbnRpdHkgfQ=='
                response:
                  ignore: false
                  parse: false
                can_interrupt: false
        profile:
          hooks: *after_settings_hooks
    error:
      ui_url: https://${IDENTITY_DOMAIN}/error
    logout:
      after:
        default_browser_return_url: https://${CONSOLE_DOMAIN}/

session:
  lifespan: 720h
  cookie:
    same_site: Lax
  whoami:
    required_aal: highest_available

courier:
  smtp:
    connection_uri: ${SMTP_CONNECTION_URI}
    from_name: MoltNet
    from_address: ${SMTP_FROM_ADDRESS}

oauth2_provider:
  url: http://hydra:4445
