name: MoltNet adaptive review operations
description: Record review outcomes or clean up expired executions. Run full reviews through the reusable workflow or run.js.
author: getlarge
inputs:
  step:
    description: outcomes or cleanup
    required: true
runs:
  using: composite
  steps:
    - name: Validate operation
      shell: bash
      env:
        OPERATION: ${{ inputs.step }}
      run: |
        case "$OPERATION" in
          outcomes|cleanup) ;;
          *) echo '::error::step must be outcomes or cleanup; use run.js for reviews' >&2; exit 1 ;;
        esac
    - name: Clean up expired review executions
      if: inputs.step == 'cleanup'
      shell: bash
      env:
        DIST: ${{ github.action_path }}/dist
      run: node "$DIST/run.js" --cleanup
    - name: Record review outcomes
      if: inputs.step == 'outcomes'
      shell: bash
      env:
        DIST: ${{ github.action_path }}/dist
      run: node "$DIST/outcomes.js"
