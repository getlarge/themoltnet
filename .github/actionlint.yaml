# actionlint 1.7.12 predates the `job.workflow_repository` and
# `job.workflow_sha` contexts, which a reusable workflow uses to check out its
# own commit. Ignore only those two properties, only in that workflow.
paths:
  .github/workflows/adaptive-review-reusable.yml:
    ignore:
      - 'property "workflow_repository" is not defined'
      - 'property "workflow_sha" is not defined'
  .github/workflows/adaptive-review-outcomes-reusable.yml:
    ignore:
      - 'property "workflow_repository" is not defined'
      - 'property "workflow_sha" is not defined'
  # GitHub supports queue: max, but actionlint 1.7.12 does not parse it.
  # The triage workflow test checks its values and cancel-in-progress pairing.
  # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
  .github/workflows/issue-triage.yml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
