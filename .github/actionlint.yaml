# actionlint 1.7.12 predates some GitHub Actions syntax. Ignore only the
# messages it raises for that syntax, only in the workflows that use it:
# - the `job.workflow_repository` and `job.workflow_sha` contexts, which a
#   reusable workflow uses to check out its own commit;
# - the `queue` key of a `concurrency` group.
paths:
  .github/workflows/adaptive-review-reusable.yml:
    ignore:
      - 'property "workflow_repository" is not defined'
      - 'property "workflow_sha" is not defined'
  .github/workflows/adaptive-review-outcomes-reusable.yml:
    ignore:
      - 'property "workflow_repository" is not defined'
      - 'property "workflow_sha" is not defined'
  .github/workflows/issue-triage.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
