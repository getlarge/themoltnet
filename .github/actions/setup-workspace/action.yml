name: Setup MoltNet workspace
description: Install the toolchains required to construct the Nx project graph.
inputs:
  install-dependencies:
    description: Run the frozen pnpm workspace install after toolchain setup.
    default: 'true'
  pnpm-cache:
    description: Restore and save the pnpm store cache.
    default: 'true'
  go:
    description: Install the Go version declared in .tool-versions.
    default: 'true'
  go-cache:
    description: Enable the setup-go module and build cache.
    default: 'false'
  go-cache-dependency-path:
    description: >
      Dependency files used to key the Go cache. List files, never a ** glob:
      hashing one walks the whole checkout, node_modules included.
    default: |
      go.work
      go.work.sum
      apps/moltnet-cli/go.mod
      apps/moltnet-cli/go.sum
      libs/moltnet-api-client/go.mod
      libs/moltnet-api-client/go.sum
      libs/moltnet-authn/go.mod
      libs/moltnet-authn/go.sum
  rust:
    description: Install the Rust version declared in .tool-versions.
    default: 'false'
  rust-components:
    description: Optional comma-separated Rust components.
    default: ''
  rust-cache:
    description: Cache Cargo downloads and Desktop build outputs.
    default: 'false'
  rust-cache-key:
    description: Required cache partition when rust-cache is true.
    default: ''
  rust-cache-targets:
    description: Cache compiled Cargo target directories as well as the registry.
    default: 'true'
  native-build-tools:
    description: Install cmake and ninja (Linux) through the cached apt installer.
    default: 'false'
  agent-desktop-native:
    description: >
      Install the Agent desktop Linux build dependencies
      (tools/release/agent-desktop/linux-build-dependencies.txt) through the
      cached apt installer.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .tool-versions
        cache: ${{ inputs.pnpm-cache == 'true' && 'pnpm' || '' }}
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      if: inputs.go == 'true'
      with:
        go-version-file: .tool-versions
        cache: ${{ inputs.go-cache }}
        cache-dependency-path: ${{ inputs.go-cache-dependency-path }}
    # Cached apt installs. The key carries the runner image version because
    # cached .deb files only satisfy the dependency set of the image they were
    # downloaded on; a new image is a cache miss and refreshes from the mirror.
    - name: Resolve runner image for apt cache keys
      id: apt-image
      if: runner.os == 'Linux' && (inputs.native-build-tools == 'true' || inputs.agent-desktop-native == 'true')
      shell: bash
      run: echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
    - name: Cache native build tool packages
      if: runner.os == 'Linux' && inputs.native-build-tools == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/moltnet-apt/build-tools
        key: apt-build-tools-${{ runner.arch }}-${{ steps.apt-image.outputs.image }}-cmake-ninja
    - name: Install native build tools
      if: runner.os == 'Linux' && inputs.native-build-tools == 'true'
      shell: bash
      run: bash tools/ci/apt-install.sh --cache-dir "$HOME/.cache/moltnet-apt/build-tools" cmake ninja-build
    - name: Cache Agent desktop native packages
      if: runner.os == 'Linux' && inputs.agent-desktop-native == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/moltnet-apt/agent-desktop
        key: apt-agent-desktop-${{ runner.arch }}-${{ steps.apt-image.outputs.image }}-${{ hashFiles('tools/release/agent-desktop/linux-build-dependencies.txt') }}
    - name: Install Agent desktop native dependencies
      if: runner.os == 'Linux' && inputs.agent-desktop-native == 'true'
      shell: bash
      run: bash tools/release/agent-desktop/install-linux-build-dependencies.sh --cache-dir "$HOME/.cache/moltnet-apt/agent-desktop"
    - name: Verify the pinned Rust toolchain
      if: inputs.rust == 'true'
      shell: bash
      run: |
        rust_version=$(awk '$1 == "rust" { print $2 }' .tool-versions)
        [ "$rust_version" = '1.90.0' ] || {
          echo "The pinned Rust action provides 1.90.0, but .tool-versions declares ${rust_version:-nothing}" >&2
          exit 1
        }
        if [ "${{ inputs.rust-cache }}" = true ] && [ -z "${{ inputs.rust-cache-key }}" ]; then
          echo 'rust-cache-key is required when rust-cache is true' >&2
          exit 1
        fi
    # dtolnay/rust-toolchain commit 49fda20 resolves the Rust 1.90.0 release.
    - if: inputs.rust == 'true' && inputs.rust-components == ''
      uses: dtolnay/rust-toolchain@49fda20b3f489226feadfba7767be1db54e2cee1
    # dtolnay/rust-toolchain commit 49fda20 resolves the Rust 1.90.0 release.
    - if: inputs.rust == 'true' && inputs.rust-components != ''
      uses: dtolnay/rust-toolchain@49fda20b3f489226feadfba7767be1db54e2cee1
      with:
        components: ${{ inputs.rust-components }}
    # Swatinem/rust-cache v2 is pinned by commit for reproducible cache behavior.
    - if: inputs.rust == 'true' && inputs.rust-cache == 'true'
      uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      with:
        workspaces: apps/agent-desktop/src-tauri -> ../out-rust
        shared-key: agent-desktop-${{ inputs.rust-cache-key }}-${{ runner.os }}-${{ runner.arch }}
        cache-targets: ${{ inputs.rust-cache-targets }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - if: inputs.install-dependencies == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
