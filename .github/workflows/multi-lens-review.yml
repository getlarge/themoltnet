name: Multi-lens deep review

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [ready_for_review]

permissions: {}

concurrency:
  group: multi-lens-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: |
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@legreffier /multi-lens-review') &&
        !endsWith(github.event.comment.user.login, '[bot]')) ||
      (github.event_name == 'pull_request_target')
    runs-on: ubuntu-latest
    environment: legreffier
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base-sha: ${{ steps.prepare.outputs.base-sha }}
      correlation-id: ${{ steps.prepare.outputs.correlation-id }}
      head-sha: ${{ steps.prepare.outputs.head-sha }}
      pr-number: ${{ steps.prepare.outputs.pr-number }}
      profile: ${{ steps.prepare.outputs.profile }}
    steps:
      - name: Fetch and validate untrusted PR review input
        id: prepare
        uses: actions/github-script@v8
        env:
          REVIEW_PROFILE: ${{ vars.MOLTNET_MULTI_LENS_REVIEW_PROFILE }}
        with:
          script: |
            const crypto = require('node:crypto');
            const fs = require('node:fs');
            const pullNumber =
              context.eventName === 'issue_comment'
                ? context.payload.issue.number
                : context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Multi-lens review only runs for same-repository pull requests');
              return;
            }
            if (pr.head.ref === 'codeboarding/sync' || pr.user.login === 'dependabot[bot]') {
              core.setFailed(`Multi-lens review is disabled for ${pr.head.ref}`);
              return;
            }
            const response = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              mediaType: { format: 'diff' },
            });
            const diff = String(response.data);
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                per_page: 100,
              },
            );
            // Absolute trusted-ingestion bounds. Topic budgets are enforced by
            // the checked-out base implementation before artifact staging.
            const maxBytes = 2 * 1024 * 1024;
            const maxFiles = 200;
            if (Buffer.byteLength(diff, 'utf8') > maxBytes) {
              core.setFailed(`PR diff exceeds the ${maxBytes}-byte ingestion limit`);
              return;
            }
            if (files.length > maxFiles) {
              core.setFailed(`PR has ${files.length} files; ingestion limit is ${maxFiles}`);
              return;
            }
            fs.writeFileSync('pull-request.diff', diff, { mode: 0o600 });
            fs.writeFileSync(
              'pull-request-files.json',
              JSON.stringify(
                files.map(file => ({
                  filename: file.filename,
                  previous_filename: file.previous_filename,
                  status: file.status,
                  additions: file.additions,
                  deletions: file.deletions,
                  changes: file.changes,
                })),
              ),
              { mode: 0o600 },
            );

            const seed = `${context.repo.owner}/${context.repo.repo}:${pr.number}:${pr.head.sha}`;
            const bytes = crypto.createHash('sha256').update(seed).digest().subarray(0, 16);
            bytes[6] = (bytes[6] & 0x0f) | 0x50;
            bytes[8] = (bytes[8] & 0x3f) | 0x80;
            const hex = bytes.toString('hex');
            const correlationId =
              `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-` +
              `${hex.slice(16, 20)}-${hex.slice(20)}`;

            if (!process.env.REVIEW_PROFILE) {
              core.setFailed('MOLTNET_MULTI_LENS_REVIEW_PROFILE is not configured');
              return;
            }
            core.setOutput('base-sha', pr.base.sha);
            core.setOutput('correlation-id', correlationId);
            core.setOutput('head-sha', pr.head.sha);
            core.setOutput('pr-number', String(pr.number));
            core.setOutput('profile', process.env.REVIEW_PROFILE);

      - uses: actions/upload-artifact@v6
        with:
          name: multi-lens-review-input
          path: |
            pull-request.diff
            pull-request-files.json
          if-no-files-found: error
          retention-days: 1

  orchestrate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: legreffier
    permissions:
      contents: read
      pull-requests: write
    env:
      MOLTNET_AGENT_KEY: ${{ secrets.MOLTNET_AGENT_KEY }}
      MOLTNET_AGENT_NAME: ${{ vars.MOLTNET_AGENT_NAME }}
      MOLTNET_API_URL: ${{ vars.MOLTNET_API_URL }}
      MOLTNET_TEAM_ID: ${{ vars.MOLTNET_TEAM_ID }}
      MOLTNET_DIARY_ID: ${{ vars.MOLTNET_DIARY_ID }}
      MULTI_LENS_REVIEW_DATABASE_URL: ${{ secrets.MULTI_LENS_REVIEW_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.base-sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: multi-lens-review-input
          path: ${{ runner.temp }}/multi-lens-review
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run @themoltnet/multi-lens-review:build

      - name: Orchestrate reviews and synthesis
        id: review
        env:
          CORRELATION_ID: ${{ needs.prepare.outputs.correlation-id }}
          PROFILE: ${{ needs.prepare.outputs.profile }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr-number }}
          BASE_SHA: ${{ needs.prepare.outputs.base-sha }}
          HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/multi-lens-review-result.json"
          node apps/multi-lens-review/dist/main.js \
            --team "$MOLTNET_TEAM_ID" \
            --diary "$MOLTNET_DIARY_ID" \
            --target "$GITHUB_REPOSITORY pull request #$PR_NUMBER at $HEAD_SHA" \
            --review-base-revision "$BASE_SHA" \
            --review-revision "$HEAD_SHA" \
            --diff-file "$RUNNER_TEMP/multi-lens-review/pull-request.diff" \
            --files-metadata "$RUNNER_TEMP/multi-lens-review/pull-request-files.json" \
            --profile "$PROFILE" \
            --correlation-id "$CORRELATION_ID" \
            --unattended \
            > "$result"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Upsert consolidated review comment
        # `act` sets ACT=true. Local trusted-runtime acceptance must never
        # mutate the PR fixture.
        if: always() && env.ACT != 'true'
        uses: actions/github-script@v8
        env:
          RESULT_PATH: ${{ steps.review.outputs.result }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          CORRELATION_ID: ${{ needs.prepare.outputs.correlation-id }}
          HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- moltnet:multi-lens-review -->';
            const runDetails =
              `Head: \`${process.env.HEAD_SHA}\` · ` +
              `[workflow run](${process.env.RUN_URL}) · ` +
              `Correlation: \`${process.env.CORRELATION_ID}\``;
            let body;
            if (process.env.REVIEW_OUTCOME === 'success' && process.env.RESULT_PATH) {
              const payload = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, 'utf8'));
              const output = payload.result ?? payload.output ?? payload;
              const result = output.value ?? output;
              const verdict = result.verdict;
              const diagnostics = result.diagnostics;
              const recommendation = verdict?.recommendation;
              const topicRows = (diagnostics?.topics ?? [])
                .map(topic =>
                  `| \`${topic.id}\` | ${topic.primaryFiles} | ${topic.contextFiles} | ` +
                  `${topic.bytes} | ${topic.lanes.join(', ')} |`,
                )
                .join('\n');
              const exclusions = (diagnostics?.coverage?.excludedFiles ?? [])
                .map(file =>
                  `- \`${file.path}\` — ${file.reason} (${file.source})` +
                  (file.evidence ? ` — ${file.evidence}` : ''),
                )
                .join('\n') || '- None';
              const cost = diagnostics?.cost;
              const diagnosticBody = diagnostics
                ? `\n\n### Topic and coverage diagnostics\n\n` +
                  `| Topic | Primary | Context | Bytes | Lanes |\n` +
                  `| --- | ---: | ---: | ---: | --- |\n${topicRows || '| — | 0 | 0 | 0 | — |'}\n\n` +
                  `Primary coverage: **${diagnostics.coverage?.complete ? 'complete' : 'incomplete'}**\n\n` +
                  `<details><summary>Evidence-backed and intrinsic exclusions</summary>\n\n${exclusions}\n\n</details>\n\n` +
                  `Tasks: **${cost?.tasks ?? 0}** · Artifacts: **${cost?.artifacts ?? 0}** ` +
                  `(${cost?.artifactBytes ?? 0} bytes) · Tokens: **${cost?.inputTokens ?? 0} in / ` +
                  `${cost?.outputTokens ?? 0} out**`
                : '';
              body = verdict
                ? `${marker}\n## MoltNet multi-lens review\n\n` +
                  `Recommendation: **${recommendation}**\n\n${verdict.summary}` +
                  diagnosticBody + `\n\n` +
                  `_${runDetails}_`
                : `${marker}\n## MoltNet multi-lens review\n\n` +
                  `The review completed, but its verdict payload was not recognized. ` +
                  `${runDetails}.`;
            } else {
              body = `${marker}\n## MoltNet multi-lens review\n\n` +
                `The review run failed. ${runDetails}.`;
            }
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
              },
            );
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  review-workers:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: legreffier
    permissions:
      contents: read
    env:
      MOLTNET_AGENT_KEY: ${{ secrets.MOLTNET_AGENT_KEY }}
      MOLTNET_AGENT_NAME: ${{ vars.MOLTNET_AGENT_NAME }}
      MOLTNET_API_URL: ${{ vars.MOLTNET_API_URL }}
      MOLTNET_TEAM_ID: ${{ vars.MOLTNET_TEAM_ID }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      # Absurd may need time to create the first task; dependency gaps after a
      # completed lens are shorter and use a separate idle grace.
      REVIEW_WORKER_STARTUP_GRACE_SEC: '900'
      REVIEW_WORKER_IDLE_GRACE_SEC: '300'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.base-sha }}
          persist-credentials: false
      - name: Fetch the untrusted review commit as inert git data
        env:
          HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
        run: git fetch --no-tags --depth=1 origin "$HEAD_SHA"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Drain this review run
        uses: ./packages/agent-daemon-action
        with:
          agent-name: ${{ vars.MOLTNET_AGENT_NAME }}
          mode: drain
          task-types: freeform
          correlation-id: ${{ needs.prepare.outputs.correlation-id }}
          wait-for-first-task-sec: ${{ env.REVIEW_WORKER_STARTUP_GRACE_SEC }}
          wait-after-task-sec: ${{ env.REVIEW_WORKER_IDLE_GRACE_SEC }}
          profile: ${{ needs.prepare.outputs.profile }}
          daemon-version: workspace
