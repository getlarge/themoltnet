name: Adaptive review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
  # A comment of exactly `/review` from an owner, member, or collaborator
  # reruns the review on demand and investigates every enabled lane, like
  # `/triage` on issues.
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    if: |
      vars.MOLTNET_ADAPTIVE_REVIEW_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false) ||
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          github.event.issue.state == 'open' &&
          github.event.comment.body == '/review' &&
          github.event.comment.user.type == 'User' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    uses: getlarge/themoltnet/.github/workflows/adaptive-review-reusable.yml@main
    permissions:
      actions: read
      contents: read
      pull-requests: write
    secrets: inherit
    with:
      environment: legreffier
      # A requested review investigates every lane; automatic runs follow
      # the classifier.
      mode: ${{ github.event_name == 'issue_comment' && 'shadow' || vars.MOLTNET_ADAPTIVE_REVIEW_MODE || 'active' }}
      classifier-profile: legreffier-issue-classifier-v2
      docs-profile: legreffier-adaptive-docs-review-v1
      complexity-profile: legreffier-complexity-review-v2
      security-profile: legreffier-security-review-v2
      focused-profile: legreffier-adaptive-focused-review-v1
      task-budgets: |
        focused:
          timeout: 12m
        security:
          timeout: 15m
      providers: id=ollama-cloud base-url=https://ollama.com/v1 key-env=OLLAMA_API_KEY supports-developer-role=false
      # Only these callers run from the pull request's own revision. The
      # reusable workflow comes from main and the runtime from the base commit,
      # so a pull request changing the review code is reviewed by the trusted
      # version and its changes are read only as data.
      protected-paths: |
        .github/workflows/adaptive-review.yml
        .github/workflows/adaptive-review-outcomes.yml
      # A comment event carries no base commit; the runtime then comes from
      # the trusted reusable workflow's commit on main.
      runtime-ref: ${{ github.event.pull_request.base.sha }}
