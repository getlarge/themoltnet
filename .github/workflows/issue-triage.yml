name: Issue Triage

# The issue text is passed as inert evidence to a tool-free MoltNet task. Only
# this trusted workflow changes labels or comments after validating its result.
on:
  issues:
    types: [opened, edited, labeled]
  schedule:
    - cron: '0 */6 * * *'

permissions: {}

jobs:
  discover:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'issues' &&
       (github.event.action != 'labeled' ||
        (github.event.label.name != 'needs-spec' &&
         github.event.label.name != 'ready-for-agent')))
    runs-on: ubuntu-latest
    permissions:
      issues: read
    outputs:
      issues: ${{ steps.issues.outputs.issues }}
    steps:
      - name: Select issues
        id: issues
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = schedule ]; then
            issues=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --label needs-spec --limit 20 --json number | jq -c 'map(.number)')
          else
            issues=$(jq -cn --argjson number "$ISSUE_NUMBER" '[$number]')
          fi
          echo "issues=$issues" >> "$GITHUB_OUTPUT"

  triage:
    needs: discover
    if: needs.discover.outputs.issues != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        issue: ${{ fromJSON(needs.discover.outputs.issues) }}
    concurrency:
      group: issue-triage-${{ matrix.issue }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: legreffier
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Prepare issue evidence and task contract
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ matrix.issue }}
          SWEEP: ${{ github.event_name == 'schedule' }}
        run: node .github/scripts/issue-triage.mjs prepare

      # Register the profile and its input-only policy on the team before use.
      - name: Assess the issue with MoltNet
        id: task
        if: steps.prepare.outputs.eligible == 'true'
        uses: ./packages/agent-daemon-action
        env:
          MOLTNET_AGENT_KEY: ${{ secrets.MOLTNET_AGENT_KEY }}
          MOLTNET_AGENT_NAME: ${{ vars.MOLTNET_AGENT_NAME }}
          MOLTNET_API_URL: ${{ vars.MOLTNET_API_URL }}
          MOLTNET_TEAM_ID: ${{ vars.MOLTNET_TEAM_ID }}
          MOLTNET_DIARY_ID: ${{ vars.MOLTNET_DIARY_ID }}
          MOLTNET_PRIVATE_KEY: ${{ secrets.MOLTNET_PRIVATE_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        with:
          task-spec-path: ${{ steps.prepare.outputs.spec }}
          profile: legreffier-issue-triage-v1
          providers: id=ollama-cloud base-url=https://ollama.com/v1 key-env=OLLAMA_API_KEY
          running-timeout-sec: '240'
          max-attempts: '1'

      - name: Mint issue-writing App token
        id: app-token
        if: steps.task.outputs.task-id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MOLTNET_GITHUB_APP_ID }}
          private-key: ${{ secrets.MOLTNET_GITHUB_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write

      - name: Apply validated result
        if: steps.task.outputs.task-id != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SNAPSHOT: ${{ steps.prepare.outputs.snapshot }}
          TASK_ID: ${{ steps.task.outputs.task-id }}
          SWEEP: ${{ github.event_name == 'schedule' }}
          MOLTNET_AGENT_KEY: ${{ secrets.MOLTNET_AGENT_KEY }}
          MOLTNET_API_URL: ${{ vars.MOLTNET_API_URL }}
          MOLTNET_TEAM_ID: ${{ vars.MOLTNET_TEAM_ID }}
        run: node .github/scripts/issue-triage.mjs publish
