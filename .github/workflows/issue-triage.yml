name: Issue Triage

# Issue evidence is extracted by a tool-free task and passed to a classifier
# task. Only this trusted workflow changes labels or comments after validating
# both accepted outputs. Category labels require a confident classifier result.
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Open issue number to triage again
        required: true
        type: number

permissions: {}

jobs:
  invite:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.state == 'open'
    concurrency:
      group: issue-triage-pilot
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: legreffier
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Mint issue-writing App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MOLTNET_GITHUB_APP_ID }}
          private-key: ${{ secrets.MOLTNET_GITHUB_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write

      - name: Create or refresh triage invitation
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node .github/scripts/issue-triage.mjs invite

  triage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.issue.state == 'open' &&
       github.event.comment.body == '/triage' &&
       github.event.comment.user.type == 'User' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.comment.author_association))
    env:
      # The action defaults to the workspace CLI version, which may precede
      # its npm publication after a release-please merge.
      MOLTNET_CLI_VERSION: '3.19.0'
    concurrency:
      group: issue-triage-pilot
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: legreffier
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Prepare issue evidence and task contract
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
        run: node .github/scripts/issue-triage.mjs prepare

      # Register both profiles and the input-only policy on the team before use.
      - name: Extract issue evidence with MoltNet
        id: extract
        if: steps.prepare.outputs.eligible == 'true'
        uses: getlarge/themoltnet/packages/agent-daemon-action@e82895cd187297d4531f853661e7d667a1243b35 # v0
        env:
          MOLTNET_AGENT_KEY: ${{ secrets.MOLTNET_AGENT_KEY }}
          MOLTNET_AGENT_NAME: ${{ vars.MOLTNET_AGENT_NAME }}
          MOLTNET_API_URL: ${{ vars.MOLTNET_API_URL }}
          MOLTNET_TEAM_ID: ${{ vars.MOLTNET_TEAM_ID }}
          MOLTNET_DIARY_ID: ${{ vars.MOLTNET_DIARY_ID }}
          MOLTNET_PRIVATE_KEY: ${{ secrets.MOLTNET_PRIVATE_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        with:
          task-spec-path: ${{ steps.prepare.outputs.spec }}
          profile: legreffier-issue-triage-v1
          providers: id=ollama-cloud base-url=https://ollama.com/v1 key-env=OLLAMA_API_KEY
          running-timeout-sec: '240'
          max-attempts: '1'

      - name: Prepare classifier task from accepted evidence
        id: classifier-spec
        if: steps.extract.outputs.task-id != '' && vars.MOLTNET_ISSUE_CLASSIFIER_ENABLED == 'true'
        continue-on-error: true
        env:
          SNAPSHOT: ${{ steps.prepare.outputs.snapshot }}
          EXTRACTION_TASK_ID: ${{ steps.extract.outputs.task-id }}
          EXTRACTION_CORRELATION_ID: ${{ steps.extract.outputs.correlation-id }}
          MOLTNET_AGENT_KEY: ${{ secrets.MOLTNET_AGENT_KEY }}
          MOLTNET_API_URL: ${{ vars.MOLTNET_API_URL }}
          MOLTNET_TEAM_ID: ${{ vars.MOLTNET_TEAM_ID }}
        run: node .github/scripts/issue-triage.mjs prepare-classifier

      - name: Classify the issue with MoltNet
        id: classify
        if: steps.classifier-spec.outcome == 'success' && steps.classifier-spec.outputs.spec != ''
        continue-on-error: true
        uses: getlarge/themoltnet/packages/agent-daemon-action@e82895cd187297d4531f853661e7d667a1243b35 # v0
        env:
          MOLTNET_AGENT_KEY: ${{ secrets.MOLTNET_AGENT_KEY }}
          MOLTNET_AGENT_NAME: ${{ vars.MOLTNET_AGENT_NAME }}
          MOLTNET_API_URL: ${{ vars.MOLTNET_API_URL }}
          MOLTNET_TEAM_ID: ${{ vars.MOLTNET_TEAM_ID }}
          MOLTNET_DIARY_ID: ${{ vars.MOLTNET_DIARY_ID }}
          MOLTNET_PRIVATE_KEY: ${{ secrets.MOLTNET_PRIVATE_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        with:
          task-spec-path: ${{ steps.classifier-spec.outputs.spec }}
          profile: legreffier-issue-classifier-v2
          providers: id=ollama-cloud base-url=https://ollama.com/v1 key-env=OLLAMA_API_KEY
          running-timeout-sec: '240'
          max-attempts: '1'

      - name: Mint issue-writing App token
        id: app-token
        if: steps.extract.outputs.task-id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MOLTNET_GITHUB_APP_ID }}
          private-key: ${{ secrets.MOLTNET_GITHUB_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write

      - name: Apply validated result
        if: steps.extract.outputs.task-id != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SNAPSHOT: ${{ steps.prepare.outputs.snapshot }}
          EXTRACTION_TASK_ID: ${{ steps.extract.outputs.task-id }}
          EXTRACTION_CORRELATION_ID: ${{ steps.extract.outputs.correlation-id }}
          CLASSIFIER_TASK_ID: ${{ steps.classify.outcome == 'success' && steps.classify.outputs.task-id || '' }}
          CLASSIFIER_CORRELATION_ID: ${{ steps.classify.outcome == 'success' && steps.classify.outputs.correlation-id || '' }}
          MOLTNET_AGENT_KEY: ${{ secrets.MOLTNET_AGENT_KEY }}
          MOLTNET_API_URL: ${{ vars.MOLTNET_API_URL }}
          MOLTNET_TEAM_ID: ${{ vars.MOLTNET_TEAM_ID }}
        run: node .github/scripts/issue-triage.mjs publish
