name: LeGreffier Complexity Review

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [ready_for_review, synchronize]

permissions: {}

concurrency:
  group: legreffier-complexity-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  complexity-review:
    if: |
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@legreffier /complexity-review') &&
        !endsWith(github.event.comment.user.login, '[bot]')) ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: legreffier
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # MoltNet credentials are set at the job level (not as composite
      # action inputs) because GitHub Actions YAML expression substitution
      # collapses newlines in multi-line secrets — see issue #121 / the
      # legreffier diary for the incident write-up. Composite-action steps
      # inherit job env directly, with no string-substitution round trip.
      MOLTNET_AGENT_NAME: ${{ vars.MOLTNET_AGENT_NAME }}
      MOLTNET_IDENTITY_ID: ${{ secrets.MOLTNET_IDENTITY_ID }}
      MOLTNET_CLIENT_ID: ${{ secrets.MOLTNET_CLIENT_ID }}
      MOLTNET_CLIENT_SECRET: ${{ secrets.MOLTNET_CLIENT_SECRET }}
      MOLTNET_PUBLIC_KEY: ${{ secrets.MOLTNET_PUBLIC_KEY }}
      MOLTNET_PRIVATE_KEY: ${{ secrets.MOLTNET_PRIVATE_KEY }}
      MOLTNET_FINGERPRINT: ${{ secrets.MOLTNET_FINGERPRINT }}
      MOLTNET_TEAM_ID: ${{ vars.MOLTNET_TEAM_ID }}
      MOLTNET_DIARY_ID: ${{ vars.MOLTNET_DIARY_ID }}
      MOLTNET_API_URL: ${{ vars.MOLTNET_API_URL }}
      MOLTNET_GITHUB_APP_ID: ${{ vars.MOLTNET_GITHUB_APP_ID }}
      MOLTNET_GITHUB_APP_INSTALLATION_ID: ${{ vars.MOLTNET_GITHUB_APP_INSTALLATION_ID }}
      MOLTNET_GITHUB_APP_SLUG: ${{ vars.MOLTNET_GITHUB_APP_SLUG }}
      MOLTNET_GITHUB_APP_PRIVATE_KEY: ${{ secrets.MOLTNET_GITHUB_APP_PRIVATE_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      PI_AUTH_JSON: ${{ secrets.PI_AUTH_JSON }}
    steps:
      - name: Guard trusted complexity runtime changes
        id: runtime-guard
        uses: actions/github-script@v8
        with:
          script: |
            const pullNumber =
              context.eventName === 'pull_request'
                ? context.payload.pull_request.number
                : context.payload.issue.number;
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                per_page: 100,
              },
            );
            const runtimePaths = [
              '.github/workflows/legreffier-complexity-review.yml',
              'tools/src/tasks/compose-pr-review.ts',
              'tools/src/tasks/pr-complexity-review.ts',
              'tools/src/tasks/complexity-review-comment.ts',
              'tools/src/tasks/read-task-output.ts',
              'packages/agent-daemon-action/',
            ];
            const matches = files
              .map(file => file.filename)
              .filter(path => runtimePaths.some(runtime =>
                runtime.endsWith('/') ? path.startsWith(runtime) : path === runtime,
              ));
            const skip = matches.length > 0;
            core.setOutput('skip', String(skip));
            if (skip) {
              core.notice(
                `Skipping self-review because trusted complexity runtime changes: ${matches.join(', ')}`,
              );
            }

      - if: steps.runtime-guard.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          # Always execute trusted workflow/runtime code. The reviewed head is
          # fetched below as inert git data and never checked out or executed.
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - if: steps.runtime-guard.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
      - if: steps.runtime-guard.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.runtime-guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Compose pr_review (complexity) task spec
        id: compose
        if: steps.runtime-guard.outputs.skip != 'true'
        env:
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.issue.number }}
          PR_HEAD_REF: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
        run: |
          set -euo pipefail
          head_ref="$PR_HEAD_REF"
          if [ -z "$head_ref" ]; then
            head_ref="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)"
          fi
          branch_tag="$(printf '%s' "$head_ref" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g' \
            | cut -c1-121)"
          if [ -z "$branch_tag" ]; then
            branch_tag="unknown"
          fi
          task_spec_path="$RUNNER_TEMP/pr-review-task-spec.json"
          node --import tsx tools/src/tasks/compose-pr-review.ts \
            --pr "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            > "$task_spec_path"
          head_sha="$(jq -r '.reviewRevision' "$task_spec_path")"
          base_sha="$(jq -r '.reviewBaseRevision' "$task_spec_path")"
          if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::composer did not return full reviewed revisions" >&2
            exit 1
          fi
          echo "task-spec-path=$task_spec_path" >> "$GITHUB_OUTPUT"
          echo "base-sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head-sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "pr-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "task-tags=ci,source:github-actions,workflow:legreffier-complexity-review,repo:$GITHUB_REPOSITORY,agent-daemon,agent:legreffier,review:pr,review:complexity,pr:$PR_NUMBER,branch:$branch_tag,revision:$head_sha" >> "$GITHUB_OUTPUT"

      - name: Fetch immutable review revisions as inert git data
        if: steps.runtime-guard.outputs.skip != 'true'
        env:
          BASE_SHA: ${{ steps.compose.outputs.base-sha }}
          HEAD_SHA: ${{ steps.compose.outputs.head-sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"

      - name: Mark complexity comment in progress
        if: steps.runtime-guard.outputs.skip != 'true'
        env:
          PR_NUMBER: ${{ steps.compose.outputs.pr-number }}
          HEAD_SHA: ${{ steps.compose.outputs.head-sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --import tsx tools/src/tasks/complexity-review-comment.ts \
            --mode start \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --revision "$HEAD_SHA" \
            --run-url "$RUN_URL"

      - name: Run task
        id: review
        if: steps.runtime-guard.outputs.skip != 'true'
        continue-on-error: true
        uses: ./packages/agent-daemon-action
        with:
          task-spec-path: ${{ steps.compose.outputs.task-spec-path }}
          tags: ${{ steps.compose.outputs.task-tags }}
          cancel-superseded: 'true'
          supersession-tags: workflow:legreffier-complexity-review,pr:${{ steps.compose.outputs.pr-number }}
          skip-validation: 'false'
          max-attempts: '2'
          profile: ${{ vars.MOLTNET_AGENT_PROFILE }}

      - name: Read accepted complexity output
        id: result
        if: steps.runtime-guard.outputs.skip != 'true' && steps.review.outcome == 'success'
        env:
          TASK_ID: ${{ steps.review.outputs.task-id }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/complexity-review-result.json"
          node --import tsx tools/src/tasks/read-task-output.ts \
            --task-id "$TASK_ID" \
            --team-id "$MOLTNET_TEAM_ID" \
            --agent-name "$MOLTNET_AGENT_NAME" \
            > "$result"
          echo "path=$result" >> "$GITHUB_OUTPUT"

      - name: Publish revision-aware complexity comment
        if: always() && !cancelled() && steps.runtime-guard.outputs.skip != 'true'
        env:
          PR_NUMBER: ${{ steps.compose.outputs.pr-number }}
          HEAD_SHA: ${{ steps.compose.outputs.head-sha }}
          TASK_ID: ${{ steps.review.outputs.task-id }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          RESULT_PATH: ${{ steps.result.outputs.path }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          args=(
            --mode publish
            --repo "$GITHUB_REPOSITORY"
            --pr "$PR_NUMBER"
            --revision "$HEAD_SHA"
            --run-url "$RUN_URL"
          )
          if [ -n "${TASK_ID:-}" ]; then
            args+=(--task-id "$TASK_ID")
          fi
          if [ "$REVIEW_OUTCOME" = "success" ]; then
            args+=(--review-succeeded --result-path "$RESULT_PATH")
          fi
          node --import tsx tools/src/tasks/complexity-review-comment.ts "${args[@]}"

      - name: Enforce complexity task success
        if: always() && !cancelled() && steps.runtime-guard.outputs.skip != 'true' && steps.review.outcome != 'success'
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          echo "::error::complexity review task ended with $REVIEW_OUTCOME" >&2
          exit 1
