name: LeGreffier Complexity Review
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
  issue_comment:
    types: [created]
permissions: {}
# Only eligible comments share the PR review group; unrelated comments cannot
# cancel an active review. Keep the predicate in sync with jobs.review.if.
concurrency:
  group: >-
    legreffier-complexity-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{
    (github.event_name == 'issue_comment' &&
    !(contains(github.event.comment.body, '@legreffier /complexity-review') &&
    !endsWith(github.event.comment.user.login, '[bot]') &&
    contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    && github.run_id || 'review' }}
  cancel-in-progress: true
jobs:
  review:
    if: |
      vars.MOLTNET_COMPLEXITY_REVIEW_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@legreffier /complexity-review') &&
        !endsWith(github.event.comment.user.login, '[bot]') &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR')))
    uses: getlarge/themoltnet/.github/workflows/complexity-review-reusable.yml@main
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
    with:
      environment: legreffier
      profile: legreffier-complexity-review-v2
      providers: id=ollama-cloud base-url=https://ollama.com/v1 key-env=OLLAMA_API_KEY
      runtime-ref: ${{ github.event.pull_request.base.ref == github.event.repository.default_branch && github.event.pull_request.base.sha || github.event.repository.default_branch }}
      protected-paths: |
        .github/workflows/legreffier-complexity-review.yml
        .github/workflows/complexity-review-reusable.yml
        .github/complexity-review.json
        .github/runtime-profiles/legreffier-complexity-review-
        .github/runtime-policies/legreffier-complexity-review-
        libs/complexity-review/
        packages/complexity-review-action/
        packages/agent-daemon-action/
