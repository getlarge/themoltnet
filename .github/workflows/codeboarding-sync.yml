name: CodeBoarding sync

on:
  push:
    branches: [main]
    # Prevent the sync commit from triggering another analysis. Keep the list
    # explicit so changes to `.codeboarding/.codeboardingignore` still run.
    paths-ignore:
      - '.codeboarding/*.md'
      - '.codeboarding/analysis.json'
      - '.codeboarding/static_analysis.pkl'
      - '.codeboarding/static_analysis.sha'
      - '.codeboarding/codeboarding_version.json'
      - '.codeboarding/health/**'
  workflow_dispatch:

permissions:
  contents: write
  # CodeBoarding uses a short-lived OIDC token for its free hosted tier.
  id-token: write

concurrency:
  group: codeboarding-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - uses: CodeBoarding/CodeBoarding-action@v1
        with:
          mode: sync
          # CodeBoarding maps llm_api_key to OLLAMA_BASE_URL for this provider;
          # its engine reads the cloud credential separately from the job env.
          # Fall back to the free OIDC tier when the secret is unavailable.
          llm_provider: ${{ secrets.OLLAMA_API_KEY != '' && 'ollama' || 'openrouter' }}
          llm_api_key: ${{ secrets.OLLAMA_API_KEY != '' && 'https://ollama.com' || '' }}
          agent_model: ${{ secrets.OLLAMA_API_KEY != '' && 'gemma4:31b-cloud' || '' }}
          parsing_model: ${{ secrets.OLLAMA_API_KEY != '' && 'gpt-oss:20b-cloud' || '' }}
          # Keep generated output separate from the canonical hand-maintained
          # architecture guide at docs/understand/architecture.md.
          write_architecture_md: false
