name: CodeBoarding sync

on:
  push:
    branches: [main]
    # Prevent the sync commit from triggering another analysis. Keep the list
    # explicit so changes to `.codeboarding/.codeboardingignore` still run.
    paths-ignore:
      - '.codeboarding/*.md'
      - '.codeboarding/analysis.json'
      - '.codeboarding/fingerprint.json'
      - '.codeboarding/static_analysis.pkl'
      - '.codeboarding/static_analysis.sha'
      - '.codeboarding/codeboarding_version.json'
      - '.codeboarding/health/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # CodeBoarding uses a short-lived OIDC token for its free hosted tier.
  id-token: write

concurrency:
  group: codeboarding-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The existing LeGreffier GitHub App credentials are scoped to this
    # environment.
    environment: legreffier
    steps:
      - name: Mint CodeBoarding sync token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.MOLTNET_GITHUB_APP_ID }}
          private-key: ${{ secrets.MOLTNET_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: CodeBoarding/CodeBoarding-action@v1
        with:
          mode: sync
          # Protected main requires a rolling PR. Use an App token instead of
          # GITHUB_TOKEN so opening/updating that PR triggers required checks.
          sync_strategy: pull_request
          github_token: ${{ steps.app-token.outputs.token }}
          # Fall back to the free OIDC tier when the secret is unavailable.
          llm: ${{ secrets.OLLAMA_API_KEY != '' && 'ollama' || 'hosted' }}
          ollama_api_key: ${{ secrets.OLLAMA_API_KEY }}
          ollama_base_url: ${{ secrets.OLLAMA_API_KEY != '' && 'https://ollama.com' || '' }}
          agent_model: ${{ secrets.OLLAMA_API_KEY != '' && 'gemma4:31b-cloud' || '' }}
          parsing_model: ${{ secrets.OLLAMA_API_KEY != '' && 'gpt-oss:20b-cloud' || '' }}
