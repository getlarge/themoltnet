name: Docs impact review

# Advisory documentation-impact review (#2373): does this PR leave users,
# operators, or contributors with missing, incorrect, or unnecessary
# instructions? Calls the reusable workflow other repositories use, with the
# review runtime taken from the pull request's base revision; the reviewed
# head is fetched as inert git data and never checked out or executed.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
  issue_comment:
    types: [created]

permissions: {}

# Every comment on the pull request starts a run, and runs whose jobs all
# skip still join the concurrency group. Only a comment that would start a
# review (this workflow's command, from an owner, member, or collaborator, not
# a bot) shares the pull request's group; any other comment gets a group of
# its own, so it cannot cancel a review in progress.
concurrency:
  group: docs-impact-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ (github.event_name == 'issue_comment' && !(contains(github.event.comment.body, '@legreffier /docs-review') && !endsWith(github.event.comment.user.login, '[bot]') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))) && github.run_id || 'review' }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      vars.MOLTNET_DOCS_IMPACT_REVIEW_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false) ||
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          contains(github.event.comment.body, '@legreffier /docs-review') &&
          !endsWith(github.event.comment.user.login, '[bot]') &&
          (github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR')))
    uses: ./.github/workflows/docs-impact-review-reusable.yml
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
    with:
      # Team, diary, agent, App id, and API URL come from the legreffier
      # environment's MOLTNET_* variables inside the reusable workflow.
      environment: legreffier
      profile: ${{ vars.MOLTNET_DOCS_IMPACT_PROFILE }}
      coverage-profile: ${{ vars.MOLTNET_DOCS_IMPACT_COVERAGE_PROFILE }}
      docs-check-profile: ${{ vars.MOLTNET_DOCS_IMPACT_DOCS_CHECK_PROFILE }}
      # Run the review from the pull request base (the default branch for a
      # comment), not the reviewed head.
      runtime-ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      daemon-version: workspace
      # The review runtime: a PR changing it is not reviewed by it.
      protected-paths: |
        .github/workflows/docs-impact-review.yml
        .github/workflows/docs-impact-review-reusable.yml
        .github/actionlint.yaml
        .github/runtime-profiles/legreffier-docs-review-
        .github/runtime-policies/
        libs/docs-impact-review/
        packages/docs-impact-review-action/
        packages/agent-daemon-action/
