name: Docs impact review

# Advisory documentation-impact review (#2373): does this PR leave users,
# operators, or contributors with missing, incorrect, or unnecessary
# instructions? Runs trusted base-branch code only; the reviewed head is
# fetched as inert git data and never checked out or executed.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: docs-impact-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: |
      vars.MOLTNET_DOCS_IMPACT_REVIEW_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false) ||
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          contains(github.event.comment.body, '@legreffier /docs-review') &&
          !endsWith(github.event.comment.user.login, '[bot]') &&
          (github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      pr-number: ${{ steps.facts.outputs.pr-number }}
      base-sha: ${{ steps.facts.outputs.base-sha }}
      head-sha: ${{ steps.facts.outputs.head-sha }}
      correlation-id: ${{ steps.facts.outputs.correlation-id }}
      profile: ${{ steps.facts.outputs.profile }}
      coverage-profile: ${{ steps.facts.outputs.coverage-profile }}
      docs-check-profile: ${{ steps.facts.outputs.docs-check-profile }}
      worker-profiles: ${{ steps.facts.outputs.worker-profiles }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Collect pull request facts and pin revisions
        id: facts
        uses: actions/github-script@v8
        env:
          REVIEW_PROFILE: ${{ vars.MOLTNET_DOCS_IMPACT_PROFILE }}
          COVERAGE_PROFILE: ${{ vars.MOLTNET_DOCS_IMPACT_COVERAGE_PROFILE }}
          DOCS_CHECK_PROFILE: ${{ vars.MOLTNET_DOCS_IMPACT_DOCS_CHECK_PROFILE }}
        with:
          script: |
            const crypto = require('node:crypto');
            const fs = require('node:fs');
            const path = require('node:path');
            const pullNumber =
              context.eventName === 'pull_request'
                ? context.payload.pull_request.number
                : context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const factsPath = path.join(process.env.RUNNER_TEMP, 'pr-facts.json');
            fs.writeFileSync(
              factsPath,
              JSON.stringify({
                headRepo: pr.head.repo?.full_name ?? null,
                baseRepo: `${context.repo.owner}/${context.repo.repo}`,
                author: pr.user.login,
                files: files.map((file) => ({
                  filename: file.filename,
                  ...(file.previous_filename
                    ? { previous_filename: file.previous_filename }
                    : {}),
                })),
              }),
            );
            const profile = process.env.REVIEW_PROFILE;
            if (!profile) {
              core.setFailed('MOLTNET_DOCS_IMPACT_PROFILE is not configured');
              return;
            }
            const coverageProfile = process.env.COVERAGE_PROFILE || profile;
            const docsCheckProfile = process.env.DOCS_CHECK_PROFILE || profile;
            // One correlation per run: drain workers claim only this review's
            // tasks, and a rerun never collides with a cancelled one.
            const seed = [
              `${context.repo.owner}/${context.repo.repo}`,
              pr.number,
              pr.head.sha,
              context.runId,
              context.runAttempt,
            ].join(':');
            const bytes = crypto.createHash('sha256').update(seed).digest().subarray(0, 16);
            bytes[6] = (bytes[6] & 0x0f) | 0x50;
            bytes[8] = (bytes[8] & 0x3f) | 0x80;
            const hex = bytes.toString('hex');
            const correlationId = `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
            core.setOutput('facts-path', factsPath);
            core.setOutput('pr-number', String(pr.number));
            core.setOutput('base-sha', pr.base.sha);
            core.setOutput('head-sha', pr.head.sha);
            core.setOutput('correlation-id', correlationId);
            core.setOutput('profile', profile);
            core.setOutput('coverage-profile', coverageProfile);
            core.setOutput('docs-check-profile', docsCheckProfile);
            // One drain worker per distinct profile, so stages on different
            // models (e.g. coverage and docs check) run in parallel.
            core.setOutput(
              'worker-profiles',
              JSON.stringify([...new Set([profile, coverageProfile, docsCheckProfile])]),
            );

      # Gate code from the PR base, the same revision the review and worker
      # jobs run; the PR head is never checked out.
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.facts.outputs.base-sha }}
          sparse-checkout: apps/docs-impact-review/src/eligibility.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check eligibility (fork, Dependabot, review-runtime changes)
        id: gate
        env:
          FACTS: ${{ steps.facts.outputs.facts-path }}
        run: |
          set -euo pipefail
          node apps/docs-impact-review/src/eligibility.ts "$FACTS" | tee -a "$GITHUB_OUTPUT"
          if grep -q '^skip=true' "$GITHUB_OUTPUT"; then
            reason="$(grep '^reason=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
            echo "::notice::Docs impact review skipped: $reason"
            printf '### Docs impact review skipped\n\n%s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          fi

  review:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    # Generous until p95 is measured in CI; the target is a 2–3 minute review.
    timeout-minutes: 10
    environment: legreffier
    # The comment is written with the LeGreffier App token minted below, so
    # the workflow token only reads the repository and the pull request.
    permissions:
      contents: read
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MOLTNET_AGENT_KEY: ${{ secrets.MOLTNET_AGENT_KEY }}
      MOLTNET_AGENT_NAME: ${{ vars.MOLTNET_AGENT_NAME }}
      MOLTNET_API_URL: ${{ vars.MOLTNET_API_URL }}
      MOLTNET_TEAM_ID: ${{ vars.MOLTNET_TEAM_ID }}
      MOLTNET_DIARY_ID: ${{ vars.MOLTNET_DIARY_ID }}
      PR_NUMBER: ${{ needs.prepare.outputs.pr-number }}
      BASE_SHA: ${{ needs.prepare.outputs.base-sha }}
      HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.base-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the reviewed revisions as inert git data
        run: git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Comments are attributed to the agent's GitHub App, scoped to this
      # repository with only the permissions the comment needs.
      - name: Mint the LeGreffier App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MOLTNET_GITHUB_APP_ID }}
          private-key: ${{ secrets.MOLTNET_GITHUB_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          # PR conversation comments need pull-requests write; issues write
          # alone is refused on a pull request.
          permission-pull-requests: write

      # The placeholder is cosmetic: a failure here must not skip the review.
      - name: Mark the review in progress
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_AUTHOR: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          node --import tsx apps/docs-impact-review/src/comment.ts \
            --mode start --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" \
            --revision "$HEAD_SHA" --run-url "$RUN_URL" \
            --author "$COMMENT_AUTHOR"

      - name: Review documentation impact
        id: review
        continue-on-error: true
        env:
          CORRELATION_ID: ${{ needs.prepare.outputs.correlation-id }}
          PROFILE: ${{ needs.prepare.outputs.profile }}
          COVERAGE_PROFILE: ${{ needs.prepare.outputs.coverage-profile }}
          DOCS_CHECK_PROFILE: ${{ needs.prepare.outputs.docs-check-profile }}
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/docs-impact-summary.json"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          node --import tsx apps/docs-impact-review/src/main.ts \
            --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --team "$MOLTNET_TEAM_ID" --diary "$MOLTNET_DIARY_ID" \
            --profile "$PROFILE" \
            --profile-coverage "$COVERAGE_PROFILE" \
            --profile-docs-check "$DOCS_CHECK_PROFILE" \
            --correlation-id "$CORRELATION_ID" \
            > "$summary"

      - name: Publish the review comment
        if: always() && !cancelled() && steps.app-token.outcome == 'success'
        env:
          SUMMARY: ${{ steps.review.outputs.summary }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT_AUTHOR: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          node --import tsx apps/docs-impact-review/src/comment.ts \
            --mode publish --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" \
            --revision "$HEAD_SHA" --run-url "$RUN_URL" \
            --author "$COMMENT_AUTHOR" \
            --report "${SUMMARY:-$RUNNER_TEMP/docs-impact-summary.json}"

      # Advisory, not required for merge: publish first, then make a review
      # that did not complete visible as a failed run instead of a green one.
      - name: Fail when the review did not complete
        if: always() && !cancelled()
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          SUMMARY: ${{ steps.review.outputs.summary }}
        run: |
          if [ "$REVIEW_OUTCOME" != "success" ]; then
            echo "::error::docs impact review step ended with $REVIEW_OUTCOME" >&2
            exit 1
          fi
          if [ -f "${SUMMARY:-}" ] && jq -e '.reports[0].status == "failed"' "$SUMMARY" >/dev/null; then
            echo "::error::docs impact review failed: $(jq -r '.reports[0].error' "$SUMMARY")" >&2
            exit 1
          fi

      - name: Record the timing breakdown
        if: always() && !cancelled()
        env:
          SUMMARY: ${{ steps.review.outputs.summary }}
        run: |
          if [ -f "${SUMMARY:-}" ]; then
            {
              echo '### Docs impact review timings'
              echo '```json'
              jq '{latencyMs: .summary.latencyMs, tokens: .summary.tokens}' "$SUMMARY"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  workers:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    # The review job is authoritative: a worker failure surfaces there as a
    # failed or unclaimed stage, never as a false clean result.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.prepare.outputs.worker-profiles) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: legreffier
    permissions:
      contents: read
    env:
      MOLTNET_AGENT_KEY: ${{ secrets.MOLTNET_AGENT_KEY }}
      MOLTNET_AGENT_NAME: ${{ vars.MOLTNET_AGENT_NAME }}
      MOLTNET_API_URL: ${{ vars.MOLTNET_API_URL }}
      MOLTNET_TEAM_ID: ${{ vars.MOLTNET_TEAM_ID }}
      MOLTNET_PRIVATE_KEY: ${{ secrets.MOLTNET_PRIVATE_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.base-sha }}
          persist-credentials: false
      - name: Fetch the reviewed commit as inert git data
        env:
          HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
        run: git fetch --no-tags --depth=1 origin "$HEAD_SHA"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Drain this review's tasks
        uses: ./packages/agent-daemon-action
        with:
          agent-name: ${{ vars.MOLTNET_AGENT_NAME }}
          mode: drain
          task-types: freeform
          correlation-id: ${{ needs.prepare.outputs.correlation-id }}
          # A coverage or docs-check worker's first task only exists after the
          # review job has installed and extraction has finished, which on a
          # cold runner can take several minutes. Tasks carry a dispatch
          # timeout, so an unclaimed stage fails rather than hanging.
          wait-for-first-task-sec: '420'
          wait-after-task-sec: '120'
          # Chained stages are created as earlier ones finish; a short
          # backoff cap keeps the next claim within seconds.
          max-poll-interval-ms: '3000'
          profile: ${{ matrix.profile }}
          daemon-version: workspace
