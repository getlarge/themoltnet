name: Docs impact review

# Advisory documentation-impact review (#2373): does this PR leave users,
# operators, or contributors with missing, incorrect, or unnecessary
# instructions? Calls the reusable workflow other repositories use, from the
# default branch, with the review runtime taken from the default branch (or
# the pull request base when that is the default branch); the reviewed head is
# fetched as inert git data and never checked out or executed.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
  issue_comment:
    types: [created]

permissions: {}

# Every comment on the pull request starts a run, and runs whose jobs all
# skip (including a pull_request run on a draft) still join the concurrency
# group. Only a comment that would start a review (this workflow's command,
# from an owner, member, or collaborator, not a bot) shares the pull
# request's group; any other comment gets a group of its own, so it cannot
# cancel a review in progress. Keep the comment predicate in sync with
# jobs.review.if; a test compares them.
concurrency:
  group: >-
    docs-impact-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{
    (github.event_name == 'issue_comment' &&
    !(contains(github.event.comment.body, '@legreffier /docs-review') &&
    !endsWith(github.event.comment.user.login, '[bot]') &&
    contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    && github.run_id || 'review' }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      vars.MOLTNET_DOCS_IMPACT_REVIEW_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false) ||
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          contains(github.event.comment.body, '@legreffier /docs-review') &&
          !endsWith(github.event.comment.user.login, '[bot]') &&
          (github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR')))
    # The reusable workflow comes from the default branch, like the runtime it
    # checks out. Its jobs run in the legreffier environment and read the
    # secrets and MOLTNET_* variables from it, so none are passed here.
    uses: getlarge/themoltnet/.github/workflows/docs-impact-review-reusable.yml@main
    permissions:
      contents: read
      pull-requests: write
    with:
      environment: legreffier
      profile: ${{ vars.MOLTNET_DOCS_IMPACT_PROFILE }}
      coverage-profile: ${{ vars.MOLTNET_DOCS_IMPACT_COVERAGE_PROFILE }}
      docs-check-profile: ${{ vars.MOLTNET_DOCS_IMPACT_DOCS_CHECK_PROFILE }}
      # The review runtime comes from the default branch: the pull request base
      # when it targets the default branch, the default branch otherwise
      # (including comment triggers). Never the reviewed head.
      runtime-ref: ${{ github.event.pull_request.base.ref == github.event.repository.default_branch && github.event.pull_request.base.sha || github.event.repository.default_branch }}
      # The review runtime: a PR changing it is not reviewed by it.
      protected-paths: |
        .github/workflows/docs-impact-review.yml
        .github/workflows/docs-impact-review-reusable.yml
        .github/actionlint.yaml
        .github/runtime-profiles/legreffier-docs-review-
        .github/runtime-policies/
        libs/docs-impact-review/
        packages/docs-impact-review-action/
        packages/agent-daemon-action/
