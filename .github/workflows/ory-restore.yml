name: Ory Development Identity Restore

# Restores identities only into the isolated development tenant. Production is
# intentionally not a selectable target. The protected environment supplies
# the target URL and expected ID independently; the workflow resolves the ID
# again from the Ory workspace before any restore process can run.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Run ID of the Ory Backup Export that produced the bundle'
        required: true
        type: string
      mode:
        description: 'plan = diff only (no writes); apply = import identities'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      confirm_development_only:
        description: 'Type RESTORE DEVELOPMENT IDENTITIES'
        required: true
        type: string
      limit:
        description: 'Optional: import at most N identities (canary run). Blank = all.'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  restore:
    name: Restore Ory development identities (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ory-restore-development
    steps:
      - name: Require development-only confirmation
        env:
          CONFIRMATION: ${{ inputs.confirm_development_only }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RESTORE DEVELOPMENT IDENTITIES" || {
            echo "::error::Development-only confirmation did not match."
            exit 1
          }

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve and verify development target
        id: target
        env:
          ORY_WORKSPACE_API_KEY: ${{ secrets.ORY_WORKSPACE_API_KEY }}
          ORY_WORKSPACE_ID: ${{ secrets.ORY_WORKSPACE_ID }}
          TARGET_PROJECT_URL: ${{ secrets.ORY_PROJECT_URL }}
          EXPECTED_PROJECT_ID: ${{ secrets.ORY_PROJECT_ID }}
        run: |
          set -euo pipefail
          RESOLVED_PROJECT_ID="$(node infra/ory/resolve-project-target.mjs \
            --workspace "$ORY_WORKSPACE_ID" \
            --project-url "$TARGET_PROJECT_URL" \
            --expected-project "$EXPECTED_PROJECT_ID")"
          echo "project_id=$RESOLVED_PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Download backup bundle
        uses: actions/download-artifact@v8
        with:
          name: ory-backup-${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./ory-backup

      - name: Restore
        env:
          ORY_PROJECT_API_KEY: ${{ secrets.ORY_PROJECT_API_KEY }}
          ORY_BACKUP_PASSPHRASE: ${{ secrets.ORY_BACKUP_PASSPHRASE }}
          ORY_PROJECT_URL: ${{ secrets.ORY_PROJECT_URL }}
          ORY_RESOLVED_PROJECT_ID: ${{ steps.target.outputs.project_id }}
          RESTORE_LIMIT: ${{ inputs.limit }}
          RESTORE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          LIMIT_ARGS=()
          if [ -n "$RESTORE_LIMIT" ]; then
            [[ "$RESTORE_LIMIT" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::limit must be a positive integer"
              exit 1
            }
            LIMIT_ARGS=(--limit "$RESTORE_LIMIT")
          fi
          node infra/ory/restore.mjs \
            --bundle ./ory-backup/bundle.tar.gz.enc \
            --target-project "$ORY_RESOLVED_PROJECT_ID" \
            --mode "$RESTORE_MODE" \
            --work-dir ./.ory-restore \
            --map-out ./.ory-restore/identity-id-map.json \
            "${LIMIT_ARGS[@]}"

      - name: Upload ID mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ory-restore-map-${{ github.run_id }}
          path: ./.ory-restore/identity-id-map.json
          if-no-files-found: warn
          retention-days: 30
