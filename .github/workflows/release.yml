  release-cli:
    name: Release CLI binaries
    needs: resolve-publish
    if: ${{ always() && needs.resolve-publish.outputs.cli == 'true' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Extract semver from tag
        id: tag
        run: |
          TAG="${{ needs.resolve-publish.outputs.cli-tag }}"
          SEMVER="${TAG#cli-}"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token for Homebrew tap
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.MOLTNET_RELEASE_APP_ID }}
          private-key: ${{ secrets.MOLTNET_RELEASE_APP_KEY }}
          owner: getlarge
          repositories: homebrew-moltnet

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --skip=validate
          workdir: apps/moltnet-cli
        env:
          GOWORK: off
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.semver }}
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Upload binaries to GitHub Release
        run: |
          gh release upload "${{ needs.resolve-publish.outputs.cli-tag }}" \
            apps/moltnet-cli/dist/*.tar.gz \
            apps/moltnet-cli/dist/*.zip \
            apps/moltnet-cli/dist/checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish CLI release
        run: gh release edit "${{ needs.resolve-publish.outputs.cli-tag }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-cli-platforms:
    name: Publish @themoltnet/cli-${{ matrix.npm_dir }} to npm
    needs: [resolve-publish, release-cli]
    if: >-
      ${{
        always() &&
        needs.resolve-publish.outputs.cli == 'true' &&
        needs.release-cli.result == 'success' &&
        !failure() &&
        !cancelled()
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - npm_dir: linux-x64
            archive_suffix: linux_amd64.tar.gz
            binary: moltnet
          - npm_dir: linux-arm64
            archive_suffix: linux_arm64.tar.gz
            binary: moltnet
          - npm_dir: darwin-x64
            archive_suffix: darwin_amd64.tar.gz
            binary: moltnet
          - npm_dir: darwin-arm64
            archive_suffix: darwin_arm64.tar.gz
            binary: moltnet
          - npm_dir: win32-x64
            archive_suffix: windows_amd64.zip
            binary: moltnet.exe
          - npm_dir: win32-arm64
            archive_suffix: windows_arm64.zip
            binary: moltnet.exe
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download release binary
        uses: nick-fields/retry@v4.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-publish.outputs.cli-tag }}
          ARCHIVE_SUFFIX: ${{ matrix.archive_suffix }}
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            SEMVER="${TAG#cli-v}"
            ARCHIVE="moltnet_${SEMVER}_${ARCHIVE_SUFFIX}"
            mkdir -p /tmp/cli-binaries
            # Stay in the repo checkout so gh can infer the repo from git;
            # --dir places the archive where the Extract step expects it.
            gh release download "$TAG" --pattern "$ARCHIVE" --dir /tmp/cli-binaries

      - name: Extract binary
        env:
          TAG: ${{ needs.resolve-publish.outputs.cli-tag }}
          ARCHIVE_SUFFIX: ${{ matrix.archive_suffix }}
          NPM_DIR: ${{ matrix.npm_dir }}
          BINARY: ${{ matrix.binary }}
        run: |
          SEMVER="${TAG#cli-v}"
          ARCHIVE="moltnet_${SEMVER}_${ARCHIVE_SUFFIX}"
          PKG_DIR="packages/cli/npm/${NPM_DIR}"

          mkdir -p "${PKG_DIR}/bin"
          if [[ "${ARCHIVE}" == *.zip ]]; then
            unzip -o "/tmp/cli-binaries/${ARCHIVE}" "${BINARY}" -d "${PKG_DIR}/bin/"
          else
            tar xzf "/tmp/cli-binaries/${ARCHIVE}" -C "${PKG_DIR}/bin/" "${BINARY}"
          fi
          chmod +x "${PKG_DIR}/bin/${BINARY}" 2>/dev/null || true

      - name: Publish platform package
        uses: nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            cd "packages/cli/npm/${{ matrix.npm_dir }}"
            npm publish --access public --provenance

  publish-cli-wrapper:
    name: Publish @themoltnet/cli to npm
    needs: [resolve-publish, publish-cli-platforms]
    if: >-
      ${{
        always() &&
        needs.resolve-publish.outputs.cli == 'true' &&
        needs.publish-cli-platforms.result == 'success' &&
        !failure() &&
        !cancelled()
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # pnpm publish rewrites workspace:* in optionalDependencies to the
      # concrete version so the published tarball resolves on npm.
      - name: Publish @themoltnet/cli
        uses: nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm --filter @themoltnet/cli publish --no-git-checks --access public --provenance

  # The cli is an 8-component linked-versions group. Only apps/moltnet-cli
  # gets a real GitHub release (cli-v<x>); the other 7 siblings use
  # `skip-github-release: true`. release-please still needs a git tag per
  # component to track state — without them its next run logs "Expected
  # 15 releases, only found 8 / Missing 7 paths" and skips cutting the
  # next release.
  #
  # This job is decoupled from npm publishing so a transient tag-creation
  # failure can be retried without hitting "version already exists" on
  # npm. It only needs release-cli (which flips the cli-v<x> GitHub
  # release to non-draft) to have succeeded.
  tag-cli-siblings:
    name: Create linked-versions sibling tags
    needs: [resolve-publish, release-cli]
    if: >-
      ${{
        always() &&
        needs.resolve-publish.outputs.cli == 'true' &&
        needs.release-cli.result == 'success' &&
        !cancelled()
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create sibling tags
        uses: nick-fields/retry@v4.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI_TAG: ${{ needs.resolve-publish.outputs.cli-tag }}
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: |
            set -euo pipefail
            SEMVER="${CLI_TAG#cli-v}"
            COMMIT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CLI_TAG}" --jq '.sha')
            echo "${CLI_TAG} -> ${COMMIT_SHA}"
            for COMPONENT in cli-wrapper cli-darwin-arm64 cli-darwin-x64 cli-linux-arm64 cli-linux-x64 cli-win32-arm64 cli-win32-x64; do
              SIB_TAG="${COMPONENT}-v${SEMVER}"
              if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${SIB_TAG}" >/dev/null 2>&1; then
                echo "  = ${SIB_TAG} already exists"
                continue
              fi
              gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/tags/${SIB_TAG}" \
                -f sha="${COMMIT_SHA}"
              echo "  + ${SIB_TAG}"
            done

  release-legreffier-plugin:
    name: Release LeGreffier Plugin
    needs: resolve-publish
    if: ${{ needs.resolve-publish.outputs.legreffier-plugin == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-publish.outputs.legreffier-plugin-tag }}

      - name: Verify release tag checkout
        env:
          RELEASE_TAG: ${{ needs.resolve-publish.outputs.legreffier-plugin-tag }}
        run: |
          CHECKOUT_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-parse "${RELEASE_TAG}^{commit}")
          if [ "$CHECKOUT_SHA" != "$TAG_SHA" ]; then
            echo "Checkout ${CHECKOUT_SHA} does not match ${RELEASE_TAG} (${TAG_SHA})" >&2
            exit 1
          fi
          echo "Building ${RELEASE_TAG} from ${CHECKOUT_SHA}"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build deterministic LeGreffier plugin archive
        id: package
        env:
          RELEASE_TAG: ${{ needs.resolve-publish.outputs.legreffier-plugin-tag }}
        run: |
          VERSION=$(node -p "require('./packages/legreffier-plugin/package.json').version")
          EXPECTED_TAG="legreffier-plugin-v${VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Expected tag ${EXPECTED_TAG}, got ${RELEASE_TAG}" >&2
            exit 1
          fi

          pnpm exec nx run @themoltnet/legreffier-plugin:check:pack

          ARCHIVE="legreffier-plugin-v${VERSION}.tar.gz"
          tar --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "/tmp/${ARCHIVE}" \
            -C packages/legreffier-plugin/dist .
          cd /tmp
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

          echo "archive=/tmp/${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "checksum=/tmp/${ARCHIVE}.sha256" >> "$GITHUB_OUTPUT"

      - name: Verify immutable release assets
        id: assets
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-publish.outputs.legreffier-plugin-tag }}
        run: |
          ARCHIVE_NAME=$(basename "$ARCHIVE")
          CHECKSUM_NAME=$(basename "$CHECKSUM")
          ASSETS=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          ARCHIVE_EXISTS=false
          CHECKSUM_EXISTS=false
          grep -Fxq "$ARCHIVE_NAME" <<<"$ASSETS" && ARCHIVE_EXISTS=true
          grep -Fxq "$CHECKSUM_NAME" <<<"$ASSETS" && CHECKSUM_EXISTS=true

          if [ "$ARCHIVE_EXISTS" != "$CHECKSUM_EXISTS" ]; then
            echo "Release contains only one of ${ARCHIVE_NAME} and ${CHECKSUM_NAME}; refusing to mutate it" >&2
            exit 1
          fi
          if [ "$ARCHIVE_EXISTS" = false ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EXISTING_DIR=$(mktemp -d)
          gh release download "$RELEASE_TAG" \
            --pattern "$ARCHIVE_NAME" \
            --pattern "$CHECKSUM_NAME" \
            --dir "$EXISTING_DIR"
          (
            cd "$EXISTING_DIR"
            sha256sum --check "$CHECKSUM_NAME"
          )
          NEW_DIGEST=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)
          EXISTING_DIGEST=$(sha256sum "$EXISTING_DIR/$ARCHIVE_NAME" | cut -d' ' -f1)
          if [ "$NEW_DIGEST" != "$EXISTING_DIGEST" ]; then
            echo "Immutable asset ${ARCHIVE_NAME} already exists with a different digest" >&2
            exit 1
          fi
          echo "Existing assets match ${NEW_DIGEST}; upload is unnecessary"
          echo "upload=false" >> "$GITHUB_OUTPUT"

      - name: Attest LeGreffier plugin provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Upload immutable LeGreffier plugin artifacts
        if: steps.assets.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.resolve-publish.outputs.legreffier-plugin-tag }}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.checksum }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.resolve-publish.outputs.legreffier-plugin-tag }}" --draft=false

