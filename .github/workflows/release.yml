name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      engine:
        description: 'Release implementation to run. Keep legacy until Nx has completed its proving period.'
        required: true
        type: choice
        default: legacy
        options:
          - legacy
          - nx
      dry-run:
        description: 'Plan an Nx release without committing, tagging, creating releases, or publishing.'
        required: false
        type: boolean
        default: true
      first-release:
        description: 'Allow Nx to bootstrap projects with no previous release tag.'
        required: false
        type: boolean
        default: false
      republish:
        description: >
          Comma-separated packages to re-publish from existing draft releases.
          Valid values: sdk, os-keyring, tasks-orchestrator, credentials, credential-broker, ctap, yubikey-preview-sign, signer, github-agent, legreffier, legreffier-plugin, cli, api-client, dspy-adapters, skill, design-system, pi-extension, sandbox-gondolin, pi-runtime, shell-command-analyzer, agent-runtime, n8n-nodes-moltnet, node-red-theme, agent-daemon, console, database, landing, mcp-host, mcp-server, rest-api, otel-custom-collector
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

# Both release engines create tags and publish immutable artifacts. Queue every
# invocation of this workflow so a manual Nx release cannot overlap a push that
# is still being handled by Release Please.
concurrency:
  group: release-main
  cancel-in-progress: false

# nx@22 unconditionally loads workspace-root .env at bin startup via plain
# dotenv. Our .env is dotenvx-encrypted, so plain-dotenv pulls ciphertext
# into every variable it defines, which then leaks into every process Nx
# spawns. This flag is the documented opt-out (honored by per-task and
# per-executor env loading); we set it workflow-wide as a defense even
# though nx@22.7.0's bin-level load currently ignores it. When the bin
# eventually honors it (or on a future major version), this guards us.
env:
  NX_LOAD_DOT_ENV_FILES: 'false'

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      sdk-release-created: ${{ steps.release.outputs['libs/sdk--release_created'] }}
      sdk-tag-name: ${{ steps.release.outputs['libs/sdk--tag_name'] }}
      os-keyring-release-created: ${{ steps.release.outputs['libs/os-keyring--release_created'] }}
      os-keyring-tag-name: ${{ steps.release.outputs['libs/os-keyring--tag_name'] }}
      tasks-orchestrator-release-created: ${{ steps.release.outputs['libs/tasks-orchestrator--release_created'] }}
      tasks-orchestrator-tag-name: ${{ steps.release.outputs['libs/tasks-orchestrator--tag_name'] }}
      credentials-release-created: ${{ steps.release.outputs['libs/credentials--release_created'] }}
      credentials-tag-name: ${{ steps.release.outputs['libs/credentials--tag_name'] }}
      credential-broker-release-created: ${{ steps.release.outputs['libs/credential-broker--release_created'] }}
      credential-broker-tag-name: ${{ steps.release.outputs['libs/credential-broker--tag_name'] }}
      ctap-release-created: ${{ steps.release.outputs['libs/ctap--release_created'] }}
      ctap-tag-name: ${{ steps.release.outputs['libs/ctap--tag_name'] }}
      yubikey-preview-sign-release-created: ${{ steps.release.outputs['libs/yubikey-preview-sign--release_created'] }}
      yubikey-preview-sign-tag-name: ${{ steps.release.outputs['libs/yubikey-preview-sign--tag_name'] }}
      signer-release-created: ${{ steps.release.outputs['apps/moltnet-signer--release_created'] }}
      signer-tag-name: ${{ steps.release.outputs['apps/moltnet-signer--tag_name'] }}
      api-client-release-created: ${{ steps.release.outputs['libs/moltnet-api-client--release_created'] }}
      api-client-tag-name: ${{ steps.release.outputs['libs/moltnet-api-client--tag_name'] }}
      api-client-version: ${{ steps.release.outputs['libs/moltnet-api-client--version'] }}
      dspy-adapters-release-created: ${{ steps.release.outputs['libs/dspy-adapters--release_created'] }}
      dspy-adapters-tag-name: ${{ steps.release.outputs['libs/dspy-adapters--tag_name'] }}
      dspy-adapters-version: ${{ steps.release.outputs['libs/dspy-adapters--version'] }}
      cli-release-created: ${{ steps.release.outputs['apps/moltnet-cli--release_created'] }}
      cli-tag-name: ${{ steps.release.outputs['apps/moltnet-cli--tag_name'] }}
      github-agent-release-created: ${{ steps.release.outputs['packages/github-agent--release_created'] }}
      github-agent-tag-name: ${{ steps.release.outputs['packages/github-agent--tag_name'] }}
      skill-release-created: ${{ steps.release.outputs['packages/openclaw-skill--release_created'] }}
      skill-tag-name: ${{ steps.release.outputs['packages/openclaw-skill--tag_name'] }}
      skill-version: ${{ steps.release.outputs['packages/openclaw-skill--version'] }}
      legreffier-release-created: ${{ steps.release.outputs['packages/legreffier-cli--release_created'] }}
      legreffier-tag-name: ${{ steps.release.outputs['packages/legreffier-cli--tag_name'] }}
      legreffier-plugin-release-created: ${{ steps.release.outputs['packages/legreffier-plugin--release_created'] }}
      legreffier-plugin-tag-name: ${{ steps.release.outputs['packages/legreffier-plugin--tag_name'] }}
      agent-runtime-release-created: ${{ steps.release.outputs['libs/agent-runtime--release_created'] }}
      agent-runtime-tag-name: ${{ steps.release.outputs['libs/agent-runtime--tag_name'] }}
      pi-extension-release-created: ${{ steps.release.outputs['libs/pi-extension--release_created'] }}
      pi-extension-tag-name: ${{ steps.release.outputs['libs/pi-extension--tag_name'] }}
      sandbox-gondolin-release-created: ${{ steps.release.outputs['libs/sandbox-gondolin--release_created'] }}
      sandbox-gondolin-tag-name: ${{ steps.release.outputs['libs/sandbox-gondolin--tag_name'] }}
      pi-runtime-release-created: ${{ steps.release.outputs['libs/pi-runtime--release_created'] }}
      pi-runtime-tag-name: ${{ steps.release.outputs['libs/pi-runtime--tag_name'] }}
      shell-command-analyzer-release-created: ${{ steps.release.outputs['libs/shell-command-analyzer--release_created'] }}
      shell-command-analyzer-tag-name: ${{ steps.release.outputs['libs/shell-command-analyzer--tag_name'] }}
      n8n-nodes-moltnet-release-created: ${{ steps.release.outputs['libs/n8n-nodes-moltnet--release_created'] }}
      n8n-nodes-moltnet-tag-name: ${{ steps.release.outputs['libs/n8n-nodes-moltnet--tag_name'] }}
      node-red-release-created: ${{ steps.release.outputs['libs/node-red-contrib-core--release_created'] }}
      node-red-tag-name: ${{ steps.release.outputs['libs/node-red-contrib-core--tag_name'] }}
      node-red-theme-release-created: ${{ steps.release.outputs['libs/node-red-theme--release_created'] }}
      node-red-theme-tag-name: ${{ steps.release.outputs['libs/node-red-theme--tag_name'] }}
      design-system-release-created: ${{ steps.release.outputs['libs/design-system--release_created'] }}
      design-system-tag-name: ${{ steps.release.outputs['libs/design-system--tag_name'] }}
      agent-daemon-release-created: ${{ steps.release.outputs['apps/agent-daemon--release_created'] }}
      agent-daemon-tag-name: ${{ steps.release.outputs['apps/agent-daemon--tag_name'] }}
      console-release-created: ${{ steps.release.outputs['apps/console--release_created'] }}
      console-tag-name: ${{ steps.release.outputs['apps/console--tag_name'] }}
      console-version: ${{ steps.release.outputs['apps/console--version'] }}
      database-release-created: ${{ steps.release.outputs['libs/database--release_created'] }}
      database-tag-name: ${{ steps.release.outputs['libs/database--tag_name'] }}
      database-version: ${{ steps.release.outputs['libs/database--version'] }}
      landing-release-created: ${{ steps.release.outputs['apps/landing--release_created'] }}
      landing-tag-name: ${{ steps.release.outputs['apps/landing--tag_name'] }}
      landing-version: ${{ steps.release.outputs['apps/landing--version'] }}
      mcp-host-release-created: ${{ steps.release.outputs['apps/mcp-host--release_created'] }}
      mcp-host-tag-name: ${{ steps.release.outputs['apps/mcp-host--tag_name'] }}
      mcp-host-version: ${{ steps.release.outputs['apps/mcp-host--version'] }}
      mcp-server-release-created: ${{ steps.release.outputs['apps/mcp-server--release_created'] }}
      mcp-server-tag-name: ${{ steps.release.outputs['apps/mcp-server--tag_name'] }}
      mcp-server-version: ${{ steps.release.outputs['apps/mcp-server--version'] }}
      rest-api-release-created: ${{ steps.release.outputs['apps/rest-api--release_created'] }}
      rest-api-tag-name: ${{ steps.release.outputs['apps/rest-api--tag_name'] }}
      rest-api-version: ${{ steps.release.outputs['apps/rest-api--version'] }}
      otel-collector-release-created: ${{ steps.release.outputs['infra/otel/custom-collector--release_created'] }}
      otel-collector-tag-name: ${{ steps.release.outputs['infra/otel/custom-collector--tag_name'] }}
      otel-collector-version: ${{ steps.release.outputs['infra/otel/custom-collector--version'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-docker-images:
    name: Publish ${{ matrix.project }}:${{ matrix.version }}
    needs: resolve-publish
    # Manual republish skips release-please, so opt out of GitHub's implicit
    # success() check on the skipped transitive dependency.
    if: ${{ always() && needs.resolve-publish.outputs.docker-has-releases == 'true' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-publish.outputs.docker-matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@v6
        if: ${{ matrix.project == 'otel-custom-collector' }}
        with:
          go-version: '1.25'
          check-latest: true
          cache: true

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm install --frozen-lockfile

      - name: Build and publish multi-platform image
        env:
          NX_DOCKER_RELEASE_PROJECT: ${{ matrix.project }}
          NX_DOCKER_RELEASE_TAG: ${{ matrix.version }}
        run: >-
          pnpm exec nx run
          "$NX_DOCKER_RELEASE_PROJECT:docker:build"
          --configuration=release

      - name: Verify published multi-platform manifest
        env:
          NX_DOCKER_RELEASE_PROJECT: ${{ matrix.project }}
          NX_DOCKER_RELEASE_TAG: ${{ matrix.version }}
        run: >-
          node tools/verify-docker-manifest.mjs
          --project "$NX_DOCKER_RELEASE_PROJECT"
          --tag "$NX_DOCKER_RELEASE_TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NX_DOCKER_RELEASE_GIT_TAG: ${{ matrix.tag }}
        run: gh release edit "$NX_DOCKER_RELEASE_GIT_TAG" --draft=false

  # Unified resolution: merges release-please outputs with manual republish
  # inputs so downstream jobs use a single set of outputs regardless of trigger.
  resolve-publish:
    name: Resolve packages to publish
    needs: release-please
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' || inputs.engine == 'legacy')
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.resolve.outputs.sdk }}
      sdk-tag: ${{ steps.resolve.outputs.sdk-tag }}
      os-keyring: ${{ steps.resolve.outputs.os-keyring }}
      os-keyring-tag: ${{ steps.resolve.outputs.os-keyring-tag }}
      tasks-orchestrator: ${{ steps.resolve.outputs.tasks-orchestrator }}
      tasks-orchestrator-tag: ${{ steps.resolve.outputs.tasks-orchestrator-tag }}
      credentials: ${{ steps.resolve.outputs.credentials }}
      credentials-tag: ${{ steps.resolve.outputs.credentials-tag }}
      credential-broker: ${{ steps.resolve.outputs.credential-broker }}
      credential-broker-tag: ${{ steps.resolve.outputs.credential-broker-tag }}
      ctap: ${{ steps.resolve.outputs.ctap }}
      ctap-tag: ${{ steps.resolve.outputs.ctap-tag }}
      yubikey-preview-sign: ${{ steps.resolve.outputs.yubikey-preview-sign }}
      yubikey-preview-sign-tag: ${{ steps.resolve.outputs.yubikey-preview-sign-tag }}
      signer: ${{ steps.resolve.outputs.signer }}
      signer-tag: ${{ steps.resolve.outputs.signer-tag }}
      github-agent: ${{ steps.resolve.outputs.github-agent }}
      github-agent-tag: ${{ steps.resolve.outputs.github-agent-tag }}
      cli: ${{ steps.resolve.outputs.cli }}
      cli-tag: ${{ steps.resolve.outputs.cli-tag }}
      api-client: ${{ steps.resolve.outputs.api-client }}
      api-client-tag: ${{ steps.resolve.outputs.api-client-tag }}
      api-client-version: ${{ steps.resolve.outputs.api-client-version }}
      dspy-adapters: ${{ steps.resolve.outputs.dspy-adapters }}
      dspy-adapters-tag: ${{ steps.resolve.outputs.dspy-adapters-tag }}
      dspy-adapters-version: ${{ steps.resolve.outputs.dspy-adapters-version }}
      skill: ${{ steps.resolve.outputs.skill }}
      skill-tag: ${{ steps.resolve.outputs.skill-tag }}
      skill-version: ${{ steps.resolve.outputs.skill-version }}
      legreffier: ${{ steps.resolve.outputs.legreffier }}
      legreffier-tag: ${{ steps.resolve.outputs.legreffier-tag }}
      legreffier-plugin: ${{ steps.resolve.outputs.legreffier-plugin }}
      legreffier-plugin-tag: ${{ steps.resolve.outputs.legreffier-plugin-tag }}
      agent-runtime: ${{ steps.resolve.outputs.agent-runtime }}
      agent-runtime-tag: ${{ steps.resolve.outputs.agent-runtime-tag }}
      pi-extension: ${{ steps.resolve.outputs.pi-extension }}
      pi-extension-tag: ${{ steps.resolve.outputs.pi-extension-tag }}
      sandbox-gondolin: ${{ steps.resolve.outputs.sandbox-gondolin }}
      sandbox-gondolin-tag: ${{ steps.resolve.outputs.sandbox-gondolin-tag }}
      pi-runtime: ${{ steps.resolve.outputs.pi-runtime }}
      pi-runtime-tag: ${{ steps.resolve.outputs.pi-runtime-tag }}
      shell-command-analyzer: ${{ steps.resolve.outputs.shell-command-analyzer }}
      shell-command-analyzer-tag: ${{ steps.resolve.outputs.shell-command-analyzer-tag }}
      n8n-nodes-moltnet: ${{ steps.resolve.outputs.n8n-nodes-moltnet }}
      n8n-nodes-moltnet-tag: ${{ steps.resolve.outputs.n8n-nodes-moltnet-tag }}
      node-red: ${{ steps.resolve.outputs.node-red }}
      node-red-tag: ${{ steps.resolve.outputs.node-red-tag }}
      node-red-theme: ${{ steps.resolve.outputs.node-red-theme }}
      node-red-theme-tag: ${{ steps.resolve.outputs.node-red-theme-tag }}
      design-system: ${{ steps.resolve.outputs.design-system }}
      design-system-tag: ${{ steps.resolve.outputs.design-system-tag }}
      agent-daemon: ${{ steps.resolve.outputs.agent-daemon }}
      agent-daemon-tag: ${{ steps.resolve.outputs.agent-daemon-tag }}
      docker-has-releases: ${{ steps.resolve-docker.outputs.has-releases }}
      docker-matrix: ${{ steps.resolve-docker.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve publish targets
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RP_SDK_CREATED: ${{ needs.release-please.outputs.sdk-release-created }}
          RP_SDK_TAG: ${{ needs.release-please.outputs.sdk-tag-name }}
          RP_OS_KEYRING_CREATED: ${{ needs.release-please.outputs.os-keyring-release-created }}
          RP_OS_KEYRING_TAG: ${{ needs.release-please.outputs.os-keyring-tag-name }}
          RP_TASKS_ORCHESTRATOR_CREATED: ${{ needs.release-please.outputs.tasks-orchestrator-release-created }}
          RP_TASKS_ORCHESTRATOR_TAG: ${{ needs.release-please.outputs.tasks-orchestrator-tag-name }}
          RP_CREDENTIALS_CREATED: ${{ needs.release-please.outputs.credentials-release-created }}
          RP_CREDENTIALS_TAG: ${{ needs.release-please.outputs.credentials-tag-name }}
          RP_CREDENTIAL_BROKER_CREATED: ${{ needs.release-please.outputs.credential-broker-release-created }}
          RP_CREDENTIAL_BROKER_TAG: ${{ needs.release-please.outputs.credential-broker-tag-name }}
          RP_CTAP_CREATED: ${{ needs.release-please.outputs.ctap-release-created }}
          RP_CTAP_TAG: ${{ needs.release-please.outputs.ctap-tag-name }}
          RP_PREVIEW_SIGN_CREATED: ${{ needs.release-please.outputs.yubikey-preview-sign-release-created }}
          RP_PREVIEW_SIGN_TAG: ${{ needs.release-please.outputs.yubikey-preview-sign-tag-name }}
          RP_SIGNER_CREATED: ${{ needs.release-please.outputs.signer-release-created }}
          RP_SIGNER_TAG: ${{ needs.release-please.outputs.signer-tag-name }}
          RP_AGENT_CREATED: ${{ needs.release-please.outputs.github-agent-release-created }}
          RP_AGENT_TAG: ${{ needs.release-please.outputs.github-agent-tag-name }}
          RP_CLI_CREATED: ${{ needs.release-please.outputs.cli-release-created }}
          RP_CLI_TAG: ${{ needs.release-please.outputs.cli-tag-name }}
          RP_API_CREATED: ${{ needs.release-please.outputs.api-client-release-created }}
          RP_API_TAG: ${{ needs.release-please.outputs.api-client-tag-name }}
          RP_API_VERSION: ${{ needs.release-please.outputs.api-client-version }}
          RP_DSPY_CREATED: ${{ needs.release-please.outputs.dspy-adapters-release-created }}
          RP_DSPY_TAG: ${{ needs.release-please.outputs.dspy-adapters-tag-name }}
          RP_DSPY_VERSION: ${{ needs.release-please.outputs.dspy-adapters-version }}
          RP_SKILL_CREATED: ${{ needs.release-please.outputs.skill-release-created }}
          RP_SKILL_TAG: ${{ needs.release-please.outputs.skill-tag-name }}
          RP_SKILL_VERSION: ${{ needs.release-please.outputs.skill-version }}
          RP_LEGREFFIER_CREATED: ${{ needs.release-please.outputs.legreffier-release-created }}
          RP_LEGREFFIER_TAG: ${{ needs.release-please.outputs.legreffier-tag-name }}
          RP_LEGREFFIER_PLUGIN_CREATED: ${{ needs.release-please.outputs.legreffier-plugin-release-created }}
          RP_LEGREFFIER_PLUGIN_TAG: ${{ needs.release-please.outputs.legreffier-plugin-tag-name }}
          RP_AGENT_RUNTIME_CREATED: ${{ needs.release-please.outputs.agent-runtime-release-created }}
          RP_AGENT_RUNTIME_TAG: ${{ needs.release-please.outputs.agent-runtime-tag-name }}
          RP_PI_EXTENSION_CREATED: ${{ needs.release-please.outputs.pi-extension-release-created }}
          RP_PI_EXTENSION_TAG: ${{ needs.release-please.outputs.pi-extension-tag-name }}
          RP_SANDBOX_GONDOLIN_CREATED: ${{ needs.release-please.outputs.sandbox-gondolin-release-created }}
          RP_SANDBOX_GONDOLIN_TAG: ${{ needs.release-please.outputs.sandbox-gondolin-tag-name }}
          RP_PI_RUNTIME_CREATED: ${{ needs.release-please.outputs.pi-runtime-release-created }}
          RP_PI_RUNTIME_TAG: ${{ needs.release-please.outputs.pi-runtime-tag-name }}
          RP_SHELL_ANALYZER_CREATED: ${{ needs.release-please.outputs.shell-command-analyzer-release-created }}
          RP_SHELL_ANALYZER_TAG: ${{ needs.release-please.outputs.shell-command-analyzer-tag-name }}
          RP_N8N_NODES_CREATED: ${{ needs.release-please.outputs.n8n-nodes-moltnet-release-created }}
          RP_N8N_NODES_TAG: ${{ needs.release-please.outputs.n8n-nodes-moltnet-tag-name }}
          RP_NODE_RED_CREATED: ${{ needs.release-please.outputs.node-red-release-created }}
          RP_NODE_RED_TAG: ${{ needs.release-please.outputs.node-red-tag-name }}
          RP_NODE_RED_THEME_CREATED: ${{ needs.release-please.outputs.node-red-theme-release-created }}
          RP_NODE_RED_THEME_TAG: ${{ needs.release-please.outputs.node-red-theme-tag-name }}
          RP_DESIGN_SYSTEM_CREATED: ${{ needs.release-please.outputs.design-system-release-created }}
          RP_DESIGN_SYSTEM_TAG: ${{ needs.release-please.outputs.design-system-tag-name }}
          RP_AGENT_DAEMON_CREATED: ${{ needs.release-please.outputs.agent-daemon-release-created }}
          RP_AGENT_DAEMON_TAG: ${{ needs.release-please.outputs.agent-daemon-tag-name }}
          RP_CONSOLE_CREATED: ${{ needs.release-please.outputs.console-release-created }}
          RP_CONSOLE_TAG: ${{ needs.release-please.outputs.console-tag-name }}
          RP_CONSOLE_VERSION: ${{ needs.release-please.outputs.console-version }}
          RP_DATABASE_CREATED: ${{ needs.release-please.outputs.database-release-created }}
          RP_DATABASE_TAG: ${{ needs.release-please.outputs.database-tag-name }}
          RP_DATABASE_VERSION: ${{ needs.release-please.outputs.database-version }}
          RP_LANDING_CREATED: ${{ needs.release-please.outputs.landing-release-created }}
          RP_LANDING_TAG: ${{ needs.release-please.outputs.landing-tag-name }}
          RP_LANDING_VERSION: ${{ needs.release-please.outputs.landing-version }}
          RP_MCP_HOST_CREATED: ${{ needs.release-please.outputs.mcp-host-release-created }}
          RP_MCP_HOST_TAG: ${{ needs.release-please.outputs.mcp-host-tag-name }}
          RP_MCP_HOST_VERSION: ${{ needs.release-please.outputs.mcp-host-version }}
          RP_MCP_SERVER_CREATED: ${{ needs.release-please.outputs.mcp-server-release-created }}
          RP_MCP_SERVER_TAG: ${{ needs.release-please.outputs.mcp-server-tag-name }}
          RP_MCP_SERVER_VERSION: ${{ needs.release-please.outputs.mcp-server-version }}
          RP_REST_API_CREATED: ${{ needs.release-please.outputs.rest-api-release-created }}
          RP_REST_API_TAG: ${{ needs.release-please.outputs.rest-api-tag-name }}
          RP_REST_API_VERSION: ${{ needs.release-please.outputs.rest-api-version }}
          RP_OTEL_COLLECTOR_CREATED: ${{ needs.release-please.outputs.otel-collector-release-created }}
          RP_OTEL_COLLECTOR_TAG: ${{ needs.release-please.outputs.otel-collector-tag-name }}
          RP_OTEL_COLLECTOR_VERSION: ${{ needs.release-please.outputs.otel-collector-version }}
          REPUBLISH: ${{ github.event.inputs.republish || '' }}
        run: |
          find_draft_tag() {
            local component="$1"
            gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName,isDraft \
              --jq "[.[] | select(.isDraft == true and (.tagName | startswith(\"${component}-v\")))][0].tagName // empty"
          }

          version_from_tag() {
            local tag="$1" component="$2"
            echo "${tag}" | sed "s/^${component}-v//"
          }

          wants_republish() {
            echo "$REPUBLISH" | tr ',' '\n' | tr -d ' ' | grep -qx "$1"
          }

          resolve() {
            local name="$1" rp_created="$2" rp_tag="$3" component="$4"

            if [ "$rp_created" = "true" ]; then
              echo "${name}=true" >> "$GITHUB_OUTPUT"
              echo "${name}-tag=${rp_tag}" >> "$GITHUB_OUTPUT"
              echo "  ✓ ${name}: release-please → ${rp_tag}"
              return
            fi

            if wants_republish "$name"; then
              local tag
              tag=$(find_draft_tag "$component")
              if [ -n "$tag" ]; then
                echo "${name}=true" >> "$GITHUB_OUTPUT"
                echo "${name}-tag=${tag}" >> "$GITHUB_OUTPUT"
                echo "  ✓ ${name}: republish draft → ${tag}"
                return
              fi
              echo "  ✗ ${name}: requested but no draft release found for '${component}'"
            fi

            echo "${name}=false" >> "$GITHUB_OUTPUT"
            echo "  - ${name}: skip"
          }

          resolve_docker() {
            local name="$1" rp_created="$2" rp_tag="$3" rp_version="$4" component="$5"
            local tag version

            if [ "$rp_created" = "true" ]; then
              tag="$rp_tag"
              version="$rp_version"
              echo "  ✓ ${name}: release-please → ${tag}"
            elif wants_republish "$name"; then
              tag=$(find_draft_tag "$component")
              if [ -z "$tag" ]; then
                echo "  ✗ ${name}: requested but no draft release found for '${component}'"
                echo "docker-${name}=false" >> "$GITHUB_OUTPUT"
                return
              fi
              version=$(version_from_tag "$tag" "$component")
              echo "  ✓ ${name}: republish Docker draft → ${tag}"
            else
              echo "docker-${name}=false" >> "$GITHUB_OUTPUT"
              echo "  - ${name}: skip"
              return
            fi

            echo "docker-${name}=true" >> "$GITHUB_OUTPUT"
            echo "docker-${name}-tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "docker-${name}-version=${version}" >> "$GITHUB_OUTPUT"
          }

          echo "Resolving publish targets..."
          resolve "sdk"          "$RP_SDK_CREATED"       "$RP_SDK_TAG"       "sdk"
          resolve "os-keyring"   "$RP_OS_KEYRING_CREATED" "$RP_OS_KEYRING_TAG" "os-keyring"
          resolve "tasks-orchestrator" "$RP_TASKS_ORCHESTRATOR_CREATED" "$RP_TASKS_ORCHESTRATOR_TAG" "tasks-orchestrator"
          resolve "credentials" "$RP_CREDENTIALS_CREATED" "$RP_CREDENTIALS_TAG" "credentials"
          resolve "credential-broker" "$RP_CREDENTIAL_BROKER_CREATED" "$RP_CREDENTIAL_BROKER_TAG" "credential-broker"
          resolve "ctap"         "$RP_CTAP_CREATED"      "$RP_CTAP_TAG"      "ctap"
          resolve "yubikey-preview-sign" "$RP_PREVIEW_SIGN_CREATED" "$RP_PREVIEW_SIGN_TAG" "yubikey-preview-sign"
          resolve "signer" "$RP_SIGNER_CREATED" "$RP_SIGNER_TAG" "signer"
          resolve "github-agent" "$RP_AGENT_CREATED"     "$RP_AGENT_TAG"     "github-agent"
          resolve "cli"          "$RP_CLI_CREATED"       "$RP_CLI_TAG"       "cli"
          resolve "api-client"   "$RP_API_CREATED"       "$RP_API_TAG"       "moltnet-api-client"
          resolve "dspy-adapters" "$RP_DSPY_CREATED"     "$RP_DSPY_TAG"      "dspy-adapters"
          resolve "skill"        "$RP_SKILL_CREATED"     "$RP_SKILL_TAG"     "openclaw-skill"
          resolve "legreffier"   "$RP_LEGREFFIER_CREATED" "$RP_LEGREFFIER_TAG" "legreffier"
          resolve "legreffier-plugin" "$RP_LEGREFFIER_PLUGIN_CREATED" "$RP_LEGREFFIER_PLUGIN_TAG" "legreffier-plugin"
          resolve "design-system" "$RP_DESIGN_SYSTEM_CREATED" "$RP_DESIGN_SYSTEM_TAG" "design-system"
          resolve "agent-runtime" "$RP_AGENT_RUNTIME_CREATED" "$RP_AGENT_RUNTIME_TAG" "agent-runtime"
          resolve "pi-extension" "$RP_PI_EXTENSION_CREATED" "$RP_PI_EXTENSION_TAG" "pi-extension"
          resolve "sandbox-gondolin" "$RP_SANDBOX_GONDOLIN_CREATED" "$RP_SANDBOX_GONDOLIN_TAG" "sandbox-gondolin"
          resolve "pi-runtime" "$RP_PI_RUNTIME_CREATED" "$RP_PI_RUNTIME_TAG" "pi-runtime"
          resolve "shell-command-analyzer" "$RP_SHELL_ANALYZER_CREATED" "$RP_SHELL_ANALYZER_TAG" "shell-command-analyzer"
          resolve "n8n-nodes-moltnet" "$RP_N8N_NODES_CREATED" "$RP_N8N_NODES_TAG" "n8n-nodes-moltnet"
          resolve "node-red"     "$RP_NODE_RED_CREATED"  "$RP_NODE_RED_TAG"  "node-red-contrib-core"
          resolve "node-red-theme" "$RP_NODE_RED_THEME_CREATED" "$RP_NODE_RED_THEME_TAG" "node-red-theme"
          resolve "agent-daemon" "$RP_AGENT_DAEMON_CREATED" "$RP_AGENT_DAEMON_TAG" "agent-daemon"

          resolve_docker "console" "$RP_CONSOLE_CREATED" "$RP_CONSOLE_TAG" "$RP_CONSOLE_VERSION" "console"
          resolve_docker "database" "$RP_DATABASE_CREATED" "$RP_DATABASE_TAG" "$RP_DATABASE_VERSION" "database"
          resolve_docker "landing" "$RP_LANDING_CREATED" "$RP_LANDING_TAG" "$RP_LANDING_VERSION" "landing"
          resolve_docker "mcp-host" "$RP_MCP_HOST_CREATED" "$RP_MCP_HOST_TAG" "$RP_MCP_HOST_VERSION" "mcp-host"
          resolve_docker "mcp-server" "$RP_MCP_SERVER_CREATED" "$RP_MCP_SERVER_TAG" "$RP_MCP_SERVER_VERSION" "mcp-server"
          resolve_docker "rest-api" "$RP_REST_API_CREATED" "$RP_REST_API_TAG" "$RP_REST_API_VERSION" "rest-api"
          resolve_docker "otel-custom-collector" "$RP_OTEL_COLLECTOR_CREATED" "$RP_OTEL_COLLECTOR_TAG" "$RP_OTEL_COLLECTOR_VERSION" "otel-collector"

          # Forward version outputs
          if [ -n "$RP_API_VERSION" ]; then
            echo "api-client-version=${RP_API_VERSION}" >> "$GITHUB_OUTPUT"
          elif wants_republish "api-client"; then
            tag=$(find_draft_tag "moltnet-api-client")
            [ -n "$tag" ] && echo "api-client-version=$(version_from_tag "$tag" "moltnet-api-client")" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$RP_DSPY_VERSION" ]; then
            echo "dspy-adapters-version=${RP_DSPY_VERSION}" >> "$GITHUB_OUTPUT"
          elif wants_republish "dspy-adapters"; then
            tag=$(find_draft_tag "dspy-adapters")
            [ -n "$tag" ] && echo "dspy-adapters-version=$(version_from_tag "$tag" "dspy-adapters")" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$RP_SKILL_VERSION" ]; then
            echo "skill-version=${RP_SKILL_VERSION}" >> "$GITHUB_OUTPUT"
          elif wants_republish "skill"; then
            tag=$(find_draft_tag "openclaw-skill")
            [ -n "$tag" ] && echo "skill-version=$(version_from_tag "$tag" "openclaw-skill")" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve released Docker projects
        id: resolve-docker
        env:
          MOLTNET_DOCKER_RELEASES_JSON: >-
            [
              {"project":"@moltnet/console","released":"${{ steps.resolve.outputs.docker-console }}","tag":"${{ steps.resolve.outputs.docker-console-tag }}","version":"${{ steps.resolve.outputs.docker-console-version }}"},
              {"project":"@moltnet/database","released":"${{ steps.resolve.outputs.docker-database }}","tag":"${{ steps.resolve.outputs.docker-database-tag }}","version":"${{ steps.resolve.outputs.docker-database-version }}"},
              {"project":"@moltnet/landing","released":"${{ steps.resolve.outputs.docker-landing }}","tag":"${{ steps.resolve.outputs.docker-landing-tag }}","version":"${{ steps.resolve.outputs.docker-landing-version }}"},
              {"project":"@moltnet/mcp-host","released":"${{ steps.resolve.outputs.docker-mcp-host }}","tag":"${{ steps.resolve.outputs.docker-mcp-host-tag }}","version":"${{ steps.resolve.outputs.docker-mcp-host-version }}"},
              {"project":"@moltnet/mcp-server","released":"${{ steps.resolve.outputs.docker-mcp-server }}","tag":"${{ steps.resolve.outputs.docker-mcp-server-tag }}","version":"${{ steps.resolve.outputs.docker-mcp-server-version }}"},
              {"project":"@moltnet/rest-api","released":"${{ steps.resolve.outputs.docker-rest-api }}","tag":"${{ steps.resolve.outputs.docker-rest-api-tag }}","version":"${{ steps.resolve.outputs.docker-rest-api-version }}"},
              {"project":"otel-custom-collector","released":"${{ steps.resolve.outputs.docker-otel-custom-collector }}","tag":"${{ steps.resolve.outputs.docker-otel-custom-collector-tag }}","version":"${{ steps.resolve.outputs.docker-otel-custom-collector-version }}"}
            ]
        run: node tools/release/resolve-docker-release-matrix.mjs

  nx-release:
    name: Nx Release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.engine == 'nx' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/moltnet-cli/go.mod
          cache: true

      - if: ${{ !inputs.dry-run }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ !inputs.dry-run }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm install --frozen-lockfile

      - name: Guard production ref
        if: ${{ !inputs.dry-run && github.ref_name != 'main' }}
        run: |
          echo 'Non-dry-run releases must run from main.'
          exit 1

      - name: Run Nx release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_ACCESS: public
          NPM_CONFIG_PROVENANCE: 'true'
          GOPROXY: https://proxy.golang.org,direct
          GONOSUMDB: github.com/getlarge/themoltnet
        run: |
          set -euo pipefail

          RELEASE_ARGS=(--verbose --skip-publish)
          PUBLISH_ARGS=(--verbose)
          if [ '${{ inputs.first-release || false }}' = 'true' ]; then
            RELEASE_ARGS+=(--first-release)
            PUBLISH_ARGS+=(--first-release)
          fi

          if [ '${{ inputs.dry-run }}' = 'true' ]; then
            NX_DRY_RUN=true pnpm exec nx release --dry-run "${RELEASE_ARGS[@]}"
            exit 0
          fi

          BEFORE_RELEASE="$(git rev-parse HEAD)"
          pnpm exec nx release "${RELEASE_ARGS[@]}"
          AFTER_RELEASE="$(git rev-parse HEAD)"

          if [ "$AFTER_RELEASE" = "$BEFORE_RELEASE" ]; then
            echo 'No release commit was created.'
            exit 0
          fi

          git push origin HEAD:main --follow-tags --no-verify --atomic
          pnpm exec nx release publish "${PUBLISH_ARGS[@]}"

  publish-sdk:
    name: Publish SDK to npm
    needs: resolve-publish
    if: ${{ always() && needs.resolve-publish.outputs.sdk == 'true' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Nx walks the dep graph (build dependsOn ^build in nx.json), builds
      # @moltnet/api-client + @moltnet/crypto-service first, then the SDK,
      # all with remote-cache hits when unchanged.
      - run: pnpm exec nx run @themoltnet/sdk:build

      - run: pnpm exec nx run @themoltnet/sdk:test

      - run: pnpm exec nx run @themoltnet/sdk:check:pack

      - name: Publish @themoltnet/sdk
        uses: nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm --filter @themoltnet/sdk publish --no-git-checks --access public --provenance

      - name: Publish SDK release
        run: gh release edit "${{ needs.resolve-publish.outputs.sdk-tag }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

