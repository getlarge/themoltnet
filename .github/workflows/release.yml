  publish-n8n-nodes-moltnet:
    name: Publish MoltNet n8n nodes to npm
    needs: resolve-publish
    if: ${{ always() && needs.resolve-publish.outputs.n8n-nodes-moltnet == 'true' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec nx run @themoltnet/n8n-nodes-moltnet:lint

      - run: pnpm exec nx run @themoltnet/n8n-nodes-moltnet:typecheck

      # `test-ci` is the atomized Nx Agents target used by affected CI. Release
      # jobs run on a single GitHub runner, so execute the equivalent suite.
      - run: pnpm exec nx run @themoltnet/n8n-nodes-moltnet:test

      - run: pnpm exec nx run @themoltnet/n8n-nodes-moltnet:check:pack

      - name: Read exact package version
        id: package-version
        run: node -p '"version=" + require("./libs/n8n-nodes-moltnet/package.json").version' >> "$GITHUB_OUTPUT"

      - name: Publish or reconcile @themoltnet/n8n-nodes-moltnet
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: >-
          pnpm exec tsx tools/src/release/npm-publish-exact.cli.ts
          --package @themoltnet/n8n-nodes-moltnet
          --version "$PACKAGE_VERSION"

  scan-n8n-nodes-moltnet:
    name: Scan exact MoltNet n8n package
    needs: [resolve-publish, publish-n8n-nodes-moltnet]
    if: >-
      always() &&
      needs.resolve-publish.outputs.n8n-nodes-moltnet == 'true' &&
      needs.publish-n8n-nodes-moltnet.result == 'success' &&
      !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Scan exact published community package
        uses: nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 6
          retry_wait_seconds: 30
          # Scanner 0.34.0 can print a failed report while returning status 0.
          # Require its explicit success marker so release promotion fails closed.
          command: |-
            scan_package="@themoltnet/n8n-nodes-moltnet@${{ needs.publish-n8n-nodes-moltnet.outputs.version }}"
            scan_output="$(pnpm dlx @n8n/scan-community-package@0.34.0 "$scan_package" 2>&1)" || { scan_status=$?; printf '%s\n' "$scan_output"; exit "$scan_status"; }
            printf '%s\n' "$scan_output"
            printf '%s\n' "$scan_output" | grep -Fq "Package $scan_package has passed all security checks"

  promote-n8n-nodes-moltnet:
    name: Publish MoltNet n8n GitHub release
    needs: [resolve-publish, scan-n8n-nodes-moltnet]
    if: >-
      always() &&
      needs.resolve-publish.outputs.n8n-nodes-moltnet == 'true' &&
      needs.scan-n8n-nodes-moltnet.result == 'success' &&
      !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish n8n node release
        run: gh release edit "${{ needs.resolve-publish.outputs.n8n-nodes-moltnet-tag }}" --draft=false --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-node-red:
    name: Publish Node-RED nodes to npm
    needs: resolve-publish
    if: ${{ always() && needs.resolve-publish.outputs.node-red == 'true' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The package externalizes @themoltnet/sdk; the build only bundles the
      # node runtime + copies editor HTML (no SDK inlining).
      - run: pnpm exec nx run @themoltnet/node-red-contrib-core:build

      - run: pnpm exec nx run @themoltnet/node-red-contrib-core:test

      # Project-level pack check: every node-red.nodes path + sibling .html ships.
      - run: pnpm --filter @themoltnet/node-red-contrib-core run check:pack

      - name: Publish @themoltnet/node-red-contrib-core
        uses: nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm --filter @themoltnet/node-red-contrib-core publish --no-git-checks --access public --provenance

      - name: Publish Node-RED release
        run: gh release edit "${{ needs.resolve-publish.outputs.node-red-tag }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-node-red-theme:
