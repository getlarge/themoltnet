name: _deploy

on:
  workflow_call:
    inputs:
      fly-app:
        description: 'Fly.io app name'
        required: true
        type: string
      image-name:
        description: 'Production image name (under ghcr.io/<repo>/)'
        required: true
        type: string
      ci-image-name:
        description: 'CI image name (under ghcr.io/<repo>/), as built by CI'
        required: true
        type: string
      working-directory:
        description: 'Directory containing fly.toml'
        required: true
        type: string
      head-sha:
        description: 'Commit SHA to promote. Leave empty to redeploy current latest.'
        required: false
        default: ''
        type: string
      deploy:
        description: 'Whether to deploy to Fly.io'
        required: false
        default: true
        type: boolean
      fly-token-secret:
        description: 'Name of the secret in the production environment holding the Fly.io API token'
        required: false
        default: 'FLY_API_TOKEN'
        type: string

env:
  REGISTRY: ghcr.io
  # See ci.yml for rationale — opt out of Nx auto-loading our
  # dotenvx-encrypted .env at bin startup.
  NX_LOAD_DOT_ENV_FILES: 'false'

jobs:
  # CI's nx-affected gating may skip building an image when the project
  # isn't affected by the diff. Probe GHCR first; if the ci-<sha> image
  # isn't there, skip the rest of the pipeline cleanly. workflow_dispatch
  # with an explicit SHA still surfaces a missing image as an error since
  # the caller explicitly asked for that deploy.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      image-exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check CI image exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.head-sha }}
          REPO: ${{ github.repository }}
          CI_IMAGE_NAME: ${{ inputs.ci-image-name }}
        run: |
          if [ -z "$SHA" ]; then
            # Empty SHA → caller wants :latest fallback. Promote handles it.
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IMAGE="${REGISTRY}/${REPO}/${CI_IMAGE_NAME}:ci-${SHA}"
          echo "Probing $IMAGE"
          echo "$GH_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ci-<sha> image for $CI_IMAGE_NAME at $SHA. CI's nx affected gating skipped the build because the project wasn't affected. Skipping deploy."
          fi

  promote:
    name: Promote CI image
    needs: preflight
    if: ${{ needs.preflight.outputs.image-exists == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    outputs:
      image_ref: ${{ steps.promote.outputs.image_ref }}
    steps:
      - name: Checkout for scan attribution
        if: ${{ inputs.head-sha != '' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.head-sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve source image
        id: source
        env:
          SHA: ${{ inputs.head-sha }}
          REPO: ${{ github.repository }}
          IMAGE_NAME: ${{ inputs.image-name }}
          CI_IMAGE_NAME: ${{ inputs.ci-image-name }}
        run: |
          IMAGE="${REGISTRY}/${REPO}"
          if [ -n "$SHA" ]; then
            SOURCE="${IMAGE}/${CI_IMAGE_NAME}:ci-${SHA}"
          else
            SOURCE="${IMAGE}/${IMAGE_NAME}:latest"
          fi
          if ! MANIFEST="$(docker buildx imagetools inspect "$SOURCE" --format '{{json .Manifest}}')"; then
            echo "::error::Source image not found: $SOURCE"
            exit 1
          fi
          DIGEST="$(jq -r '.digest // empty' <<< "$MANIFEST")"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid source image digest"
            exit 1
          fi
          echo "source_ref=${SOURCE%:*}@${DIGEST}" >> "$GITHUB_OUTPUT"

      # CI pushes carry a BuildKit SBOM. Read it from the exact source digest.
      - name: Prepare SBOM
        if: ${{ inputs.head-sha != '' }}
        env:
          SOURCE: ${{ steps.source.outputs.source_ref }}
        run: |
          if ! docker buildx imagetools inspect "$SOURCE" --format '{{json .SBOM}}' \
            | jq -e '(.SPDX // empty) | select(type == "object")' > image.spdx.json; then
            echo '::error::CI image has no BuildKit SPDX SBOM'
            exit 1
          fi
          if [ "$(wc -c < image.spdx.json)" -gt 16777216 ]; then
            echo '::error::Image SBOM exceeds the attestation size limit'
            exit 1
          fi

      - name: Scan image (advisory)
        if: ${{ inputs.head-sha != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.source.outputs.source_ref }}
          version: v0.74.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          exit-code: '0'

      - name: Publish scan findings
        if: ${{ inputs.head-sha != '' && !cancelled() && hashFiles('trivy.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4.33.0
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ inputs.image-name }}
          ref: refs/heads/main
          sha: ${{ inputs.head-sha }}

      - name: Resolve Fly.io token
        uses: actions/github-script@v8
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          SECRET_NAME: ${{ inputs.fly-token-secret }}
        with:
          script: |
            const secrets = JSON.parse(process.env.ALL_SECRETS);
            const name = process.env.SECRET_NAME;
            if (!/^FLY_[A-Z0-9_]+_TOKEN$/.test(name)) core.setFailed(`Invalid secret name '${name}': must match FLY_*_TOKEN`);
            const value = secrets[name];
            if (!value) core.setFailed(`Secret '${name}' not found in production environment`);
            core.exportVariable('FLY_API_TOKEN', value);

      - name: Setup Fly.io CLI
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Log in to Fly.io registry
        run: flyctl auth docker

      - name: Promote image
        id: promote
        env:
          SHA: ${{ inputs.head-sha }}
          REPO: ${{ github.repository }}
          IMAGE_NAME: ${{ inputs.image-name }}
          FLY_APP: ${{ inputs.fly-app }}
          SOURCE: ${{ steps.source.outputs.source_ref }}
        run: |
          GHCR_IMAGE="${REGISTRY}/${REPO}/${IMAGE_NAME}"
          FLY_IMAGE="registry.fly.io/${FLY_APP}"

          if [ -n "$SHA" ]; then
            echo "Promoting CI image: $SOURCE"
            docker buildx imagetools create \
              --metadata-file promoted-image.json \
              --tag "${GHCR_IMAGE}:latest" \
              --tag "${GHCR_IMAGE}:${SHA}" \
              --tag "${FLY_IMAGE}:latest" \
              --tag "${FLY_IMAGE}:${SHA}" \
              "$SOURCE"
            echo "image_ref=${FLY_IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"
            DIGEST="$(jq -r '."containerimage.descriptor".digest // empty' promoted-image.json)"
            if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo '::error::Promotion did not return an image digest'
              exit 1
            fi
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          else
            echo "No SHA provided, falling back to: $SOURCE"
            docker buildx imagetools create \
              --tag "${FLY_IMAGE}:latest" \
              "$SOURCE"
            echo "image_ref=${FLY_IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest promoted image
        if: ${{ inputs.head-sha != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ inputs.image-name }}
          subject-digest: ${{ steps.promote.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        if: ${{ inputs.head-sha != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ inputs.image-name }}
          subject-digest: ${{ steps.promote.outputs.digest }}
          sbom-path: image.spdx.json
          push-to-registry: true

  deploy:
    name: Deploy to Fly.io
    needs: [preflight, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    if: ${{ inputs.deploy && needs.preflight.outputs.image-exists == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve Fly.io token
        uses: actions/github-script@v8
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          SECRET_NAME: ${{ inputs.fly-token-secret }}
        with:
          script: |
            const secrets = JSON.parse(process.env.ALL_SECRETS);
            const name = process.env.SECRET_NAME;
            if (!/^FLY_[A-Z0-9_]+_TOKEN$/.test(name)) core.setFailed(`Invalid secret name '${name}': must match FLY_*_TOKEN`);
            const value = secrets[name];
            if (!value) core.setFailed(`Secret '${name}' not found in production environment`);
            core.exportVariable('FLY_API_TOKEN', value);

      - name: Setup Fly.io CLI
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Deploy
        working-directory: ${{ inputs.working-directory }}
        env:
          IMAGE_REF: ${{ needs.promote.outputs.image_ref }}
        run: |
          if [ -z "$IMAGE_REF" ]; then
            echo "::error::image_ref output from promote job is empty"
            exit 1
          fi
          flyctl deploy --image "$IMAGE_REF"
