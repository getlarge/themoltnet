name: CI

on:
  push:
    branches: [main]
    # Baseline PRs run the required pull-request checks before merge. Avoid a
    # second full CI/deploy cycle when their generated-only commit lands.
    paths-ignore:
      - '.codeboarding/**'
  # Run stacked PRs too: a stack's upper PR targets the preceding branch,
  # not main, and must still receive the same validation.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# nx@22 unconditionally loads workspace-root .env at bin startup via plain
# dotenv. Our .env is dotenvx-encrypted, so plain-dotenv pulls ciphertext
# into every variable it defines, which then leaks into every process Nx
# spawns. This flag is the documented opt-out (honored by per-task and
# per-executor env loading); we set it workflow-wide as a defense even
# though nx@22.7.0's bin-level load currently ignores it. When the bin
# eventually honors it (or on a future major version), this guards us.
env:
  NX_LOAD_DOT_ENV_FILES: 'false'

jobs:
  native-keyring:
    name: Native keyring
    needs: [affected]
    if: needs.affected.outputs.native-keyring == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      MOLTNET_RUN_NATIVE_KEYRING_TESTS: '1'
      NX_BASE: ${{ needs.affected.outputs.base }}
      NX_HEAD: ${{ needs.affected.outputs.head }}
      # tools/postinstall.mjs spawns the extensionless `nx` shim, which does
      # not resolve to nx.cmd on Windows. The Nx tasks below still perform the
      # workspace sync check before running.
      MOLTNET_SKIP_NX_SYNC: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: |
            go.work.sum
            apps/moltnet-cli/go.sum
            libs/moltnet-api-client/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Install Linux Secret Service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gnome-keyring libsecret-1-dev dbus dbus-x11
      - name: Test affected native keyring projects
        if: runner.os != 'Linux'
        run: pnpm exec nx affected -t test-native
      - name: Test affected native keyring projects with Secret Service
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -c 'rm -f "$HOME"/.local/share/keyrings/*; printf "test" | gnome-keyring-daemon --unlock; pnpm exec nx affected -t test-native'

  # Compute the affected project set once and expose per-suite / per-image
  # flags. Downstream jobs gate on these so e2e and image builds only run
  # when the projects they cover are actually affected by the diff.
  affected:
    name: Compute affected
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      base: ${{ steps.shas-fallback.outputs.base }}
      head: ${{ steps.shas-fallback.outputs.head }}
      e2e-node: ${{ steps.compute.outputs.e2e-node }}
      e2e-agent-daemon: ${{ steps.compute.outputs.e2e-agent-daemon }}
      e2e-browser: ${{ steps.compute.outputs.e2e-browser }}
      e2e-mcp: ${{ steps.compute.outputs.e2e-mcp }}
      e2e-go-cli: ${{ steps.compute.outputs.e2e-go-cli }}
      e2e-cpp-sdk: ${{ steps.compute.outputs.e2e-cpp-sdk }}
      e2e-orchestration: ${{ steps.compute.outputs.e2e-orchestration }}
      e2e-any: ${{ steps.compute.outputs.e2e-any }}
      native-keyring: ${{ steps.compute.outputs.native-keyring }}
      landing: ${{ steps.compute.outputs.landing }}
      agents-matrix: ${{ steps.matrix.outputs.matrix }}
      has-agents: ${{ steps.matrix.outputs.has-agents }}
      tier: ${{ steps.matrix.outputs.tier }}
      # Resolved e2e image refs: ci-<sha> if the project was affected this run
      # (a fresh image was pushed), else the moving :ci-main from the last main
      # build. The e2e jobs consume these as the *_IMAGE Compose env vars.
      rest-api-image: ${{ steps.compute.outputs.rest-api-image }}
      mcp-server-image: ${{ steps.compute.outputs.mcp-server-image }}
      console-image: ${{ steps.compute.outputs.console-image }}
      mcp-host-image: ${{ steps.compute.outputs.mcp-host-image }}
      db-migrate-image: ${{ steps.compute.outputs.db-migrate-image }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: shas
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: main
      # Fallback: if nx-set-shas couldn't resolve a base SHA (e.g. no prior
      # successful CI run on main matches the current workflow shape — typical
      # when the workflow itself is being introduced or restructured), compute
      # one ourselves. PRs use origin/<base_ref>; main pushes use HEAD~1.
      - name: Fallback base SHA
        id: shas-fallback
        env:
          INITIAL_BASE: ${{ steps.shas.outputs.base }}
          INITIAL_HEAD: ${{ steps.shas.outputs.head }}
        run: |
          BASE="$INITIAL_BASE"
          HEAD="$INITIAL_HEAD"
          if [ -z "$BASE" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              git fetch origin "${{ github.base_ref }}" --depth=50
              BASE=$(git rev-parse "origin/${{ github.base_ref }}")
            else
              BASE=$(git rev-parse HEAD~1)
            fi
            echo "::notice::nx-set-shas returned empty base; falling back to $BASE"
          fi
          if [ -z "$HEAD" ]; then
            HEAD="${{ github.sha }}"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "NX_BASE=$BASE" >> "$GITHUB_ENV"
          echo "NX_HEAD=$HEAD" >> "$GITHUB_ENV"
      - name: Compute affected projects
        id: compute
        run: |
          set -euo pipefail
          # nx-set-shas / fallback exports NX_BASE/NX_HEAD as env vars; nx
          # affected reads them automatically. --json for stable parsing.
          PROJECTS=$(pnpm exec nx show projects --affected --json)
          echo "Affected projects: $PROJECTS"

          # Bash helper: 1 if any of the named projects are in $PROJECTS.
          # $PROJECTS is a JSON array, so jq is the safe way to check.
          contains() {
            for p in "$@"; do
              if echo "$PROJECTS" | jq -e --arg p "$p" 'index($p)' > /dev/null; then
                return 0
              fi
            done
            return 1
          }

          # E2E projects depend on the app projects they exercise, so app and
          # shared-lib changes mark the matching e2e project affected. Gate on
          # the e2e projects directly so e2e-only changes run the same jobs.
          # Node e2e: rest-api queue/API suites. mcp-server and agent-daemon
          # have dedicated jobs below so they do not contend with rest-api's
          # sponsor-flow restart.
          if contains "@moltnet/rest-api-e2e"; then
            echo "e2e-node=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e-node=false" >> "$GITHUB_OUTPUT"
          fi

          if contains "@themoltnet/agent-daemon-e2e"; then
            echo "e2e-agent-daemon=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e-agent-daemon=false" >> "$GITHUB_OUTPUT"
          fi

          if contains "@moltnet/console-e2e"; then
            echo "e2e-browser=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e-browser=false" >> "$GITHUB_OUTPUT"
          fi

          # MCP e2e: the mcp-server node suite + the mcp-host browser suite.
          # Their project dependencies pull in server, host, fixture, and MCP
          # app changes; direct e2e changes affect the e2e projects themselves.
          if contains "@moltnet/mcp-server-e2e" "@moltnet/mcp-host-e2e"; then
            echo "e2e-mcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e-mcp=false" >> "$GITHUB_OUTPUT"
          fi

          if contains "moltnet-cli" "moltnet-api-client"; then
            echo "e2e-go-cli=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e-go-cli=false" >> "$GITHUB_OUTPUT"
          fi

          if contains "@themoltnet/cpp-sdk" "@moltnet/rest-api" "@moltnet/api-client" "@moltnet/bootstrap"; then
            echo "e2e-cpp-sdk=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e-cpp-sdk=false" >> "$GITHUB_OUTPUT"
          fi

          # Orchestration durability: a standalone suite that only needs the
          # Absurd Postgres (issue-lifecycle-db + its migrate sibling), NOT the
          # app-image stack. Its own lightweight job (below) keeps it off the
          # long e2e-node/rest-api job and out of the *_IMAGE dependency.
          if contains "@themoltnet/orchestration-e2e"; then
            echo "e2e-orchestration=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e-orchestration=false" >> "$GITHUB_OUTPUT"
          fi

          # e2e-any: true iff any suite should run. The e2e stack images
          # (rest-api, mcp-server, db-migrate, console, mcp-host) are shared by
          # all suites, so this single flag gates the image builds.
          if contains "@moltnet/rest-api" "@moltnet/mcp-server" "@moltnet/mcp-host" "@moltnet/mcp-host-e2e" "@moltnet/entry-explore-mcp-app" "@moltnet/task-mcp-app" "@moltnet/mcp-test-harness" "@themoltnet/agent-daemon" "@moltnet/console" "moltnet-cli" "moltnet-api-client" "@themoltnet/cpp-sdk" "@moltnet/api-client" "@moltnet/bootstrap"; then
            echo "e2e-any=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e-any=false" >> "$GITHUB_OUTPUT"
          fi

          if contains "@moltnet/landing"; then
            echo "landing=true" >> "$GITHUB_OUTPUT"
          else
            echo "landing=false" >> "$GITHUB_OUTPUT"
          fi

          if contains "@themoltnet/os-keyring" "@themoltnet/sdk" "moltnet-cli"; then
            echo "native-keyring=true" >> "$GITHUB_OUTPUT"
          else
            echo "native-keyring=false" >> "$GITHUB_OUTPUT"
          fi

          # Resolve the e2e image ref for each app service. The orchestrator
          # runs `nx affected -t ... docker:build`, so a fresh ghcr.io/.../<svc>:ci-<sha>
          # image exists ONLY for docker-images projects in the affected set.
          # The e2e Compose stack needs all of them, so unaffected services fall
          # back to the moving :ci-main published by the last main build.
          # (Transitive deps count: a change to an MCP app lib makes
          # @moltnet/mcp-server affected, so its image rebuilds — same set nx uses.)
          SHA="${{ github.sha }}"
          REG="ghcr.io/getlarge/themoltnet"
          image_ref() { # $1=docker project, $2=image name
            if contains "$1"; then echo "${REG}/$2:ci-${SHA}"; else echo "${REG}/$2:ci-main"; fi
          }
          {
            echo "rest-api-image=$(image_ref @moltnet/rest-api rest-api)"
            echo "mcp-server-image=$(image_ref @moltnet/mcp-server mcp-server)"
            echo "console-image=$(image_ref @moltnet/console console)"
            echo "mcp-host-image=$(image_ref @moltnet/mcp-host mcp-host)"
            echo "db-migrate-image=$(image_ref @moltnet/database db-migrate)"
          } >> "$GITHUB_OUTPUT"

      - name: Compute Nx Cloud agent matrix
        id: matrix
        run: node .github/scripts/agents-changeset-matrix.cjs

      - uses: actions/setup-go@v6
        if: steps.matrix.outputs.has-agents == 'true'
        with:
          go-version: '1.25'
      - name: Cache golangci-lint
        if: steps.matrix.outputs.has-agents == 'true'
        id: golangci-lint-cache
        uses: actions/cache@v5
        with:
          path: .cache/golangci-lint/v2.5.0/bin
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-go1.25-v2.5.0
      - name: Install golangci-lint
        if: steps.matrix.outputs.has-agents == 'true' && steps.golangci-lint-cache.outputs.cache-hit != 'true'
        run: |
          GOBIN="$PWD/.cache/golangci-lint/v2.5.0/bin" \
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0

  # Nx Cloud DTE agents. Each matrix slot is a GitHub-hosted runner that
  # calls `nx-cloud start-agent` and shuts down when the orchestrator
  # marks the run complete. Tests use testcontainers internally for any
  # Postgres they need — no GHA `services:` block required. Agents only
  # need Docker (which `ubuntu-latest` ships with).
  agents:
    name: 'Agent #${{ matrix.agent }}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Agents run the distributed docker:build (configuration=ci) tasks, which
      # push images to GHCR. Needs packages:write + the GHCR login step below.
      packages: write
    needs: [affected]
    if: needs.affected.outputs.has-agents == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.affected.outputs.agents-matrix) }}
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      NX_BASE: ${{ needs.affected.outputs.base }}
      NX_HEAD: ${{ needs.affected.outputs.head }}
      # check:pack runs on these distributed workers, so its pre-merge
      # registry-smoke guard must be present here rather than only on the
      # orchestrator process that schedules the task.
      MOLTNET_SKIP_REGISTRY_SMOKE: '1'
      # Tag for the distributed docker:build (configuration=ci) push. Must match
      # what the e2e jobs pull (REST_API_IMAGE=...:ci-<sha> etc.).
      NX_DOCKER_CI_TAG: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Install native build tools
        run: |
          if ! command -v cmake >/dev/null || ! command -v ninja >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build
          fi
      - name: Restore golangci-lint
        id: golangci-lint-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/golangci-lint/v2.5.0/bin
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-go1.25-v2.5.0
      - name: Install golangci-lint
        if: steps.golangci-lint-cache.outputs.cache-hit != 'true'
        run: |
          GOBIN="$PWD/.cache/golangci-lint/v2.5.0/bin" \
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
      - name: Add golangci-lint to PATH
        run: echo "$PWD/.cache/golangci-lint/v2.5.0/bin" >> "$GITHUB_PATH"
      # Distributed docker:build (configuration=ci) builds+pushes via buildx
      # with registry cache, so agents that pick up a docker:build task need a
      # docker-container builder + GHCR auth. Agents that don't are unaffected.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      # Same flake guard as orchestrator: nx-cloud lazy-downloads its
      # runner bundle; cloud.nx.app sometimes 5xx's with a 10s timeout.
      # Retry the agent start (which blocks on tasks anyway, so a real
      # mid-run failure won't loop — only initial bundle fetches).
      - name: Start Nx Cloud agent
        run: |
          for attempt in 1 2 3; do
            if pnpm exec nx-cloud start-agent; then
              exit 0
            fi
            elapsed=$SECONDS
            # Only retry if we failed within the first 30s (bundle
            # download window). After that, a failure means the agent
            # is genuinely broken; don't loop.
            if [ "$elapsed" -gt 30 ]; then
              echo "::error::nx-cloud start-agent failed after $elapsed s — not retrying"
              exit 1
            fi
            echo "::warning::nx-cloud start-agent attempt $attempt failed early ($elapsed s), retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "::error::nx-cloud start-agent failed after 3 attempts"
          exit 1

  # Orchestrator: opens the Nx Cloud DTE run, fans tasks to the agents,
  # waits for completion. Replaces the legacy lint / typecheck / test
  # jobs AND the standalone build-and-push matrix: `build` gates the
  # SSR/lib outputs and `docker:build --configuration=ci` builds + pushes
  # the affected app images to GHCR, all distributed across the agent pool.
  orchestrator:
    name: Orchestrator (lint, typecheck, test, build, docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # docker:build (configuration=ci) is distributed to agents which push to
      # GHCR; the agents carry packages:write. The orchestrator only opens the
      # DTE run, but inherits the token used to mint the GHCR push on agents.
      packages: write
    needs: [affected]
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      NX_BASE: ${{ needs.affected.outputs.base }}
      NX_HEAD: ${{ needs.affected.outputs.head }}
      # Tag for the distributed docker:build (configuration=ci) push. Must match
      # what the e2e jobs pull (REST_API_IMAGE=...:ci-<sha> etc.).
      NX_DOCKER_CI_TAG: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install native build tools
        run: |
          if ! command -v cmake >/dev/null || ! command -v ninja >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build
          fi
      - run: pnpm install --frozen-lockfile
      # check:quickstart + nx format:check cover concerns not modeled in
      # the affected graph (docs/skill drift, formatting). Run them on the
      # orchestrator regardless of has-agents.
      - name: Run check:quickstart
        run: pnpm run check:quickstart
      - name: Check Vite package aliases
        run: pnpm run check:vite-aliases
      - name: Check formatting
        run: pnpm exec nx format:check

      # The Nx Cloud CLI lazy-downloads its runner bundle from
      # cloud.nx.app on first invocation. The download is sometimes
      # transiently unavailable; retry the start command itself.
      - name: Start Nx Cloud CI run
        if: needs.affected.outputs.has-agents == 'true'
        run: |
          for attempt in 1 2 3; do
            if pnpm exec nx-cloud start-ci-run \
                --distribute-on=manual \
                --assignment-rules=.nx/workflows/assignment-rules.yml \
                --require-explicit-completion; then
              exit 0
            fi
            echo "::warning::nx-cloud start-ci-run attempt $attempt failed, retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "::error::nx-cloud start-ci-run failed after 3 attempts"
          exit 1

      # Single distributed graph: lint/typecheck/test-ci/build/check:pack AND
      # docker:build (configuration=ci) all enter the SAME `nx affected` wave,
      # so Docker image builds run CONCURRENTLY with the rest across the agent
      # pool instead of waiting for the lint/test graph to drain first. Each
      # docker:build (configuration=ci) builds + pushes the AFFECTED app images
      # to ghcr.io/.../<svc>:ci-<sha> (and :ci-main on main) via buildx with
      # registry cache (replaces the standalone build-and-push matrix job).
      #
      # Only AFFECTED images build here. The e2e Compose stack needs all five
      # app images, so the e2e jobs resolve each *_IMAGE to ci-<sha> when the
      # project was affected this run, else the moving :ci-main published by the
      # last main build (see the per-image tag resolution in each e2e job).
      #
      # test-ci is the atomized variant of test (one task per file via
      # @nx/vitest). Projects without per-file atomization (Go, vitest libs
      # without a config) declare test-ci as a noop depending on test, so a
      # single -t test-ci covers everything.
      - name: Run affected lint, typecheck, test-ci, build, check:pack, docker:build
        if: needs.affected.outputs.has-agents == 'true'
        env:
          # Registry install smokes require coordinated workspace dependencies
          # to have published first. Release jobs run those smokes in order;
          # pre-merge CI still runs every package's tarball checks.
          MOLTNET_SKIP_REGISTRY_SMOKE: '1'
        run: pnpm exec nx affected -t lint typecheck test-ci build check:pack docker:build --configuration=ci

      # On main, refresh the moving :ci-main fallback for ALL e2e images (not
      # just affected) so PR e2e runs always have a complete, up-to-date image
      # set to fall back to for the services they didn't change. Runs only on
      # main pushes (no PR is waiting), under the same DTE run. The per-sha
      # images for affected projects were already built+pushed above; this
      # re-runs docker:build for the unaffected ones to (re)publish :ci-main.
      - name: Refresh :ci-main for all e2e images (main only)
        if: needs.affected.outputs.has-agents == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pnpm exec nx run-many -t docker:build --configuration=ci \
            --projects=@moltnet/rest-api,@moltnet/mcp-server,@moltnet/console,@moltnet/mcp-host,@moltnet/database

      - name: Complete Nx Cloud CI run
        if: always() && needs.affected.outputs.has-agents == 'true'
        run: pnpm exec nx-cloud complete-ci-run

  code-analysis:
    name: Code Analysis (Knip)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Knip (JSON report)
        run: pnpm run knip --reporter json > knip-report.json 2>&1 || true
      - name: Run Knip (human-readable)
        id: knip
        run: |
          set +e
          OUTPUT=$(pnpm run knip 2>&1)
          EXIT_CODE=$?
          set -e
          # Strip the pnpm script header line
          CLEAN_OUTPUT=$(echo "$OUTPUT" | grep -v '> moltnet@' | grep -v '> knip' | sed '/^$/N;/^\n$/d')
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "output<<KNIP_EOF"
            echo "$CLEAN_OUTPUT"
            echo "KNIP_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- knip-report -->';
            const exitCode = '${{ steps.knip.outputs.exit_code }}';
            const output = `${{ steps.knip.outputs.output }}`;

            let body;
            if (exitCode === '0') {
              body = `${marker}\n## :white_check_mark: Knip — No issues found\n\nNo unused code, dependencies, or exports detected.`;
            } else {
              body = [
                marker,
                '## :warning: Knip — Unused code or dependencies found',
                '',
                'Run `pnpm run knip` locally to see details, or `pnpm run knip:fix` to auto-fix some of them.',
                '',
                '<details>',
                '<summary>Full report</summary>',
                '',
                '```',
                output,
                '```',
                '',
                '</details>',
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: knip-report
          path: knip-report.json
          retention-days: 30

  cli-go-mod-sync:
    name: CLI go.mod Sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Check moltnet-cli Go module pins
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_API=$(jq -r '."libs/moltnet-api-client"' .release-please-manifest.json)
          EXPECTED_DSPY=$(jq -r '."libs/dspy-adapters"' .release-please-manifest.json)

          CURRENT_API=$(grep 'github.com/getlarge/themoltnet/libs/moltnet-api-client' apps/moltnet-cli/go.mod | awk '{print $2}' | sed 's/^v//')
          CURRENT_DSPY=$(grep 'github.com/getlarge/themoltnet/libs/dspy-adapters' apps/moltnet-cli/go.mod | awk '{print $2}' | sed 's/^v//')

          STALE=false
          MESSAGES=()
          COMMANDS=()

          if [ "$CURRENT_API" != "$EXPECTED_API" ]; then
            STALE=true
            MESSAGES+=("- \`moltnet-api-client\`: go.mod has \`v$CURRENT_API\`, expected \`v$EXPECTED_API\`")
            COMMANDS+=("GOWORK=off go get github.com/getlarge/themoltnet/libs/moltnet-api-client@v$EXPECTED_API")
          fi

          if [ "$CURRENT_DSPY" != "$EXPECTED_DSPY" ]; then
            STALE=true
            MESSAGES+=("- \`dspy-adapters\`: go.mod has \`v$CURRENT_DSPY\`, expected \`v$EXPECTED_DSPY\`")
            COMMANDS+=("GOWORK=off go get github.com/getlarge/themoltnet/libs/dspy-adapters@v$EXPECTED_DSPY")
          fi

          if [ "$STALE" = true ]; then
            COMMANDS+=("GOWORK=off go mod tidy")
            {
              echo "stale=true"
              echo "message<<MSG_EOF"
              printf '%s\n' "${MESSAGES[@]}"
              echo "MSG_EOF"
              echo "commands<<CMD_EOF"
              printf '%s\n' "${COMMANDS[@]}"
              echo "CMD_EOF"
            } >> "$GITHUB_OUTPUT"

            echo "::warning::apps/moltnet-cli/go.mod is behind the release manifest."
            printf '%s\n' "${MESSAGES[@]}"
            exit 0
          fi

          echo "stale=false" >> "$GITHUB_OUTPUT"
      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v8
        env:
          CLI_GO_MOD_STALE: ${{ steps.sync.outputs.stale }}
          CLI_GO_MOD_MESSAGE: ${{ steps.sync.outputs.message }}
          CLI_GO_MOD_COMMANDS: ${{ steps.sync.outputs.commands }}
        with:
          script: |
            const marker = '<!-- cli-go-mod-sync -->';
            const stale = process.env.CLI_GO_MOD_STALE;
            const message = process.env.CLI_GO_MOD_MESSAGE || '';
            const commands = process.env.CLI_GO_MOD_COMMANDS || '';

            let body;
            if (stale === 'true') {
              body = [
                marker,
                '## :warning: CLI go.mod is behind internal Go module releases',
                '',
                'The CLI release is intentionally decoupled from same-run Go lib releases, so `apps/moltnet-cli/go.mod` must already be bumped in a normal PR.',
                '',
                'Detected drift:',
                message,
                '',
                'Run these commands from `apps/moltnet-cli`:',
                '',
                '```bash',
                commands,
                '```',
              ].join('\n');
            } else {
              body = [
                marker,
                '## :white_check_mark: CLI go.mod matches internal Go module releases',
                '',
                '`apps/moltnet-cli/go.mod` is aligned with the versions tracked in `.release-please-manifest.json`.',
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run audit
        id: audit
        run: |
          set +e
          pnpm audit --prod > audit-report.txt 2>&1
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          pnpm audit --prod --json > audit-report.json 2>&1 || true
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- audit-report -->';
            const exitCode = process.env.AUDIT_EXIT_CODE;
            const fullOutput = fs.readFileSync('audit-report.txt', 'utf8');
            const maxCommentReportLength = 50_000;
            const output = fullOutput.length > maxCommentReportLength
              ? `${fullOutput.slice(0, maxCommentReportLength)}\n\n… Full report is available in the audit-report artifact.`
              : fullOutput;

            let body;
            if (exitCode === '0') {
              body = `${marker}\n## :white_check_mark: Dependency Audit — No vulnerabilities found\n\nNo known vulnerabilities in production dependencies.`;
            } else {
              body = [
                marker,
                '## :rotating_light: Dependency Audit — Vulnerabilities found',
                '',
                '<details>',
                '<summary>Full report</summary>',
                '',
                '```',
                output,
                '```',
                '',
                '</details>',
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 30

  # Deliberately a separate job from `audit`, and deliberately blocking.
  #
  # `audit` is advisory (continue-on-error) because it reports on the outside
  # world: an advisory can be published against an untouched dependency at any
  # moment, and that must not block a PR whose author cannot act on it.
  #
  # This job reports on *our own* configuration and only fails when an entry we
  # wrote has stopped earning its place — always actionable by whoever is
  # touching the block. Left non-blocking it would be one more red square that
  # everyone learns to scroll past, and the overrides would resume growing,
  # which is the whole thing this is meant to stop.
  override-hygiene:
    name: Override Hygiene
    runs-on: ubuntu-latest
    # Re-resolves the workspace, so it needs more headroom than a bare audit.
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check override hygiene
        id: overrides
        run: |
          set +e
          node tools/check-dependency-overrides.mjs --markdown override-hygiene.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('override-hygiene.md')) return;
            const body = fs.readFileSync('override-hygiene.md', 'utf8');
            const marker = '<!-- override-hygiene -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      # Exit 2 means the check could not resolve the workspace (registry blip,
      # not a verdict). Warn and pass: a blocking gate must fail on evidence,
      # never on the absence of it.
      - name: Report unresolvable workspace
        if: steps.overrides.outputs.exit_code == '2'
        run: echo "::warning::Override hygiene could not resolve the workspace; skipping the verdict."
      # Last, so the PR comment explaining what to do is always posted first.
      - name: Fail on unjustified entries
        if: steps.overrides.outputs.exit_code == '1'
        run: |
          echo "::error::pnpm.overrides or ignoreGhsas contains entries that no longer earn their place. See the PR comment."
          exit 1
  openapi:
    name: OpenAPI Spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - run: pnpm install --frozen-lockfile
      - name: Regenerate OpenAPI spec and client
        run: pnpm run generate
      - name: Check for uncommitted changes (TS)
        run: |
          if ! git diff --exit-code apps/rest-api/public/openapi.json; then
            echo "::error::OpenAPI spec is out of date. Run 'pnpm run generate' and commit the changes."
            exit 1
          fi
          if ! git diff --exit-code libs/api-client/src/generated/; then
            echo "::error::Generated API client is out of date. Run 'pnpm run generate' and commit the changes."
            exit 1
          fi
          if ! git diff --exit-code apps/moltnet-signer/openapi.json; then
            echo "::error::Signer companion OpenAPI spec is out of date. Run 'pnpm run generate' and commit the changes."
            exit 1
          fi
          if ! git diff --exit-code libs/signer-api-client/src/generated/; then
            echo "::error::Generated signer companion client is out of date. Run 'pnpm run generate' and commit the changes."
            exit 1
          fi
      - name: Regenerate Go API client
        run: go generate ./libs/moltnet-api-client/...
      - name: Check for uncommitted changes (Go)
        run: |
          if ! git diff --exit-code -- 'libs/moltnet-api-client/*.go'; then
            echo "::error::Go API client is out of date. Run 'go generate ./libs/moltnet-api-client/...' and commit the changes."
            exit 1
          fi

  # E2E jobs gate on the docker images they consume, but do not wait for
  # `orchestrator` (lint+typecheck+test+build via Nx Cloud DTE). They manage
  # their own docker compose stack and stay outside DTE per issue #985 scope.
  e2e-node:
    name: E2E Tests (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    needs: [affected, orchestrator]
    env:
      # Per-image: ci-<sha> if affected this run, else the moving :ci-main
      # (resolved by the affected job). The e2e stack needs all five.
      REST_API_IMAGE: ${{ needs.affected.outputs.rest-api-image }}
      MCP_SERVER_IMAGE: ${{ needs.affected.outputs.mcp-server-image }}
      DB_MIGRATE_IMAGE: ${{ needs.affected.outputs.db-migrate-image }}
      CONSOLE_IMAGE: ${{ needs.affected.outputs.console-image }}
      MCP_HOST_IMAGE: ${{ needs.affected.outputs.mcp-host-image }}
      # Pre-set the URLs the e2e tests need. Without this, Nx's bin/nx.js
      # loads workspace-root .env at startup; our .env is dotenvx-encrypted,
      # so plain-dotenv pulls ciphertext into DATABASE_URL and pg silently
      # falls back to its ::1:5432 default. Values mirror docker-compose.base
      # host-port mappings.
      DATABASE_URL: postgresql://moltnet:moltnet_secret@localhost:5433/moltnet
      ORY_HYDRA_ADMIN_URL: http://localhost:4445
      ORY_HYDRA_PUBLIC_URL: http://localhost:4444
      ORY_KETO_PUBLIC_URL: http://localhost:4466
      ORY_KETO_ADMIN_URL: http://localhost:4467
      ORY_KRATOS_ADMIN_URL: http://localhost:4434
      ORY_KRATOS_PUBLIC_URL: http://localhost:4433
      SERVER_BASE_URL: http://localhost:8080
      # Must match the value injected into the rest-api container in
      # docker-compose.e2e.yaml. The test reads it from process.env to sign
      # webhook calls; if the encrypted .env gets loaded first, the test
      # uses ciphertext and the server returns 403.
      ORY_ACTION_API_KEY: local-dev-webhook-key
    steps:
      - name: Skip if Node E2E not affected
        if: needs.affected.outputs.e2e-node != 'true'
        run: echo "Node E2E projects not affected; E2E Tests (Node) not required."

      - uses: actions/checkout@v6
        if: needs.affected.outputs.e2e-node == 'true'
      - uses: pnpm/action-setup@v6
        if: needs.affected.outputs.e2e-node == 'true'
      - uses: actions/setup-node@v6
        if: needs.affected.outputs.e2e-node == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.affected.outputs.e2e-node == 'true'
      - name: Log in to GHCR
        if: needs.affected.outputs.e2e-node == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start Docker Compose stack
        if: needs.affected.outputs.e2e-node == 'true'
        env:
          COMPOSE_DISABLE_ENV_FILE: true
        run: docker compose -f docker-compose.e2e.yaml up -d rest-api
      # rest-api e2e MUST run first: its setup restarts the rest-api container
      # (sponsor flow), which would invalidate any in-flight test in another
      # suite running against the same stack.
      - name: Run REST API E2E tests
        if: needs.affected.outputs.e2e-node == 'true'
        run: pnpm exec nx run @moltnet/rest-api-e2e:e2e
      - name: Docker Compose logs
        if: failure() && needs.affected.outputs.e2e-node == 'true'
        run: docker compose -f docker-compose.e2e.yaml logs --tail=50

  e2e-agent-daemon:
    name: E2E Tests (Agent Daemon / ${{ matrix.lane.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    needs: [affected, orchestrator]
    strategy:
      fail-fast: false
      matrix:
        lane:
          - name: Core
            configuration: core
            cache_key: core
            vm_integration: true
          - name: Live Evals
            configuration: live-evals
            cache_key: live-evals
            vm_integration: false
    env:
      # Per-image: ci-<sha> if affected this run, else the moving :ci-main
      # (resolved by the affected job). The e2e stack needs all five.
      REST_API_IMAGE: ${{ needs.affected.outputs.rest-api-image }}
      MCP_SERVER_IMAGE: ${{ needs.affected.outputs.mcp-server-image }}
      DB_MIGRATE_IMAGE: ${{ needs.affected.outputs.db-migrate-image }}
      CONSOLE_IMAGE: ${{ needs.affected.outputs.console-image }}
      MCP_HOST_IMAGE: ${{ needs.affected.outputs.mcp-host-image }}
      DATABASE_URL: postgresql://moltnet:moltnet_secret@localhost:5433/moltnet
      ORY_HYDRA_ADMIN_URL: http://localhost:4445
      ORY_HYDRA_PUBLIC_URL: http://localhost:4444
      ORY_KETO_PUBLIC_URL: http://localhost:4466
      ORY_KETO_ADMIN_URL: http://localhost:4467
      ORY_KRATOS_ADMIN_URL: http://localhost:4434
      ORY_KRATOS_PUBLIC_URL: http://localhost:4433
      SERVER_BASE_URL: http://localhost:8080
      ORY_ACTION_API_KEY: local-dev-webhook-key
      MOLTNET_AGENT_DAEMON_LIVE_LLM_E2E: '1'
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - name: Skip if Agent Daemon E2E not affected
        if: needs.affected.outputs.e2e-agent-daemon != 'true'
        run: echo "Agent Daemon E2E project not affected; ${{ matrix.lane.name }} lane not required."

      - uses: actions/checkout@v6
        if: needs.affected.outputs.e2e-agent-daemon == 'true'
      - uses: pnpm/action-setup@v6
        if: needs.affected.outputs.e2e-agent-daemon == 'true'
      - uses: actions/setup-node@v6
        if: needs.affected.outputs.e2e-agent-daemon == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.affected.outputs.e2e-agent-daemon == 'true'
      - name: Resolve Gondolin APT cache key
        id: gondolin-apt-key
        if: needs.affected.outputs.e2e-agent-daemon == 'true'
        run: |
          os_release="$(. /etc/os-release && echo "${ID}-${VERSION_ID}")"
          echo "prefix=${{ runner.os }}-${os_release}-${{ runner.arch }}-gondolin-qemu-v1-" >> "$GITHUB_OUTPUT"
      - name: Restore Gondolin APT cache
        id: gondolin-apt-cache
        if: needs.affected.outputs.e2e-agent-daemon == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/moltnet/apt/archives
          key: ${{ steps.gondolin-apt-key.outputs.prefix }}${{ matrix.lane.cache_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.gondolin-apt-key.outputs.prefix }}
      - name: Install Gondolin sandbox dependencies
        if: needs.affected.outputs.e2e-agent-daemon == 'true'
        run: |
          apt_archives="$HOME/.cache/moltnet/apt/archives"
          mkdir -p "$apt_archives/partial"
          sudo chown -R _apt:root "$apt_archives"
          sudo apt-get update -qq
          sudo apt-get \
            -o Dir::Cache::archives="$apt_archives" \
            -o APT::Keep-Downloaded-Packages=true \
            install -y --no-install-recommends qemu-utils qemu-system-x86
          sudo apt-get \
            -o Dir::Cache::archives="$apt_archives" \
            autoclean -qq
          sudo chown -R "$(id -u):$(id -g)" "$apt_archives"
      - name: Save Gondolin APT cache
        if: needs.affected.outputs.e2e-agent-daemon == 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/moltnet/apt/archives
          key: ${{ steps.gondolin-apt-cache.outputs.cache-primary-key }}
      - name: Cache Gondolin snapshots
        if: needs.affected.outputs.e2e-agent-daemon == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/moltnet/gondolin
          key: ${{ runner.os }}-${{ runner.arch }}-gondolin-snapshot-v2-agent-daemon-e2e-${{ matrix.lane.cache_key }}-${{ hashFiles('sandbox.json', 'libs/pi-extension/src/snapshot.ts', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gondolin-snapshot-v2-agent-daemon-e2e-${{ matrix.lane.cache_key }}-
            ${{ runner.os }}-${{ runner.arch }}-gondolin-snapshot-v2-agent-daemon-e2e-
      - name: Log in to GHCR
        if: needs.affected.outputs.e2e-agent-daemon == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start Docker Compose stack
        if: needs.affected.outputs.e2e-agent-daemon == 'true'
        env:
          COMPOSE_DISABLE_ENV_FILE: true
        run: docker compose -f docker-compose.e2e.yaml up -d rest-api
      - name: Run pi-runtime VM integration tests
        if: needs.affected.outputs.e2e-agent-daemon == 'true' && matrix.lane.vm_integration
        env:
          MOLTNET_PI_VM_INTEGRATION: '1'
        run: pnpm exec nx run @themoltnet/pi-runtime:test-ci--src/vm-manager.integration.test.ts
      - name: Run agent-daemon ${{ matrix.lane.name }} E2E tests
        if: needs.affected.outputs.e2e-agent-daemon == 'true'
        run: pnpm exec nx run @themoltnet/agent-daemon-e2e:e2e --configuration=${{ matrix.lane.configuration }}
      - name: Docker Compose logs
        if: failure() && needs.affected.outputs.e2e-agent-daemon == 'true'
        run: docker compose -f docker-compose.e2e.yaml logs --tail=50

  e2e-browser:
    name: E2E Tests (Browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    needs: [affected, orchestrator]
    env:
      # Per-image: ci-<sha> if affected this run, else the moving :ci-main
      # (resolved by the affected job). The e2e stack needs all five.
      REST_API_IMAGE: ${{ needs.affected.outputs.rest-api-image }}
      MCP_SERVER_IMAGE: ${{ needs.affected.outputs.mcp-server-image }}
      DB_MIGRATE_IMAGE: ${{ needs.affected.outputs.db-migrate-image }}
      CONSOLE_IMAGE: ${{ needs.affected.outputs.console-image }}
      MCP_HOST_IMAGE: ${{ needs.affected.outputs.mcp-host-image }}
    steps:
      - name: Skip if Browser E2E not affected
        if: needs.affected.outputs.e2e-browser != 'true'
        run: echo "Browser E2E projects not affected; E2E Tests (Browser) not required."

      - uses: actions/checkout@v6
        if: needs.affected.outputs.e2e-browser == 'true'
      - uses: pnpm/action-setup@v6
        if: needs.affected.outputs.e2e-browser == 'true'
      - uses: actions/setup-node@v6
        if: needs.affected.outputs.e2e-browser == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.affected.outputs.e2e-browser == 'true'
      - name: Get Playwright version
        id: pw-version
        if: needs.affected.outputs.e2e-browser == 'true'
        run: echo "version=$(pnpm --silent --filter @moltnet/console-e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        if: needs.affected.outputs.e2e-browser == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright browsers
        if: needs.affected.outputs.e2e-browser == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @moltnet/console-e2e exec playwright install chromium
      - name: Install Playwright system deps
        if: needs.affected.outputs.e2e-browser == 'true'
        run: pnpm --filter @moltnet/console-e2e exec playwright install-deps chromium
      - name: Log in to GHCR
        if: needs.affected.outputs.e2e-browser == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start Docker Compose stack
        if: needs.affected.outputs.e2e-browser == 'true'
        env:
          COMPOSE_DISABLE_ENV_FILE: true
        run: docker compose -f docker-compose.e2e.yaml up -d console
      - name: Run Console Browser E2E tests
        if: needs.affected.outputs.e2e-browser == 'true'
        env:
          KRATOS_PUBLIC_URL: http://localhost:4433
          REST_API_URL: http://localhost:8080
          CONSOLE_BASE_URL: http://localhost:5174
          MAILSLURPER_API_URL: http://localhost:4437
          # task-continue.e2e provisions a real agent via @moltnet/bootstrap,
          # which talks directly to the Ory admin APIs and the app DB. Mirror
          # the host-port mappings the e2e Docker stack publishes (see
          # docker-compose.base.yaml + docker-compose.e2e.yaml).
          DATABASE_URL: postgresql://moltnet:moltnet_secret@localhost:5433/moltnet
          ORY_HYDRA_ADMIN_URL: http://localhost:4445
          ORY_HYDRA_PUBLIC_URL: http://localhost:4444
          ORY_KETO_PUBLIC_URL: http://localhost:4466
          ORY_KETO_ADMIN_URL: http://localhost:4467
          ORY_KRATOS_ADMIN_URL: http://localhost:4434
        run: pnpm exec nx run @moltnet/console-e2e:e2e
      - name: Docker Compose logs
        if: failure() && needs.affected.outputs.e2e-browser == 'true'
        run: docker compose -f docker-compose.e2e.yaml logs --tail=50

  # MCP e2e: the mcp-server node suite + the mcp-host browser suite, against a
  # dedicated copy of the compose stack. Split out of the Node/Browser jobs so a
  # change to the MCP server/host/app libs triggers it (the mcp-host browser
  # suite previously lived in the console-gated browser job and skipped for
  # MCP-only PRs — see issue #1236).
  e2e-mcp:
    name: E2E Tests (MCP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    needs: [affected, orchestrator]
    env:
      # Per-image: ci-<sha> if affected this run, else the moving :ci-main
      # (resolved by the affected job). The e2e stack needs all five.
      REST_API_IMAGE: ${{ needs.affected.outputs.rest-api-image }}
      MCP_SERVER_IMAGE: ${{ needs.affected.outputs.mcp-server-image }}
      DB_MIGRATE_IMAGE: ${{ needs.affected.outputs.db-migrate-image }}
      CONSOLE_IMAGE: ${{ needs.affected.outputs.console-image }}
      MCP_HOST_IMAGE: ${{ needs.affected.outputs.mcp-host-image }}
    steps:
      - name: Skip if MCP E2E not affected
        if: needs.affected.outputs.e2e-mcp != 'true'
        run: echo "MCP E2E projects not affected; E2E Tests (MCP) not required."

      - uses: actions/checkout@v6
        if: needs.affected.outputs.e2e-mcp == 'true'
      - uses: pnpm/action-setup@v6
        if: needs.affected.outputs.e2e-mcp == 'true'
      - uses: actions/setup-node@v6
        if: needs.affected.outputs.e2e-mcp == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.affected.outputs.e2e-mcp == 'true'
      - name: Get Playwright version
        id: pw-version
        if: needs.affected.outputs.e2e-mcp == 'true'
        run: echo "version=$(pnpm --silent --filter @moltnet/mcp-host-e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        if: needs.affected.outputs.e2e-mcp == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright browsers
        if: needs.affected.outputs.e2e-mcp == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @moltnet/mcp-host-e2e exec playwright install chromium
      - name: Install Playwright system deps
        if: needs.affected.outputs.e2e-mcp == 'true'
        run: pnpm --filter @moltnet/mcp-host-e2e exec playwright install-deps chromium
      - name: Log in to GHCR
        if: needs.affected.outputs.e2e-mcp == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start Docker Compose stack
        if: needs.affected.outputs.e2e-mcp == 'true'
        env:
          COMPOSE_DISABLE_ENV_FILE: true
        run: docker compose -f docker-compose.e2e.yaml up -d mcp-host
      - name: Run MCP server E2E tests
        if: needs.affected.outputs.e2e-mcp == 'true'
        env:
          DATABASE_URL: postgresql://moltnet:moltnet_secret@127.0.0.1:5433/moltnet
          MCP_SERVER_URL: http://127.0.0.1:8001
          REST_API_URL: http://127.0.0.1:8080
          ORY_HYDRA_PUBLIC_URL: http://127.0.0.1:4444
          ORY_HYDRA_ADMIN_URL: http://127.0.0.1:4445
          ORY_KETO_PUBLIC_URL: http://127.0.0.1:4466
          ORY_KETO_ADMIN_URL: http://127.0.0.1:4467
          ORY_KRATOS_PUBLIC_URL: http://127.0.0.1:4433
          ORY_KRATOS_ADMIN_URL: http://127.0.0.1:4434
        run: pnpm exec nx run @moltnet/mcp-server-e2e:e2e
      - name: Run MCP Host Browser E2E tests
        if: needs.affected.outputs.e2e-mcp == 'true'
        env:
          BASE_URL: http://127.0.0.1:8082
          MCP_SERVER_URL: http://127.0.0.1:8001
          REST_API_URL: http://127.0.0.1:8080
          DATABASE_URL: postgresql://moltnet:moltnet_secret@127.0.0.1:5433/moltnet
          ORY_HYDRA_PUBLIC_URL: http://127.0.0.1:4444
          ORY_HYDRA_ADMIN_URL: http://127.0.0.1:4445
          ORY_KETO_PUBLIC_URL: http://127.0.0.1:4466
          ORY_KETO_ADMIN_URL: http://127.0.0.1:4467
          ORY_KRATOS_PUBLIC_URL: http://127.0.0.1:4433
          ORY_KRATOS_ADMIN_URL: http://127.0.0.1:4434
        run: pnpm exec nx run @moltnet/mcp-host-e2e:e2e
      - name: Docker Compose logs
        if: failure() && needs.affected.outputs.e2e-mcp == 'true'
        run: docker compose -f docker-compose.e2e.yaml logs --tail=50

  # Go CLI e2e runs in parallel with the Node and browser e2e jobs. It brings
  # up its own copy of the compose stack (~45s overhead) but does not contend
  # with the rest-api restart sequence, saving wall-clock time on the critical
  # path.
  e2e-go-cli:
    name: E2E Tests (Go CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    needs: [affected, orchestrator]
    env:
      # Per-image: ci-<sha> if affected this run, else the moving :ci-main
      # (resolved by the affected job). The e2e stack needs all five.
      REST_API_IMAGE: ${{ needs.affected.outputs.rest-api-image }}
      MCP_SERVER_IMAGE: ${{ needs.affected.outputs.mcp-server-image }}
      DB_MIGRATE_IMAGE: ${{ needs.affected.outputs.db-migrate-image }}
      CONSOLE_IMAGE: ${{ needs.affected.outputs.console-image }}
      MCP_HOST_IMAGE: ${{ needs.affected.outputs.mcp-host-image }}
    steps:
      - name: Skip if Go CLI E2E not affected
        if: needs.affected.outputs.e2e-go-cli != 'true'
        run: echo "Go CLI E2E projects not affected; E2E Tests (Go CLI) not required."

      - uses: actions/checkout@v6
        if: needs.affected.outputs.e2e-go-cli == 'true'
      - uses: pnpm/action-setup@v6
        if: needs.affected.outputs.e2e-go-cli == 'true'
      - uses: actions/setup-node@v6
        if: needs.affected.outputs.e2e-go-cli == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.affected.outputs.e2e-go-cli == 'true'
      - uses: actions/setup-go@v6
        if: needs.affected.outputs.e2e-go-cli == 'true'
        with:
          go-version: '1.25'
      - name: Log in to GHCR
        if: needs.affected.outputs.e2e-go-cli == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start Docker Compose stack
        if: needs.affected.outputs.e2e-go-cli == 'true'
        env:
          COMPOSE_DISABLE_ENV_FILE: true
        run: docker compose -f docker-compose.e2e.yaml up -d rest-api
      - name: Run Go CLI E2E tests
        if: needs.affected.outputs.e2e-go-cli == 'true'
        env:
          API_URL: http://localhost:8080
        run: go test -tags e2e -v -timeout 120s ./apps/moltnet-cli/...
      - name: Docker Compose logs
        if: failure() && needs.affected.outputs.e2e-go-cli == 'true'
        run: docker compose -f docker-compose.e2e.yaml logs --tail=50

  # C++ SDK e2e runs the native client against the REST API Compose stack.
  # The TypeScript fixture setup uses the generated API client for in-spec
  # seed writes, then the C++ binary exercises OAuth + read endpoints over HTTP.
  e2e-cpp-sdk:
    name: E2E Tests (C++ SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    needs: [affected, orchestrator]
    env:
      # Per-image: ci-<sha> if affected this run, else the moving :ci-main
      # (resolved by the affected job). The e2e stack needs all five.
      REST_API_IMAGE: ${{ needs.affected.outputs.rest-api-image }}
      MCP_SERVER_IMAGE: ${{ needs.affected.outputs.mcp-server-image }}
      DB_MIGRATE_IMAGE: ${{ needs.affected.outputs.db-migrate-image }}
      CONSOLE_IMAGE: ${{ needs.affected.outputs.console-image }}
      MCP_HOST_IMAGE: ${{ needs.affected.outputs.mcp-host-image }}
      DATABASE_URL: postgresql://moltnet:moltnet_secret@localhost:5433/moltnet
      ORY_HYDRA_ADMIN_URL: http://localhost:4445
      ORY_HYDRA_PUBLIC_URL: http://localhost:4444
      ORY_KETO_PUBLIC_URL: http://localhost:4466
      ORY_KETO_ADMIN_URL: http://localhost:4467
      ORY_KRATOS_ADMIN_URL: http://localhost:4434
      REST_API_URL: http://localhost:8080
      SERVER_BASE_URL: http://localhost:8080
    steps:
      - name: Skip if C++ SDK E2E not affected
        if: needs.affected.outputs.e2e-cpp-sdk != 'true'
        run: echo "C++ SDK E2E projects not affected; E2E Tests (C++ SDK) not required."

      - uses: actions/checkout@v6
        if: needs.affected.outputs.e2e-cpp-sdk == 'true'
      - uses: pnpm/action-setup@v6
        if: needs.affected.outputs.e2e-cpp-sdk == 'true'
      - uses: actions/setup-node@v6
        if: needs.affected.outputs.e2e-cpp-sdk == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Install native build tools
        if: needs.affected.outputs.e2e-cpp-sdk == 'true'
        run: |
          if ! command -v cmake >/dev/null || ! command -v ninja >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build
          fi
      - run: pnpm install --frozen-lockfile
        if: needs.affected.outputs.e2e-cpp-sdk == 'true'
      - name: Log in to GHCR
        if: needs.affected.outputs.e2e-cpp-sdk == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start Docker Compose stack
        if: needs.affected.outputs.e2e-cpp-sdk == 'true'
        env:
          COMPOSE_DISABLE_ENV_FILE: true
        run: docker compose -f docker-compose.e2e.yaml up -d rest-api
      - name: Run C++ SDK E2E tests
        if: needs.affected.outputs.e2e-cpp-sdk == 'true'
        run: pnpm exec nx run @themoltnet/cpp-sdk:e2e
      - name: Docker Compose logs
        if: failure() && needs.affected.outputs.e2e-cpp-sdk == 'true'
        run: docker compose -f docker-compose.e2e.yaml logs --tail=50

  # Standalone durability suite for @moltnet/orchestration. Unlike the other
  # e2e jobs it needs only the Absurd Postgres (issue-lifecycle-db + its migrate
  # sibling, built locally from infra/absurd/Dockerfile), NOT the five app
  # images — so it does not `needs: orchestrator`, skips GHCR/*_IMAGE, and only
  # brings up those two services. Runs in parallel with the other e2e jobs.
  e2e-orchestration:
    name: E2E Tests (Orchestration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: [affected]
    env:
      # Absurd Postgres host port from docker-compose.base.yaml. globalSetup
      # defaults to this same URL; pinned here to match the other e2e jobs'
      # belt-and-suspenders connection-string pinning.
      ORCHESTRATION_ABSURD_URL: postgresql://issue_lifecycle:issue_lifecycle_secret@localhost:55434/issue_lifecycle
    steps:
      - name: Skip if Orchestration E2E not affected
        if: needs.affected.outputs.e2e-orchestration != 'true'
        run: echo "Orchestration E2E project not affected; E2E Tests (Orchestration) not required."

      - uses: actions/checkout@v6
        if: needs.affected.outputs.e2e-orchestration == 'true'
      - uses: pnpm/action-setup@v6
        if: needs.affected.outputs.e2e-orchestration == 'true'
      - uses: actions/setup-node@v6
        if: needs.affected.outputs.e2e-orchestration == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.affected.outputs.e2e-orchestration == 'true'
      - name: Start Absurd Postgres and run migrations
        if: needs.affected.outputs.e2e-orchestration == 'true'
        env:
          COMPOSE_DISABLE_ENV_FILE: true
        # Wait for the DB to be healthy, then run the migrate service to
        # completion (installs the Absurd schema the durability tests need
        # before they create queues). `run` returns the migration's exit code,
        # so a failed migration fails the step.
        run: |
          docker compose -f docker-compose.e2e.yaml up -d --wait issue-lifecycle-db
          docker compose -f docker-compose.e2e.yaml run --rm --build issue-lifecycle-db-migrate
      - name: Run Orchestration Durability E2E tests
        if: needs.affected.outputs.e2e-orchestration == 'true'
        run: pnpm exec nx run @themoltnet/orchestration-e2e:e2e
      - name: Docker Compose logs
        if: failure() && needs.affected.outputs.e2e-orchestration == 'true'
        run: docker compose -f docker-compose.e2e.yaml logs --tail=50 issue-lifecycle-db issue-lifecycle-db-migrate

  skill-check:
    name: Skill Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate canonical Agent Skills
        run: |
          # Pin the reference validator so Agent Skills validation is
          # deterministic and only changes through an intentional update.
          python -m pip install --disable-pip-version-check \
            "git+https://github.com/agentskills/agentskills.git@38a2ff82958afee88dadf4831509e6f7e9d8ef4e#subdirectory=skills-ref"
          # `impeccable` is a vendored third-party skill (Apache-2.0) whose
          # upstream SKILL.md carries non-spec frontmatter; it is validated
          # upstream and installed via `npx impeccable install`. Exclude it —
          # keep in sync with the exclusion in .github/scripts/check-skill-sync.sh.
          find .agents/skills -mindepth 1 -maxdepth 1 -type d \
            ! -name impeccable -print0 \
            | xargs -0 -r -n 1 skills-ref validate

      - name: Validate SKILL.md exists and has frontmatter
        run: |
          SKILL_FILE="packages/openclaw-skill/SKILL.md"
          if [ ! -f "$SKILL_FILE" ]; then
            echo "::error::SKILL.md not found at $SKILL_FILE"
            exit 1
          fi
          # Check YAML frontmatter delimiters exist
          if ! head -1 "$SKILL_FILE" | grep -q '^---$'; then
            echo "::error::SKILL.md missing YAML frontmatter (expected '---' on line 1)"
            exit 1
          fi
          echo "SKILL.md: OK"

      - name: Validate mcp.json is valid JSON
        run: |
          MCP_FILE="packages/openclaw-skill/mcp.json"
          if [ ! -f "$MCP_FILE" ]; then
            echo "::error::mcp.json not found at $MCP_FILE"
            exit 1
          fi
          if ! python3 -m json.tool "$MCP_FILE" > /dev/null 2>&1; then
            echo "::error::mcp.json is not valid JSON"
            exit 1
          fi
          echo "mcp.json: OK"

      - name: Validate version.txt
        run: |
          VERSION_FILE="packages/openclaw-skill/version.txt"
          if [ ! -f "$VERSION_FILE" ]; then
            echo "::error::version.txt not found"
            exit 1
          fi
          VERSION=$(cat "$VERSION_FILE" | tr -d '[:space:]')
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version.txt must contain a valid semver (got: '$VERSION')"
            exit 1
          fi
          echo "version.txt: $VERSION OK"

      - name: Test tarball packaging
        run: |
          packages/openclaw-skill/scripts/package.sh /tmp
          tar -tzf /tmp/moltnet-skill-v*.tar.gz | sort
