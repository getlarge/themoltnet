name: Sync action bundle

# packages/*-action/dist/ (every project tagged platform:gha)
# are committed bundles that inline @themoltnet/sdk, libs/docs-impact-review, libs/complexity-review,
# and their dependencies. Rather than making every PR that
# touches that dependency chain carry a rebuilt bundle, main rebuilds it here
# and proposes the result as a single, continuously refreshed PR. CI verifies
# that PR's bundle (see `check-dist-actions` in ci.yml), and the
# action publisher refuses to release while main's bundle is stale.

on:
  push:
    branches: [main]
    # Coarse prefilter: anything the bundle can absorb. The build itself is
    # Nx-cached, so a push that does not affect the action restores the cached
    # bundle and finds nothing to propose.
    paths:
      - 'packages/*-action/**'
      - 'libs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-action-bundle
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.MOLTNET_RELEASE_APP_ID }}
          private-key: ${{ secrets.MOLTNET_RELEASE_APP_KEY }}
          owner: getlarge
          repositories: themoltnet

      - name: Rebuild the action bundles
        id: bundle
        run: |
          pnpm exec nx run-many -t build --projects=tag:platform:gha
          # Stage the bundles, then refresh the runtime locks that hash them
          # (the lock lists staged files only).
          # :(glob) with /** so the pathspec matches the tracked bundle files
          # even when nothing changed; the plain 'dist/' form then fails
          # with "pathspec did not match any files".
          git add -A -- ':(glob)packages/*-action/dist/**'
          node tools/src/release/action-runtime-lock.ts --write
          git add -- 'packages/*-action/runtime.lock'
          # `git status --porcelain`, not `git diff`: the build code-splits
          # into content-hashed assets/ chunks, and a renamed chunk arrives
          # untracked, which `git diff` does not report.
          if [ -n "$(git status --porcelain -- ':(glob)packages/*-action/dist/**' 'packages/*-action/runtime.lock')" ]; then
            git status --short -- ':(glob)packages/*-action/dist/**' 'packages/*-action/runtime.lock'
            echo changed=true >> "$GITHUB_OUTPUT"
          else
            echo changed=false >> "$GITHUB_OUTPUT"
          fi

      - name: Open or refresh bundle sync PR
        if: steps.bundle.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # A fix, not a chore: the bundle is the code the actions run, so a
          # refreshed bundle must release them.
          title="fix(actions): refresh action bundles"
          branch="automation/action-bundle-sync"
          git config user.name "MoltNet Release[bot]"
          git config user.email "261968324+moltnet-release[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "$title"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_branch_sha=$(git ls-remote --heads origin "refs/heads/${branch}" | awk '{print $1}')
          if [ -n "$remote_branch_sha" ]; then
            git push \
              --force-with-lease="refs/heads/${branch}:${remote_branch_sha}" \
              origin "HEAD:${branch}"
          else
            git push --set-upstream origin "HEAD:${branch}"
          fi
          pr_url=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --state open \
            --json url \
            --jq '.[0].url // empty')
          if [ -n "$pr_url" ]; then
            gh pr edit "$pr_url" --repo "$GITHUB_REPOSITORY" --title "$title"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "$title" \
              --body "Rebuilt the committed action bundles (\`packages/agent-daemon-action/dist/\`, \`packages/docs-impact-review-action/dist/\`, \`packages/complexity-review-action/dist/\`) from main's sources. The bundles inline \`@themoltnet/sdk\` and \`libs/docs-impact-review\` and \`libs/complexity-review\`, so changes there make them stale. In-repo workflows that use these actions and action releases run the bundles, so merge this PR before releasing an action."
          fi

      # A later push can make main's bundle current again (for example a PR
      # that committed a rebuilt dist/ itself). Close the now-obsolete sync PR
      # so it cannot be merged over a newer bundle. The branch itself is kept:
      # repository rules forbid deleting it, and the next proposal force-pushes
      # over it with a lease, as the go.mod sync bot does with its branch.
      - name: Close obsolete bundle sync PR
        if: steps.bundle.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr_number=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head automation/action-bundle-sync \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            gh pr close "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "main's action bundle is already current; closing this obsolete bundle sync PR."
          fi
