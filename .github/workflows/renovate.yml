name: Renovate

on:
  # Routine updates are limited by renovate.json to Monday. Run daily so
  # vulnerability fixes can be proposed without waiting for that window.
  # Runs after merges rebase conflicted update PRs; dashboard edits process
  # maintainer decisions without waiting for the next scheduled run.
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [main]
  issues:
    types: [edited]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview updates without creating branches or pull requests
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'issues' ||
      (github.event.sender.type != 'Bot' &&
      github.event.issue.user.login == vars.RENOVATE_APP_BOT_LOGIN &&
      github.event.issue.title == 'Dependency Dashboard'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: renovate
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Mint repository-scoped Renovate token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: themoltnet
          permission-administration: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write
      - name: Enable preview mode
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: echo 'RENOVATE_DRY_RUN=full' >> "$GITHUB_ENV"
      - name: Renovate dependency updates
        uses: renovatebot/github-action@6d26fcf0275dc65624cbc3d51fe78bc773f98321 # v46.3.6
        with:
          # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
          renovate-version: 44.119.1
          token: ${{ steps.app.outputs.token }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_PLATFORM_COMMIT: enabled
