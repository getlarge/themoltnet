name: Validate self-host bundle

on:
  pull_request:
    paths:
      - '.github/workflows/release-self-host.yml'
      - '.github/workflows/self-host-validate.yml'
      - '.release-please-manifest.json'
      - 'nx.json'
      - 'deploy/self-host/**'
      - 'infra/ory/**'
      - 'tools/release/assert-self-host-ready*'
      - 'tools/release/self-host-bundle*'
      - 'tools/release/self-host-smoke*'
      - 'apps/console/package.json'
      - 'apps/mcp-server/package.json'
      - 'apps/mcp-server/src/**'
      - 'apps/rest-api/package.json'
      - 'apps/rest-api/src/**'
      - 'libs/database/package.json'
      - 'libs/bootstrap/src/**'
      - 'libs/blob-storage/src/**'
  push:
    branches: [main]
    paths:
      - '.release-please-manifest.json'
      - 'nx.json'
      - 'deploy/self-host/**'
      - 'infra/ory/**'
      - 'tools/release/assert-self-host-ready*'
      - 'tools/release/self-host-bundle*'
      - 'tools/release/self-host-smoke*'
      - 'apps/console/package.json'
      - 'apps/mcp-server/package.json'
      - 'apps/mcp-server/src/**'
      - 'apps/rest-api/package.json'
      - 'apps/rest-api/src/**'
      - 'libs/database/package.json'
      - 'libs/bootstrap/src/**'
      - 'libs/blob-storage/src/**'

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tools/release/self-host-bundle.test.mjs tools/release/assert-self-host-ready.test.mjs
      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build candidate application images
        env:
          NX_LOAD_DOT_ENV_FILES: 'false'
        run: pnpm exec nx run-many -t docker:build --projects=@moltnet/rest-api,@moltnet/mcp-server
      - name: Verify digest-pinned archive
        run: |
          set -euo pipefail
          node tools/release/self-host-bundle.mjs --version ci --output "$RUNNER_TEMP/moltnet-self-host-ci"
          cd "$RUNNER_TEMP/moltnet-self-host-ci"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
          if [ "$(grep -Ec '^[A-Z_]+_IMAGE=.+@sha256:[a-f0-9]{64}$' deploy/self-host/.env.release)" -ne 4 ]; then
            echo 'Image lock must contain four digest-pinned images' >&2
            exit 1
          fi
      - name: Smoke-test candidate images through Caddy
        run: tools/release/self-host-smoke.sh "$RUNNER_TEMP/moltnet-self-host-ci" candidate
