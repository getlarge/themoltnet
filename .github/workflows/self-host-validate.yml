name: Validate self-host bundle

on:
  pull_request:
    paths:
      - '.github/workflows/release-self-host.yml'
      - '.github/workflows/self-host-validate.yml'
      - '.release-please-manifest.json'
      - 'nx.json'
      - 'deploy/self-host/**'
      - 'infra/ory/**'
      - 'tools/release/self-host-bundle*'
      - 'tools/release/self-host-smoke*'
      - 'apps/console/package.json'
      - 'apps/mcp-server/package.json'
      - 'apps/mcp-server/src/**'
      - 'apps/rest-api/package.json'
      - 'apps/rest-api/src/**'
      - 'libs/database/package.json'
      - 'libs/bootstrap/src/**'
      - 'libs/blob-storage/src/**'
  push:
    branches: [main]
    paths:
      - '.release-please-manifest.json'
      - 'nx.json'
      - 'deploy/self-host/**'
      - 'infra/ory/**'
      - 'tools/release/self-host-bundle*'
      - 'tools/release/self-host-smoke*'
      - 'apps/console/package.json'
      - 'apps/mcp-server/package.json'
      - 'apps/mcp-server/src/**'
      - 'apps/rest-api/package.json'
      - 'apps/rest-api/src/**'
      - 'libs/database/package.json'
      - 'libs/bootstrap/src/**'
      - 'libs/blob-storage/src/**'

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tools/release/self-host-bundle.test.mjs
      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build source images
        env:
          NX_LOAD_DOT_ENV_FILES: 'false'
        run: pnpm exec nx run-many -t docker:build --projects=@moltnet/rest-api,@moltnet/mcp-server,@moltnet/console,@moltnet/database --parallel=1
      - name: Build and verify source image archive
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/moltnet-self-host-ci-source"
          node tools/release/self-host-bundle.mjs --version ci-source --image-tag dev --skip-digests --output "$root"
          (cd "$root" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$root" && sha256sum -c SHA256SUMS)
      - name: Smoke-test archive images through Caddy
        run: tools/release/self-host-smoke.sh "$RUNNER_TEMP/moltnet-self-host-ci-source"
