name: Deploy MCP Server

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to deploy (must have a ci-<sha> image in GHCR). Leave blank to redeploy latest.'
        required: false
        default: ''
      deploy:
        description: 'Deploy to Fly.io'
        required: false
        default: true
        type: boolean
      build_image:
        description: 'Build the current main SHA MCP image before deploying (leave sha blank)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Fly.io CLI
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Check required secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_MCP_TOKEN }}
        run: >-
          flyctl secrets list -a moltnet-mcp --json
          | jq -r '.[].name'
          | pnpm --filter @moltnet/tools check-secrets --app mcp-server --fly-toml apps/mcp-server/fly.toml

  build-image:
    name: Build MCP image for manual deploy
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_image }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      NX_LOAD_DOT_ENV_FILES: 'false'
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      NX_DOCKER_CI_TAG: ci-${{ github.sha }}
      INPUT_SHA: ${{ inputs.sha }}
    steps:
      - name: Validate source
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ] || [ -n "$INPUT_SHA" ]; then
            echo '::error::Manual image builds require main and an empty sha input.'
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Build and push MCP image
        run: pnpm exec nx run @moltnet/mcp-server:docker:build --configuration=ci
      - name: Verify published image
        run: docker buildx imagetools inspect "ghcr.io/${{ github.repository }}/mcp-server:$NX_DOCKER_CI_TAG"

  deploy:
    name: Deploy
    needs: [preflight, build-image]
    if: >-
      ${{ !cancelled() && needs.preflight.result == 'success' &&
          (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') }}
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      fly-app: moltnet-mcp
      image-name: moltnet-mcp
      ci-image-name: mcp-server
      working-directory: apps/mcp-server
      head-sha: >-
        ${{ (github.event_name == 'workflow_dispatch' && inputs.build_image && github.sha) ||
            github.event.inputs.sha || github.event.workflow_run.head_sha || '' }}
      deploy: >-
        ${{
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
        }}
      fly-token-secret: FLY_MCP_TOKEN
