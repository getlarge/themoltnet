name: Publish stable download pins

on:
  workflow_call:
    inputs:
      cli_version:
        description: CLI version or release tag to pin.
        required: false
        type: string
      agent_version:
        description: Agent version or release tag to pin.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional CLI version; blank selects the latest published CLI release.
        required: false
        type: string
      agent_version:
        description: Optional agent version; blank selects the latest published agent release.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-stable-download-pins
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.MOLTNET_RELEASE_APP_ID }}
          private-key: ${{ secrets.MOLTNET_RELEASE_APP_KEY }}
          owner: getlarge
          repositories: themoltnet

      - name: Resolve stable versions and advance pins
        id: pins
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLI_INPUT: ${{ inputs.cli_version }}
          AGENT_INPUT: ${{ inputs.agent_version }}
        run: |
          latest() {
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft \
              --jq "[.[] | select(.isDraft | not) | .tagName | select(startswith(\"$1-v\"))][0] // empty" \
              | sed "s/^$1-v//"
          }
          CLI_VERSION="${CLI_INPUT#cli-v}"
          AGENT_VERSION="${AGENT_INPUT#agent-daemon-v}"
          CLI_VERSION="${CLI_VERSION:-$(latest cli)}"
          AGENT_VERSION="${AGENT_VERSION:-$(latest agent-daemon)}"
          test -n "$CLI_VERSION" -o -n "$AGENT_VERSION"
          CLI_VERSION="$CLI_VERSION" AGENT_VERSION="$AGENT_VERSION" bash tools/release/propose-download-pin.sh
          if git diff --quiet -- apps/landing/nginx/default.conf.template; then
            echo changed=false >> "$GITHUB_OUTPUT"
          else
            echo changed=true >> "$GITHUB_OUTPUT"
          fi

      - name: Open or refresh stable-pin PR
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          title="fix(landing): publish stable download pins"
          branch=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --state open \
            --limit 100 \
            --json headRefName,isCrossRepository,title \
            --jq "[.[] | select(.title == \"$title\") | select(.isCrossRepository | not) | .headRefName | select(startswith(\"automation/manual-download-pins\"))][0] // empty")
          branch="${branch:-automation/manual-download-pins}"
          git config user.name "MoltNet Release[bot]"
          git config user.email "261968324+moltnet-release[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add apps/landing/nginx/default.conf.template
          git commit -m "$title"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_branch_sha=$(git ls-remote --heads origin "refs/heads/${branch}" | awk '{print $1}')
          if [ -n "$remote_branch_sha" ]; then
            git push \
              --force-with-lease="refs/heads/${branch}:${remote_branch_sha}" \
              origin "HEAD:${branch}"
          else
            git push --set-upstream origin "HEAD:${branch}"
          fi
          pr_url=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --state open \
            --json url \
            --jq '.[0].url // empty')
          if [ -z "$pr_url" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "$title" \
              --body "Manual stable-pin publication after release artifact review."
          fi
