name: Deploy Ory Network

on:
  workflow_run:
    workflows: [Deploy API]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ory
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Ory Config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # workflow_run is privileged; checkout the trusted default branch only.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .tool-versions

      - name: Install Ory CLI
        uses: ./.github/actions/setup-ory-cli

      - name: Deploy to Ory Network
        env:
          OIDC_PAIRWISE_SALT: ${{ secrets.OIDC_PAIRWISE_SALT }}
          ORY_ACTION_API_KEY: ${{ secrets.ORY_ACTION_API_KEY }}
          ORY_PROJECT_ID: ${{ secrets.ORY_PROJECT_ID }}
          ORY_PROJECT_API_KEY: ${{ secrets.ORY_PROJECT_API_KEY }}
          ORY_WORKSPACE_API_KEY: ${{ secrets.ORY_WORKSPACE_API_KEY }}
          SELFSERVICE_OIDC_GITHUB_CLIENT_ID: ${{ secrets.SELFSERVICE_OIDC_GITHUB_CLIENT_ID }}
          SELFSERVICE_OIDC_GITHUB_CLIENT_SECRET: ${{ secrets.SELFSERVICE_OIDC_GITHUB_CLIENT_SECRET }}
          SMTP_CONNECTION_URI: ${{ secrets.SMTP_CONNECTION_URI }}
          SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}
        run: node --env-file=env.public infra/ory/deploy.mjs --apply
