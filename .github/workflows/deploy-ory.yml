name: Plan Ory Network configuration

# Production Ory is frozen while operational ownership is being migrated.
# This public workflow deliberately has no apply path and is never triggered by
# an application deployment. Live apply procedures are maintained privately.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-ory
  cancel-in-progress: false

jobs:
  plan:
    name: Plan Ory configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Ory CLI
        run: bash <(curl -s https://raw.githubusercontent.com/ory/meta/master/install.sh) -d -b /usr/local/bin ory

      - name: Plan Ory Network configuration
        env:
          OIDC_PAIRWISE_SALT: ${{ secrets.OIDC_PAIRWISE_SALT }}
          ORY_ACTION_API_KEY: ${{ secrets.ORY_ACTION_API_KEY }}
          ORY_PROJECT_ID: ${{ secrets.ORY_PROJECT_ID }}
          ORY_WORKSPACE_API_KEY: ${{ secrets.ORY_WORKSPACE_API_KEY }}
          SELFSERVICE_OIDC_GITHUB_CLIENT_ID: ${{ secrets.SELFSERVICE_OIDC_GITHUB_CLIENT_ID }}
          SELFSERVICE_OIDC_GITHUB_CLIENT_SECRET: ${{ secrets.SELFSERVICE_OIDC_GITHUB_CLIENT_SECRET }}
          SMTP_CONNECTION_URI: ${{ secrets.SMTP_CONNECTION_URI }}
          SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}
        run: node --env-file=env.public infra/ory/deploy.mjs
