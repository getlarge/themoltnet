name: Ubuntu desktop packages
on:
  pull_request:
    paths:
      - apps/agent-desktop/**
      - libs/design-system/**
      - libs/task-ui/**
      - tools/release/agent-desktop/**
      - .github/workflows/agent-desktop-linux.yml
      - .github/workflows/release.yml
      - pnpm-lock.yaml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NX_LOAD_DOT_ENV_FILES: 'false'
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0
      - name: Install packaging and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf libfuse2t64 xvfb dbus-x11
      - run: pnpm install --frozen-lockfile
      - name: Build unsigned CI packages
        run: pnpm exec nx run @moltnet/agent-desktop:tauri:bundle --configuration=linux-ci --excludeTaskDependencies
      - name: Verify package installation and launch
        run: bash tools/release/agent-desktop/linux-smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ubuntu-desktop-packages
          path: |
            apps/agent-desktop/out-rust/bundle/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            apps/agent-desktop/out-rust/bundle/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            /tmp/moltnet-desktop-smoke-*.log
