name: Adaptive review (reusable)

on:
  workflow_call:
    inputs:
      environment:
        type: string
        default: ''
      team-id:
        type: string
        default: ''
      diary-id:
        type: string
        default: ''
      project-id:
        type: string
        default: ''
      agent-name:
        type: string
        default: ''
      api-url:
        type: string
        default: ''
      app-id:
        type: string
        default: ''
      classifier-profile:
        type: string
        required: true
      docs-profile:
        type: string
        default: ''
      complexity-profile:
        type: string
        default: ''
      security-profile:
        type: string
        default: ''
      focused-profile:
        type: string
        default: ''
      focused-diary-ids:
        description: Optional JSON array of trusted diary UUIDs for the focused review runtime. Requires a matching adaptive_review_pi profile.
        type: string
        default: '[]'
      task-budgets:
        description: Optional YAML map of review timeout overrides (timeout, dispatch-timeout, expires-after; e.g. 12m).
        type: string
        default: ''
      mode:
        type: string
        default: shadow
      execution-mode:
        description: durable requires persistent Postgres; ephemeral provisions disposable Postgres for the complete workflow and cannot resume lost jobs.
        type: string
        default: durable
      retention-completed-days:
        description: Days without coordinator use before published executions are eligible for cleanup. Use one policy for every caller sharing a database.
        type: number
        default: 30
      retention-unfinished-days:
        description: Days without coordinator use before unfinished executions are eligible for cleanup. Active coordinators are always retained.
        type: number
        default: 90
      inline-findings:
        description: Post each cited finding as a review thread on its line ('true' or 'false').
        type: string
        default: 'true'
      providers:
        type: string
        required: true
      protected-paths:
        type: string
        default: ''
      runtime-ref:
        type: string
        default: ''
      daemon-version:
        description: Optional exact daemon version override; defaults to the version packaged with this review release.
        type: string
        default: ''
    outputs:
      skip:
        value: ${{ jobs.review.outputs.skip }}
      correlation-id:
        value: ${{ jobs.review.outputs.correlation }}
    secrets:
      ADAPTIVE_DATABASE_URL:
        description: Required in durable mode; initialized persistent Absurd Postgres accessible to the coordinator. Unused in ephemeral mode.
        required: false
      MOLTNET_AGENT_KEY:
        required: false
      MOLTNET_PRIVATE_KEY:
        required: false
      MOLTNET_GITHUB_APP_PRIVATE_KEY:
        required: false
      OLLAMA_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false

permissions: {}

concurrency:
  group: adaptive-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Actions supplies infrastructure. The Absurd task owns the domain graph.
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.issue.state == 'open' &&
        github.event.comment.body == '/review' &&
        github.event.comment.user.type == 'User' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 125
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      pull-requests: read
    services:
      absurd:
        image: ${{ inputs.execution-mode == 'ephemeral' && 'postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a' || '' }}
        env:
          POSTGRES_USER: issue_lifecycle
          POSTGRES_PASSWORD: issue_lifecycle_secret
          POSTGRES_DB: issue_lifecycle
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U issue_lifecycle -d issue_lifecycle"
          --health-interval 5s --health-timeout 3s --health-retries 10
    outputs:
      skip: ${{ steps.run.outputs.skip }}
      correlation: ${{ steps.intent.outputs.correlation }}
    env:
      ADAPTIVE_EXECUTION_MODE: ${{ inputs.execution-mode }}
      ADAPTIVE_DATABASE_URL: ${{ inputs.execution-mode == 'durable' && secrets.ADAPTIVE_DATABASE_URL || '' }}
      ADAPTIVE_RETRY_FAILED: ${{ inputs.execution-mode == 'durable' && github.run_attempt > 1 }}
      ADAPTIVE_RETENTION_COMPLETED_DAYS: ${{ inputs.retention-completed-days }}
      ADAPTIVE_RETENTION_UNFINISHED_DAYS: ${{ inputs.retention-unfinished-days }}
      ADAPTIVE_REPOSITORY: ${{ github.repository }}
      ADAPTIVE_PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      ADAPTIVE_MODE: ${{ inputs.mode }}
      ADAPTIVE_PUBLICATION: github
      ADAPTIVE_INLINE_FINDINGS: ${{ inputs.inline-findings }}
      ADAPTIVE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ADAPTIVE_REPORT: ${{ github.workspace }}/adaptive-report.json
      ADAPTIVE_TASK_BUDGETS: ${{ inputs.task-budgets }}
      ADAPTIVE_CLASSIFIER_PROFILE: ${{ inputs.classifier-profile }}
      ADAPTIVE_FOCUSED_PROFILE: ${{ inputs.focused-profile }}
      ADAPTIVE_DOCS_PROFILE: ${{ inputs.docs-profile }}
      ADAPTIVE_COMPLEXITY_PROFILE: ${{ inputs.complexity-profile }}
      ADAPTIVE_SECURITY_PROFILE: ${{ inputs.security-profile }}
      PROTECTED_PATHS: ${{ inputs.protected-paths }}
      MOLTNET_AGENT_NAME: ${{ inputs.agent-name || vars.MOLTNET_AGENT_NAME }}
      MOLTNET_AGENT_KEY: ${{ secrets.MOLTNET_AGENT_KEY }}
      MOLTNET_PRIVATE_KEY: ${{ secrets.MOLTNET_PRIVATE_KEY }}
      MOLTNET_API_URL: ${{ inputs.api-url || vars.MOLTNET_API_URL }}
      MOLTNET_TEAM_ID: ${{ inputs.team-id || vars.MOLTNET_TEAM_ID }}
      MOLTNET_DIARY_ID: ${{ inputs.diary-id || vars.MOLTNET_DIARY_ID }}
      MOLTNET_PROJECT_ID: ${{ inputs.project-id }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Resolve trusted runtime and review intent
        id: intent
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository || 'getlarge/themoltnet' }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          RUNTIME_REF: ${{ inputs.runtime-ref }}
        run: |
          set -euo pipefail
          runtime_ref="${RUNTIME_REF:-$WORKFLOW_SHA}"
          if ! [[ "$runtime_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::set runtime-ref to the immutable review bundle SHA when workflow identity context is unavailable' >&2
            exit 1
          fi
          echo "repository=$WORKFLOW_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "ref=$runtime_ref" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          const attempt = process.env.ADAPTIVE_EXECUTION_MODE === 'ephemeral' ? `:${process.env.GITHUB_RUN_ATTEMPT}` : '';
          const hex = createHash('sha256').update(`${process.env.ADAPTIVE_REPOSITORY}:${process.env.GITHUB_RUN_ID}${attempt}`).digest('hex');
          const correlation = `${hex.slice(0,8)}-${hex.slice(8,12)}-4${hex.slice(13,16)}-a${hex.slice(17,20)}-${hex.slice(20,32)}`;
          appendFileSync(process.env.GITHUB_OUTPUT, `correlation=${correlation}\n`);
          appendFileSync(process.env.GITHUB_ENV, `ADAPTIVE_EXECUTION_ID=${correlation}\n`);
          JS
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.intent.outputs.repository }}
          ref: ${{ steps.intent.outputs.ref }}
          path: .adaptive-review-runtime
          persist-credentials: false
      - uses: ./.adaptive-review-runtime/packages/adaptive-review-action/setup
      - name: Resolve bundled worker version
        id: worker
        env:
          DAEMON_OVERRIDE: ${{ inputs.daemon-version }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const metadata = JSON.parse(readFileSync('.adaptive-review-runtime/packages/adaptive-review-action/dist/release-dependencies.json', 'utf8'));
          const version = process.env.DAEMON_OVERRIDE || metadata.daemonVersion;
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('daemon-version must be an exact stable version');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS
      - name: Configure review database
        env:
          ADAPTIVE_POSTGRES_PORT: ${{ job.services.absurd.ports['5432'] }}
          ADAPTIVE_POSTGRES_CONTAINER: ${{ job.services.absurd.id }}
        run: bash .adaptive-review-runtime/tools/setup-adaptive-review-database.sh
      - name: Restore bundled worker action
        run: |
          mkdir -p .adaptive-review-runtime/packages/agent-daemon-action/dist
          cp -R .adaptive-review-runtime/packages/adaptive-review-action/dist/worker-action/. .adaptive-review-runtime/packages/agent-daemon-action/dist/
          echo "ADAPTIVE_RUNTIME_SHA=$(git -C .adaptive-review-runtime rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install optional focused runtime
        id: diary-runtime
        if: inputs.focused-diary-ids != '[]'
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          DAEMON_VERSION: ${{ steps.worker.outputs.version }}
          ADAPTIVE_REVIEW_DIARY_IDS: ${{ inputs.focused-diary-ids }}
        run: |
          bash .adaptive-review-runtime/tools/setup-adaptive-review-diary-runtime.sh .adaptive-review-runtime
      - name: Mint reviewer App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-id || vars.MOLTNET_GITHUB_APP_ID }}
          private-key: ${{ secrets.MOLTNET_GITHUB_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
          permission-contents: read
      - name: Run the complete durable review
        id: run
        uses: ./.adaptive-review-runtime/packages/agent-daemon-action
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ADAPTIVE_APP_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          ADAPTIVE_GITHUB_APP_ID: ${{ inputs.app-id || vars.MOLTNET_GITHUB_APP_ID }}
          MOLTNET_GITHUB_APP_PRIVATE_KEY: ${{ secrets.MOLTNET_GITHUB_APP_PRIVATE_KEY }}
          ADAPTIVE_FOCUSED_RUNTIME: ${{ steps.diary-runtime.outputs.module }}
        with:
          mode: drain
          agent-name: ${{ inputs.agent-name || vars.MOLTNET_AGENT_NAME }}
          profile: ${{ inputs.classifier-profile }}
          supervisor-entry: ${{ github.workspace }}/.adaptive-review-runtime/packages/adaptive-review-action/dist/run.js
          daemon-version: ${{ steps.worker.outputs.version }}
          providers: ${{ inputs.providers }}
      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: adaptive-review-${{ github.repository_id }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.run_attempt }}
          path: ${{ env.ADAPTIVE_REPORT }}
          if-no-files-found: ignore
          retention-days: 14
