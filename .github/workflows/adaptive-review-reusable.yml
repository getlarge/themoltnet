name: Adaptive review (reusable)

on:
  workflow_call:
    inputs:
      environment:
        type: string
        default: ''
      team-id:
        type: string
        default: ''
      diary-id:
        type: string
        default: ''
      project-id:
        type: string
        default: ''
      agent-name:
        type: string
        default: ''
      api-url:
        type: string
        default: ''
      app-id:
        type: string
        default: ''
      classifier-profile:
        type: string
        required: true
      docs-profile:
        type: string
        default: ''
      complexity-profile:
        type: string
        default: ''
      security-profile:
        type: string
        default: ''
      focused-profile:
        type: string
        default: ''
      focused-diary-ids:
        description: Optional JSON array of trusted diary UUIDs for the focused review runtime. Requires a matching adaptive_review_pi profile.
        type: string
        default: '[]'
      task-budgets:
        description: Optional YAML map of review timeout overrides (timeout, dispatch-timeout, expires-after; e.g. 12m).
        type: string
        default: ''
      mode:
        type: string
        default: shadow
      inline-findings:
        description: Post each cited finding as a review thread on its line ('true' or 'false').
        type: string
        default: 'true'
      providers:
        type: string
        required: true
      protected-paths:
        type: string
        default: ''
      runtime-ref:
        type: string
        default: ''
      daemon-version:
        type: string
        default: '0.74.1'
    outputs:
      skip:
        value: ${{ jobs.prepare.outputs.skip }}
      correlation-id:
        value: ${{ jobs.prepare.outputs.correlation }}
    secrets:
      MOLTNET_AGENT_KEY:
        required: false
      MOLTNET_PRIVATE_KEY:
        required: false
      MOLTNET_GITHUB_APP_PRIVATE_KEY:
        required: false
      OLLAMA_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false

permissions: {}

concurrency:
  group: adaptive-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  prepare:
    # A comment event is the caller's on-demand request; it has no draft flag.
    if: github.event_name == 'issue_comment' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Fail closed: only an explicit pin verdict of false lets the review run.
      skip: ${{ steps.pin.outputs.skip != 'false' || steps.plan.outputs.review-enabled != 'true' }}
      prepared: ${{ steps.pin.outputs.prepared }}
      base: ${{ steps.pin.outputs.base }}
      head: ${{ steps.pin.outputs.head }}
      correlation: ${{ steps.pin.outputs.correlation }}
      classifier-needed: ${{ steps.plan.outputs.classifier-needed }}
      review-enabled: ${{ steps.plan.outputs.review-enabled }}
      runtime-repository: ${{ steps.runtime.outputs.repository }}
      runtime-sha: ${{ steps.runtime-pin.outputs.sha }}
      action-digest: ${{ steps.bundle.outputs.digest }}
      action-artifact-id: ${{ steps.action-artifact.outputs.artifact-id }}
    steps:
      - name: Resolve trusted review runtime
        id: runtime
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          RUNTIME_REF: ${{ inputs.runtime-ref }}
          PROVIDERS: ${{ inputs.providers }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$PROVIDERS" | grep -Eq '^[[:space:]]*[^#[:space:]]'; then
            echo '::error::providers needs at least one provider definition' >&2
            exit 1
          fi
          if [ -z "$WORKFLOW_REPOSITORY" ]; then
            echo '::error::job.workflow_repository is required' >&2
            exit 1
          fi
          runtime_ref="${RUNTIME_REF:-$WORKFLOW_SHA}"
          if ! [[ "$runtime_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::runtime-ref or job.workflow_sha must be a full commit SHA' >&2
            exit 1
          fi
          echo "repository=$WORKFLOW_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "ref=$runtime_ref" >> "$GITHUB_OUTPUT"
      # A comment event names the pull request only by number; read the
      # facts the pull_request event would carry from the API.
      - name: Resolve commented pull request
        id: pr
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '
            "base=\(.base.sha)",
            "head-repository=\(.head.repo.full_name // "")",
            "author=\(.user.login)"' >> "$GITHUB_OUTPUT"
      # The event's base commit is the one the eligibility step pins.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || steps.pr.outputs.base }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.runtime.outputs.repository }}
          ref: ${{ steps.runtime.outputs.ref }}
          path: .adaptive-review-runtime
          persist-credentials: false
      - name: Pin runtime commit
        id: runtime-pin
        run: echo "sha=$(git -C .adaptive-review-runtime rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Fork and Dependabot PRs are ineligible from the event alone; skip them
      # before the install. The pin step still applies every eligibility rule.
      - name: Screen pull request source
        id: screen
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || steps.pr.outputs.head-repository }}
          AUTHOR: ${{ github.event.pull_request.user.login || steps.pr.outputs.author }}
        run: |
          if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo '::notice::Adaptive review skipped: fork pull requests are not reviewed'
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
          elif [ "$AUTHOR" = 'dependabot[bot]' ]; then
            echo '::notice::Adaptive review skipped: Dependabot pull requests are not reviewed'
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
          else
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.adaptive-review-runtime/packages/adaptive-review-action/setup
        if: steps.screen.outputs.eligible == 'true'
        with:
          with-worker-action: ${{ inputs.focused-diary-ids != '[]' }}
      - name: Pin reviewed PR and protect the runtime
        id: pin
        if: steps.screen.outputs.eligible == 'true'
        uses: ./.adaptive-review-runtime/packages/adaptive-review-action
        env:
          GH_TOKEN: ${{ github.token }}
          PROTECTED_PATHS: ${{ inputs.protected-paths }}
        with:
          step: prepare
      - name: Fetch reviewed head as inert Git data
        if: steps.pin.outputs.skip == 'false'
        env:
          BASE_SHA: ${{ steps.pin.outputs.base }}
          HEAD_SHA: ${{ steps.pin.outputs.head }}
          GH_TOKEN: ${{ github.token }}
        run: bash .adaptive-review-runtime/tools/fetch-adaptive-review-head.sh
      - name: Write pinned planner input
        if: steps.pin.outputs.skip == 'false'
        env:
          PREPARED_JSON: ${{ steps.pin.outputs.prepared }}
        run: |
          node -e "require('node:fs').writeFileSync('adaptive-prepared.json', process.env.PREPARED_JSON, {mode: 0o600})"
      - name: Check classifier work budget
        id: plan
        if: steps.pin.outputs.skip == 'false'
        uses: ./.adaptive-review-runtime/packages/adaptive-review-action
        env:
          GH_TOKEN: ${{ github.token }}
          ADAPTIVE_PREPARED: ${{ github.workspace }}/adaptive-prepared.json
        with:
          step: plan
      # Later jobs run this bundle instead of reinstalling the workspace; the
      # digest output lets them check they run exactly what was built here.
      - name: Record the review action bundle
        id: bundle
        if: steps.plan.outputs.review-enabled == 'true'
        run: bash .adaptive-review-runtime/tools/adaptive-review-action-digest.sh .adaptive-review-runtime/packages/adaptive-review-action/dist >> "$GITHUB_OUTPUT"
      - name: Upload the review action bundle
        id: action-artifact
        if: steps.plan.outputs.review-enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: adaptive-review-action-${{ github.repository_id }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.run_attempt }}
          path: .adaptive-review-runtime/packages/adaptive-review-action/dist
          if-no-files-found: error
          retention-days: 14

  route:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false' && needs.prepare.outputs.review-enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: ${{ inputs.environment }}
    permissions:
      # Reads this run's worker jobs to stop waiting once they have exited.
      actions: read
      contents: read
      pull-requests: read
    outputs:
      specialists: ${{ steps.route.outputs.specialists }}
      has-specialists: ${{ steps.route.outputs.has-specialists }}
      route-artifact-id: ${{ steps.route-artifact.outputs.artifact-id }}
    env:
      ADAPTIVE_MODE: ${{ inputs.mode }}
      ADAPTIVE_PREPARED: ${{ github.workspace }}/adaptive-prepared.json
      ADAPTIVE_ROUTE: ${{ github.workspace }}/adaptive-route.json
      ADAPTIVE_REPORT: ${{ github.workspace }}/adaptive-report.json
      ADAPTIVE_CLASSIFIER_PROFILE: ${{ inputs.classifier-profile }}
      ADAPTIVE_DOCS_PROFILE: ${{ inputs.docs-profile }}
      ADAPTIVE_COMPLEXITY_PROFILE: ${{ inputs.complexity-profile }}
      ADAPTIVE_SECURITY_PROFILE: ${{ inputs.security-profile }}
      ADAPTIVE_FOCUSED_PROFILE: ${{ inputs.focused-profile }}
      ADAPTIVE_TASK_BUDGETS: ${{ inputs.task-budgets }}
      MOLTNET_AGENT_KEY: ${{ secrets.MOLTNET_AGENT_KEY }}
      MOLTNET_AGENT_NAME: ${{ inputs.agent-name || vars.MOLTNET_AGENT_NAME }}
      MOLTNET_API_URL: ${{ inputs.api-url || vars.MOLTNET_API_URL }}
      MOLTNET_TEAM_ID: ${{ inputs.team-id || vars.MOLTNET_TEAM_ID }}
      MOLTNET_DIARY_ID: ${{ inputs.diary-id || vars.MOLTNET_DIARY_ID }}
      MOLTNET_PROJECT_ID: ${{ inputs.project-id }}
      ADAPTIVE_RUNTIME_SHA: ${{ needs.prepare.outputs.runtime-sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ needs.prepare.outputs.runtime-repository }}
          ref: ${{ needs.prepare.outputs.runtime-sha }}
          path: .adaptive-review-runtime
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .adaptive-review-runtime/.tool-versions
      - name: Download the review action bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.action-artifact-id }}
          merge-multiple: true
          path: .adaptive-review-runtime/packages/adaptive-review-action/dist
      - name: Verify the review action bundle
        env:
          EXPECTED_DIGEST: ${{ needs.prepare.outputs.action-digest }}
        run: bash .adaptive-review-runtime/tools/adaptive-review-action-digest.sh --verify "$EXPECTED_DIGEST" .adaptive-review-runtime/packages/adaptive-review-action/dist
      - name: Fetch reviewed head as inert Git data
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
          GH_TOKEN: ${{ github.token }}
        run: bash .adaptive-review-runtime/tools/fetch-adaptive-review-head.sh
      - name: Write pinned review input
        env:
          PREPARED_JSON: ${{ needs.prepare.outputs.prepared }}
        run: |
          node -e "require('node:fs').writeFileSync(process.env.ADAPTIVE_PREPARED, process.env.PREPARED_JSON, {mode: 0o600})"
      - name: Classify and route the review
        id: route
        uses: ./.adaptive-review-runtime/packages/adaptive-review-action
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          step: route
      - name: Upload routing decision
        id: route-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: adaptive-route-${{ github.repository_id }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.run_attempt }}
          path: ${{ env.ADAPTIVE_ROUTE }}
          retention-days: 14

  review:
    needs: [prepare, route]
    if: needs.route.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: ${{ inputs.environment }}
    permissions:
      # Reads this run's worker jobs to stop waiting once they have exited.
      actions: read
      contents: read
      pull-requests: read
    env:
      ADAPTIVE_MODE: ${{ inputs.mode }}
      ADAPTIVE_PREPARED: ${{ github.workspace }}/adaptive-prepared.json
      ADAPTIVE_ROUTE: ${{ github.workspace }}/adaptive-route.json
      ADAPTIVE_REPORT: ${{ github.workspace }}/adaptive-report.json
      ADAPTIVE_CLASSIFIER_PROFILE: ${{ inputs.classifier-profile }}
      ADAPTIVE_DOCS_PROFILE: ${{ inputs.docs-profile }}
      ADAPTIVE_COMPLEXITY_PROFILE: ${{ inputs.complexity-profile }}
      ADAPTIVE_SECURITY_PROFILE: ${{ inputs.security-profile }}
      ADAPTIVE_FOCUSED_PROFILE: ${{ inputs.focused-profile }}
      ADAPTIVE_TASK_BUDGETS: ${{ inputs.task-budgets }}
      MOLTNET_AGENT_KEY: ${{ secrets.MOLTNET_AGENT_KEY }}
      MOLTNET_AGENT_NAME: ${{ inputs.agent-name || vars.MOLTNET_AGENT_NAME }}
      MOLTNET_API_URL: ${{ inputs.api-url || vars.MOLTNET_API_URL }}
      MOLTNET_TEAM_ID: ${{ inputs.team-id || vars.MOLTNET_TEAM_ID }}
      MOLTNET_DIARY_ID: ${{ inputs.diary-id || vars.MOLTNET_DIARY_ID }}
      MOLTNET_PROJECT_ID: ${{ inputs.project-id }}
      ADAPTIVE_RUNTIME_SHA: ${{ needs.prepare.outputs.runtime-sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ needs.prepare.outputs.runtime-repository }}
          ref: ${{ needs.prepare.outputs.runtime-sha }}
          path: .adaptive-review-runtime
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .adaptive-review-runtime/.tool-versions
      - name: Download the review action bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.action-artifact-id }}
          merge-multiple: true
          path: .adaptive-review-runtime/packages/adaptive-review-action/dist
      - name: Verify the review action bundle
        env:
          EXPECTED_DIGEST: ${{ needs.prepare.outputs.action-digest }}
        run: bash .adaptive-review-runtime/tools/adaptive-review-action-digest.sh --verify "$EXPECTED_DIGEST" .adaptive-review-runtime/packages/adaptive-review-action/dist
      - name: Fetch reviewed head as inert Git data
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
          GH_TOKEN: ${{ github.token }}
        run: bash .adaptive-review-runtime/tools/fetch-adaptive-review-head.sh
      - name: Write pinned review input
        env:
          PREPARED_JSON: ${{ needs.prepare.outputs.prepared }}
        run: |
          node -e "require('node:fs').writeFileSync(process.env.ADAPTIVE_PREPARED, process.env.PREPARED_JSON, {mode: 0o600})"
      - name: Download routing decision
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.route.outputs.route-artifact-id }}
          merge-multiple: true
          path: ${{ github.workspace }}
      # Resolve the publisher identity before reading its prior discussions.
      # Mint the write token later so long reviews cannot exhaust its lifetime.
      - name: Resolve reviewer App identity
        id: reviewer-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-id || vars.MOLTNET_GITHUB_APP_ID }}
          private-key: ${{ secrets.MOLTNET_GITHUB_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: read
      - name: Run selected review lanes
        id: review
        uses: ./.adaptive-review-runtime/packages/adaptive-review-action
        env:
          GH_TOKEN: ${{ github.token }}
          ADAPTIVE_APP_LOGIN: ${{ steps.reviewer-app.outputs.app-slug }}[bot]
        with:
          step: review
      - name: Detect review report
        id: report-file
        if: always()
        run: |
          if test -s "$ADAPTIVE_REPORT"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload review report
        if: always() && steps.report-file.outputs.exists == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: adaptive-review-${{ github.repository_id }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.run_attempt }}
          path: ${{ env.ADAPTIVE_REPORT }}
          retention-days: 14
      - name: Mint LeGreffier comment token
        id: app-token
        if: always() && steps.report-file.outputs.exists == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-id || vars.MOLTNET_GITHUB_APP_ID }}
          private-key: ${{ secrets.MOLTNET_GITHUB_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      - name: Upsert PR comment
        if: always() && steps.app-token.outcome == 'success'
        uses: ./.adaptive-review-runtime/packages/adaptive-review-action
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ADAPTIVE_APP_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          ADAPTIVE_INLINE_FINDINGS: ${{ inputs.inline-findings }}
          ADAPTIVE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          step: publish

  classifier-worker:
    needs: prepare
    if: needs.prepare.outputs.classifier-needed == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ needs.prepare.outputs.runtime-sha }}
          path: .adaptive-review-runtime
          persist-credentials: false
      - name: Fetch reviewed head as inert Git data
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
          GH_TOKEN: ${{ github.token }}
        run: bash .adaptive-review-runtime/tools/fetch-adaptive-review-head.sh
      - name: Drain this review's tasks
        uses: getlarge/themoltnet/packages/agent-daemon-action@7188bc8c46b85a938ef7710661de9274f5338989 # v0.7.1
        env:
          MOLTNET_AGENT_KEY: ${{ secrets.MOLTNET_AGENT_KEY }}
          MOLTNET_AGENT_NAME: ${{ inputs.agent-name || vars.MOLTNET_AGENT_NAME }}
          MOLTNET_API_URL: ${{ inputs.api-url || vars.MOLTNET_API_URL }}
          MOLTNET_TEAM_ID: ${{ inputs.team-id || vars.MOLTNET_TEAM_ID }}
          MOLTNET_PRIVATE_KEY: ${{ secrets.MOLTNET_PRIVATE_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          agent-name: ${{ inputs.agent-name || vars.MOLTNET_AGENT_NAME }}
          mode: drain
          task-types: classify
          correlation-id: ${{ needs.prepare.outputs.correlation }}
          project-id: ${{ inputs.project-id }}
          profile: ${{ inputs.classifier-profile }}
          daemon-version: ${{ inputs.daemon-version }}
          wait-for-first-task-sec: '900'
          wait-after-task-sec: '120'
          max-poll-interval-ms: '3000'
          providers: ${{ inputs.providers }}

  specialist-workers:
    name: 'Specialist ${{ matrix.profile }} #${{ matrix.worker }}'
    needs: [prepare, route]
    if: needs.route.outputs.has-specialists == 'true'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.route.outputs.specialists) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ needs.prepare.outputs.runtime-sha }}
          path: .adaptive-review-runtime
          persist-credentials: false
      - name: Fetch reviewed head as inert Git data
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          HEAD_SHA: ${{ needs.prepare.outputs.head }}
          GH_TOKEN: ${{ github.token }}
        run: bash .adaptive-review-runtime/tools/fetch-adaptive-review-head.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: inputs.focused-diary-ids != '[]' && matrix.profile == inputs.focused-profile
        with:
          node-version: '24'
      - name: Download optional review runtime bundle
        if: inputs.focused-diary-ids != '[]' && matrix.profile == inputs.focused-profile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.action-artifact-id }}
          merge-multiple: true
          path: .adaptive-review-runtime/packages/adaptive-review-action/dist
      - name: Verify optional review runtime bundle
        if: inputs.focused-diary-ids != '[]' && matrix.profile == inputs.focused-profile
        env:
          EXPECTED_DIGEST: ${{ needs.prepare.outputs.action-digest }}
        run: bash .adaptive-review-runtime/tools/adaptive-review-action-digest.sh --verify "$EXPECTED_DIGEST" .adaptive-review-runtime/packages/adaptive-review-action/dist
      - name: Install optional review runtime
        id: diary-runtime
        if: inputs.focused-diary-ids != '[]' && matrix.profile == inputs.focused-profile
        env:
          DAEMON_VERSION: ${{ inputs.daemon-version }}
          ADAPTIVE_REVIEW_DIARY_IDS: ${{ inputs.focused-diary-ids }}
        run: bash .adaptive-review-runtime/tools/setup-adaptive-review-diary-runtime.sh .adaptive-review-runtime
      - name: Drain selected review tasks
        if: inputs.focused-diary-ids == '[]' || matrix.profile != inputs.focused-profile
        uses: getlarge/themoltnet/packages/agent-daemon-action@7188bc8c46b85a938ef7710661de9274f5338989 # v0.7.1
        env:
