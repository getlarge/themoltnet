name: CodeBoarding review

on:
  pull_request:
    # Analyze once when a PR becomes reviewable. Refresh the architecture diff
    # against the latest head at any time with a `/codeboarding` comment.
    types: [opened, reopened, ready_for_review, closed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # CodeBoarding uses a short-lived OIDC token for its free hosted tier.
  id-token: write

concurrency:
  group: codeboarding-${{ github.event.pull_request.number || github.event.issue.number }}
  # Closing a PR should cancel its review. Comment-triggered refreshes queue so
  # they do not interrupt an analysis already in progress.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}

jobs:
  review:
    if: >
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.ref != 'codeboarding/sync') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/codeboarding') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      # scripts/action/with-auth.sh hard-requires OLLAMA_BASE_URL (or
      # OLLAMA_HOST) whenever llm_provider is ollama, and exits 1 before any
      # analysis runs. It reads them from the job environment — the action has
      # no input for the endpoint.
      OLLAMA_BASE_URL: ${{ secrets.OLLAMA_API_KEY != '' && 'https://ollama.com' || '' }}
    steps:
      - uses: CodeBoarding/CodeBoarding-action@v1
        with:
          # llm_api_key must be the credential, not the endpoint:
          # scripts/action/configure-auth.sh derives the provider env var name
          # from llm_provider (ollama -> OLLAMA_API_KEY) and writes llm_api_key
          # into it verbatim. Passing the base URL here set OLLAMA_API_KEY to a
          # URL and clobbered the real secret.
          # Fall back to the free OIDC tier when GitHub withholds the secret.
          llm_provider: ${{ secrets.OLLAMA_API_KEY != '' && 'ollama' || 'openrouter' }}
          llm_api_key: ${{ secrets.OLLAMA_API_KEY }}
          agent_model: ${{ secrets.OLLAMA_API_KEY != '' && 'gemma4:31b-cloud' || '' }}
          parsing_model: ${{ secrets.OLLAMA_API_KEY != '' && 'gpt-oss:20b-cloud' || '' }}
