name: Release self-host bundle

on:
  push:
    tags:
      - self-host-v*
  workflow_dispatch:
    inputs:
      version:
        description: Bundle version; select its matching self-host-v tag (for example 1.0.0-rc.1)
        required: true

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#self-host-v}"
          fi
          # The consumer authenticates provenance against this exact tag ref.
          # workflow_dispatch must select that tag rather than a branch.
          if [ "$GITHUB_REF" != "refs/tags/self-host-v$version" ]; then
            echo 'Select the self-host-v<version> tag matching the bundle version' >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve source image tag
        id: image-tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="self-host-$VERSION-${GITHUB_SHA:0:12}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo 'Invalid source image tag' >&2
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Authenticate to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: ./.github/actions/setup-workspace
        with:
          go: 'false'

      - name: Publish bundle images from this source revision
        env:
          NX_DOCKER_RELEASE_TAG: ${{ steps.image-tag.outputs.value }}
          NX_LOAD_DOT_ENV_FILES: 'false'
        run: >-
          pnpm exec nx run-many -t docker:build
          --projects=@moltnet/rest-api,@moltnet/mcp-server,@moltnet/console,@moltnet/database
          --configuration=release --parallel=1

      - name: Verify multi-platform image manifests
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.value }}
        run: |
          for project in @moltnet/rest-api @moltnet/mcp-server @moltnet/console @moltnet/database; do
            node tools/verify-docker-manifest.mjs --project "$project" --tag "$IMAGE_TAG"
          done

      - name: Build digest-pinned archive
        env:
          VERSION: ${{ steps.version.outputs.value }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.value }}
        run: |
          set -euo pipefail
          root="moltnet-self-host-$VERSION"
          node tools/release/self-host-bundle.mjs --version "$VERSION" --image-tag "$IMAGE_TAG" --output "$root"
          (cd "$root" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$root" && sha256sum -c SHA256SUMS)

      - name: Smoke-test Ory against populated PostgreSQL 17
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: node tools/release/ory-module-smoke.mjs "moltnet-self-host-$VERSION"

      - name: Smoke-test released images through Caddy
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: tools/release/self-host-smoke.sh "moltnet-self-host-$VERSION"

      - name: Package verified archive
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          root="moltnet-self-host-$VERSION"
          (cd "$root" && sha256sum -c SHA256SUMS)
          tar -czf "$root.tar.gz" "$root"
          sha256sum "$root.tar.gz" > "$root.tar.gz.sha256"

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: moltnet-self-host-${{ steps.version.outputs.value }}.tar.gz

      - name: Resolve first-party image subjects
        id: subjects
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          for variable in REST_API_IMAGE MCP_SERVER_IMAGE CONSOLE_IMAGE DB_MIGRATE_IMAGE; do
            ref=$(sed -n "s/^$variable=//p" "moltnet-self-host-$VERSION/deploy/self-host/.env.release")
            echo "${variable}_name=${ref%@*}" >> "$GITHUB_OUTPUT"
            echo "${variable}_digest=${ref##*@}" >> "$GITHUB_OUTPUT"
          done

      - name: Attest REST API image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.subjects.outputs.REST_API_IMAGE_name }}
          subject-digest: ${{ steps.subjects.outputs.REST_API_IMAGE_digest }}
          push-to-registry: true

      - name: Attest MCP image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.subjects.outputs.MCP_SERVER_IMAGE_name }}
          subject-digest: ${{ steps.subjects.outputs.MCP_SERVER_IMAGE_digest }}
          push-to-registry: true

      - name: Attest Console image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.subjects.outputs.CONSOLE_IMAGE_name }}
          subject-digest: ${{ steps.subjects.outputs.CONSOLE_IMAGE_digest }}
          push-to-registry: true

      - name: Attest database and Ory tools image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.subjects.outputs.DB_MIGRATE_IMAGE_name }}
          subject-digest: ${{ steps.subjects.outputs.DB_MIGRATE_IMAGE_digest }}
          push-to-registry: true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moltnet-self-host-${{ steps.version.outputs.value }}
          path: |
            moltnet-self-host-${{ steps.version.outputs.value }}.tar.gz
            moltnet-self-host-${{ steps.version.outputs.value }}.tar.gz.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/self-host-v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "self-host-v$VERSION" \
            "moltnet-self-host-$VERSION.tar.gz" \
            "moltnet-self-host-$VERSION.tar.gz.sha256" \
            --verify-tag \
            --generate-notes
