name: Release self-host bundle

on:
  push:
    tags:
      - self-host-v*
  workflow_dispatch:
    inputs:
      version:
        description: Bundle version; select its matching self-host-v tag (for example 1.0.0-rc.1)
        required: true

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#self-host-v}"
          fi
          # The consumer authenticates provenance against this exact tag ref.
          # workflow_dispatch must select that tag rather than a branch.
          if [ "$GITHUB_REF" != "refs/tags/self-host-v$version" ]; then
            echo 'Select the self-host-v<version> tag matching the bundle version' >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve source image tag
        id: image-tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="self-host-$VERSION-${GITHUB_SHA:0:12}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo 'Invalid source image tag' >&2
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Authenticate to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: ./.github/actions/setup-workspace
        with:
          go: 'false'

      - name: Publish bundle images from this source revision
        env:
          NX_DOCKER_METADATA_DIR: ${{ runner.temp }}/self-host-build-metadata
          NX_DOCKER_RELEASE_TAG: ${{ steps.image-tag.outputs.value }}
          NX_LOAD_DOT_ENV_FILES: 'false'
        run: >-
          pnpm exec nx run-many -t docker:build
          --projects=@moltnet/rest-api,@moltnet/mcp-server,@moltnet/console,@moltnet/database
          --configuration=release --parallel=1

      - name: Verify rest-api multi-platform build output
        id: rest-api
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.value }}
          METADATA_FILE: ${{ runner.temp }}/self-host-build-metadata/rest-api.json
        run: >-
          node tools/verify-docker-manifest.mjs --project @moltnet/rest-api
          --tag "$IMAGE_TAG" --metadata-file "$METADATA_FILE"

      - name: Attest rest-api build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.rest-api.outputs.image_name }}
          subject-digest: ${{ steps.rest-api.outputs.image_digest }}
          push-to-registry: true

      - name: Verify mcp-server multi-platform build output
        id: mcp-server
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.value }}
          METADATA_FILE: ${{ runner.temp }}/self-host-build-metadata/mcp-server.json
        run: >-
          node tools/verify-docker-manifest.mjs --project @moltnet/mcp-server
          --tag "$IMAGE_TAG" --metadata-file "$METADATA_FILE"

      - name: Attest mcp-server build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.mcp-server.outputs.image_name }}
          subject-digest: ${{ steps.mcp-server.outputs.image_digest }}
          push-to-registry: true

      - name: Verify console multi-platform build output
        id: console
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.value }}
          METADATA_FILE: ${{ runner.temp }}/self-host-build-metadata/console.json
        run: >-
          node tools/verify-docker-manifest.mjs --project @moltnet/console
          --tag "$IMAGE_TAG" --metadata-file "$METADATA_FILE"

      - name: Attest console build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.console.outputs.image_name }}
          subject-digest: ${{ steps.console.outputs.image_digest }}
          push-to-registry: true

      - name: Verify database multi-platform build output
        id: database
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.value }}
          METADATA_FILE: ${{ runner.temp }}/self-host-build-metadata/db-migrate.json
        run: >-
          node tools/verify-docker-manifest.mjs --project @moltnet/database
          --tag "$IMAGE_TAG" --metadata-file "$METADATA_FILE"

      - name: Attest database build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.database.outputs.image_name }}
          subject-digest: ${{ steps.database.outputs.image_digest }}
          push-to-registry: true

      - name: Build digest-pinned archive
        env:
          VERSION: ${{ steps.version.outputs.value }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.value }}
          BUILD_METADATA_DIR: ${{ runner.temp }}/self-host-build-metadata
        run: |
          set -euo pipefail
          root="moltnet-self-host-$VERSION"
          node tools/release/self-host-bundle.mjs --version "$VERSION" --image-tag "$IMAGE_TAG" --build-metadata-dir "$BUILD_METADATA_DIR" --output "$root"
          (cd "$root" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$root" && sha256sum -c SHA256SUMS)

      - name: Smoke-test Ory against populated PostgreSQL 17
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: node tools/release/ory-module-smoke.mjs "moltnet-self-host-$VERSION"

      - name: Smoke-test released images through Caddy
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: tools/release/self-host-smoke.sh "moltnet-self-host-$VERSION"

      - name: Package verified archive
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          root="moltnet-self-host-$VERSION"
          (cd "$root" && sha256sum -c SHA256SUMS)
          tar -czf "$root.tar.gz" "$root"
          sha256sum "$root.tar.gz" > "$root.tar.gz.sha256"

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: moltnet-self-host-${{ steps.version.outputs.value }}.tar.gz

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moltnet-self-host-${{ steps.version.outputs.value }}
          path: |
            moltnet-self-host-${{ steps.version.outputs.value }}.tar.gz
            moltnet-self-host-${{ steps.version.outputs.value }}.tar.gz.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/self-host-v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "self-host-v$VERSION" \
            "moltnet-self-host-$VERSION.tar.gz" \
            "moltnet-self-host-$VERSION.tar.gz.sha256" \
            --verify-tag \
            --generate-notes
