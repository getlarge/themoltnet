name: Adaptive review outcomes (reusable)

# Runs when a pull request closes. Reads the adaptive reviewer's review
# threads and writes one signed diary entry with each finding's outcome:
# fixed (a later commit changed the anchored line), dismissed (resolved with
# the line unchanged), or ignored (still open). It reads no PR code.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        default: ''
      diary-id:
        type: string
        default: ''
      agent-name:
        type: string
        default: ''
      api-url:
        type: string
        default: ''
      app-id:
        type: string
        default: ''
      runtime-ref:
        type: string
        default: ''
    secrets:
      MOLTNET_AGENT_KEY:
        required: false
      MOLTNET_PRIVATE_KEY:
        required: false
      MOLTNET_GITHUB_APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  record:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - name: Resolve trusted review runtime
        id: runtime
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          RUNTIME_REF: ${{ inputs.runtime-ref }}
        run: |
          set -euo pipefail
          if [ -z "$WORKFLOW_REPOSITORY" ]; then
            echo '::error::job.workflow_repository is required' >&2
            exit 1
          fi
          runtime_ref="${RUNTIME_REF:-$WORKFLOW_SHA}"
          if ! [[ "$runtime_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::runtime-ref or job.workflow_sha must be a full commit SHA' >&2
            exit 1
          fi
          echo "repository=$WORKFLOW_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "ref=$runtime_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.runtime.outputs.repository }}
          ref: ${{ steps.runtime.outputs.ref }}
          path: .adaptive-review-runtime
          persist-credentials: false
      - uses: ./.adaptive-review-runtime/packages/adaptive-review-action/setup
      # The App token reads the threads and names the reviewer whose threads
      # count; it needs read access only.
      - name: Mint LeGreffier read token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-id || vars.MOLTNET_GITHUB_APP_ID }}
          private-key: ${{ secrets.MOLTNET_GITHUB_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: read
      - name: Record finding outcomes
        uses: ./.adaptive-review-runtime/packages/adaptive-review-action
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ADAPTIVE_APP_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          MOLTNET_AGENT_KEY: ${{ secrets.MOLTNET_AGENT_KEY }}
          MOLTNET_PRIVATE_KEY: ${{ secrets.MOLTNET_PRIVATE_KEY }}
          MOLTNET_AGENT_NAME: ${{ inputs.agent-name || vars.MOLTNET_AGENT_NAME }}
          MOLTNET_API_URL: ${{ inputs.api-url || vars.MOLTNET_API_URL }}
          MOLTNET_DIARY_ID: ${{ inputs.diary-id || vars.MOLTNET_DIARY_ID }}
        with:
          step: outcomes
