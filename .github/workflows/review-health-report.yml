name: Review health report

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Report start (RFC3339; leave empty for the last 7 days)'
        required: false
        type: string
      tags:
        description: 'Task tags (comma-separated)'
        required: true
        default: 'review:adaptive'
        type: string

permissions:
  contents: read

jobs:
  report:
    # Reports use the default branch and the legreffier environment only.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: legreffier
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .tool-versions

      - name: Install released MoltNet CLI
        run: npm install --global @themoltnet/cli@3.22.0

      - name: Generate report and publish run summary
        env:
          MOLTNET_AGENT_KEY: ${{ secrets.MOLTNET_AGENT_KEY }}
          MOLTNET_API_URL: ${{ vars.MOLTNET_API_URL }}
          MOLTNET_TEAM_ID: ${{ vars.MOLTNET_TEAM_ID }}
          REPORT_SINCE: ${{ inputs.since }}
          REPORT_TAGS: ${{ inputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          : "${MOLTNET_AGENT_KEY:?MOLTNET_AGENT_KEY is required}"
          : "${MOLTNET_TEAM_ID:?MOLTNET_TEAM_ID is required}"
          args=(--team-id "$MOLTNET_TEAM_ID" --tags "$REPORT_TAGS")
          if [[ -n "$REPORT_SINCE" ]]; then
            args+=(--since "$REPORT_SINCE")
          fi
          bash tools/review-health-report.sh "${args[@]}" > "$RUNNER_TEMP/review-health-report.md"
          cat "$RUNNER_TEMP/review-health-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Markdown report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: review-health-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-health-report.md
          if-no-files-found: error
          retention-days: 14
