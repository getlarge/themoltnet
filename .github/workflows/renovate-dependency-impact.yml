name: Renovate Dependency Impact

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['pnpm-lock.yaml']

permissions:
  contents: read

concurrency:
  group: renovate-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  report:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login == vars.RENOVATE_APP_BOT_LOGIN &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      MOLTNET_SKIP_NX_SYNC: '1'
      HUSKY: '0'
      NX_LOAD_DOT_ENV_FILES: 'false'
    steps:
      # Privileged comment writer: execute only base-revision code/dependencies.
      # The PR revision is fetched, never checked out, installed or executed.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          go: 'false'
      - name: Compare lockfiles as data
        id: compare
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          # Match the PR's branch diff, excluding unrelated newer base changes.
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "merge_base=$merge_base" >> "$GITHUB_OUTPUT"
          git show "$merge_base:pnpm-lock.yaml" > "$RUNNER_TEMP/base-lock.yaml"
          git show "$HEAD_SHA:pnpm-lock.yaml" > "$RUNNER_TEMP/head-lock.yaml"
          node tools/renovate/dependency-impact.mjs \
            "$RUNNER_TEMP/base-lock.yaml" "$RUNNER_TEMP/head-lock.yaml" \
            "$RUNNER_TEMP/dependency-impact.md" "$RUNNER_TEMP/dependency-impact-comment.md"
          cat "$RUNNER_TEMP/dependency-impact-comment.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: report
        with:
          name: dependency-impact
          path: ${{ runner.temp }}/dependency-impact.md
          retention-days: 14
      - name: Update dependency impact comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
          MERGE_BASE_SHA: ${{ steps.compare.outputs.merge_base }}
        with:
          script: |
            const fs = require('node:fs');
            const pr = context.payload.pull_request;
            const current = await github.rest.pulls.get({
              ...context.repo, pull_number: pr.number,
            });
            if (current.data.head.sha !== process.env.HEAD_SHA) {
              core.notice('A newer head exists; skipping stale report comment.');
              return;
            }
            const marker = '<!-- renovate-dependency-impact -->';
            const report = fs.readFileSync(
              `${process.env.RUNNER_TEMP}/dependency-impact-comment.md`, 'utf8',
            );
            const body = `${marker}\nMerge base: \`${process.env.MERGE_BASE_SHA}\` → head: \`${process.env.HEAD_SHA}\`\n\n${report}\n[Full report](${process.env.REPORT_URL})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pr.number, per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.startsWith(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: previous.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: pr.number, body,
              });
            }
