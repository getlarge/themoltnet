name: Desktop packages
on:
  push:
    branches: [main]
    paths:
      - apps/agent-desktop/**
      - libs/design-system/**
      - libs/task-ui/**
      - tools/release/agent-desktop/**
      - .github/actions/setup-workspace/**
      - .github/workflows/agent-desktop-packages.yml
      - .github/workflows/release.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - apps/agent-desktop/**
      - libs/design-system/**
      - libs/task-ui/**
      - tools/release/agent-desktop/**
      - .github/actions/setup-workspace/**
      - .github/workflows/agent-desktop-packages.yml
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    name: Package ${{ matrix.platform }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac-os
            runner: macos-14
          - platform: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      NX_LOAD_DOT_ENV_FILES: 'false'
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          rust: 'true'
          rust-cache: 'true'
          rust-cache-key: package
      - name: Install packaging and display dependencies
        if: matrix.platform == 'linux'
        run: bash tools/release/agent-desktop/install-linux-build-dependencies.sh
      - name: Build unsigned CI packages
        run: pnpm exec nx run @moltnet/agent-desktop:tauri:bundle --configuration=${{ matrix.platform }} --excludeTaskDependencies
      - name: Verify package installation and launch
        run: bash tools/release/agent-desktop/${{ matrix.platform }}-smoke.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: desktop-packages-${{ matrix.platform }}
          path: |
            apps/agent-desktop/out-rust/bundle/*/release/bundle/deb/*.deb
            apps/agent-desktop/out-rust/bundle/*/release/bundle/appimage/*.AppImage
            apps/agent-desktop/out-rust/bundle/*/release/bundle/dmg/*.dmg
            /tmp/moltnet-desktop-smoke-*.log
          retention-days: 1
