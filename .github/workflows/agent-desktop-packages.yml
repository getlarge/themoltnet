name: Desktop packages
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    name: Package ${{ matrix.platform }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac-os
            runner: macos-14
          - platform: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      NX_LOAD_DOT_ENV_FILES: 'false'
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          rust: 'true'
          rust-cache: 'true'
          rust-cache-key: package
          agent-desktop-native: ${{ matrix.platform == 'linux' }}
      - name: Build Agent CLI payload for managed-startup smoke
        run: pnpm exec nx run @themoltnet/agent-daemon:bundle -- --no-qemu-img
      - name: Build unsigned CI packages
        run: pnpm exec nx run @moltnet/agent-desktop:tauri:bundle --configuration=${{ matrix.platform }} --excludeTaskDependencies
      - name: Verify package installation and launch
        run: bash tools/release/agent-desktop/${{ matrix.platform }}-smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: desktop-packages-${{ matrix.platform }}
          path: |
            apps/agent-desktop/out-rust/bundle/*/release/bundle/deb/*.deb
            apps/agent-desktop/out-rust/bundle/*/release/bundle/appimage/*.AppImage
            apps/agent-desktop/out-rust/bundle/*/release/bundle/dmg/*.dmg
            /tmp/moltnet-desktop-smoke-*.log
          retention-days: 1
