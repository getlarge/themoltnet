name: LeGreffier Security Review

on:
  issue_comment:
    types: [created]

permissions: {}
concurrency:
  group: security-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  security-review:
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@legreffier /security-review') &&
      !endsWith(github.event.comment.user.login, '[bot]') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: legreffier
    permissions:
      contents: read
      pull-requests: read
    env:
      MOLTNET_CLI_VERSION: '3.3.0'
      MOLTNET_AGENT_NAME: ${{ vars.MOLTNET_AGENT_NAME }}
      MOLTNET_SUBJECT_ID: ${{ secrets.MOLTNET_SUBJECT_ID }}
      MOLTNET_SUBJECT_TYPE: agent
      MOLTNET_CLIENT_ID: ${{ secrets.MOLTNET_CLIENT_ID }}
      MOLTNET_CLIENT_SECRET: ${{ secrets.MOLTNET_CLIENT_SECRET }}
      MOLTNET_AGENT_KEY: ${{ secrets.MOLTNET_AGENT_KEY }}
      MOLTNET_PUBLIC_KEY: ${{ secrets.MOLTNET_PUBLIC_KEY }}
      MOLTNET_PRIVATE_KEY: ${{ secrets.MOLTNET_PRIVATE_KEY }}
      MOLTNET_FINGERPRINT: ${{ secrets.MOLTNET_FINGERPRINT }}
      MOLTNET_TEAM_ID: ${{ vars.MOLTNET_TEAM_ID }}
      MOLTNET_DIARY_ID: ${{ vars.MOLTNET_DIARY_ID }}
      MOLTNET_API_URL: ${{ vars.MOLTNET_API_URL }}
      PI_AUTH_JSON: ${{ secrets.PI_AUTH_JSON }}
      REVIEW_META: ${{ github.workspace }}/security-review-meta.json
      CANDIDATE_OUTPUT: ${{ github.workspace }}/security-candidates.json
      REVIEW_OUTPUT: ${{ github.workspace }}/security-result.json
      TASK_SPEC: ${{ github.workspace }}/security-task.json
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          go: 'false'
      - name: Pin PR revisions
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx libs/security-review/src/main.ts prepare >> "$GITHUB_OUTPUT"
      - name: Report routine dependency update
        if: steps.prepare.outputs.skip == 'true'
        run: echo 'Renovate dependency-only PR; dependency update and advisory checks own this change.' >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch revisions as inert Git data
        if: steps.prepare.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.prepare.outputs.base }}
          HEAD: ${{ steps.prepare.outputs.head }}
        run: git fetch --no-tags origin "$BASE" "$HEAD"
      - name: Compose hunt stage
        if: steps.prepare.outputs.skip != 'true'
        run: node --import tsx libs/security-review/src/main.ts compose-hunt
      - name: Hunt for candidate risks
        id: hunt
        if: steps.prepare.outputs.skip != 'true'
        uses: ./packages/agent-daemon-action
        with:
          task-spec-path: ${{ github.workspace }}/security-task.json
          profile: legreffier-security-review-v2
          max-attempts: '2'
      - name: Load accepted candidates
        if: steps.prepare.outputs.skip != 'true'
        run: |
          npx -y @themoltnet/cli@${MOLTNET_CLI_VERSION} task attempts "${{ steps.hunt.outputs.task-id }}" \
            --team-id "$MOLTNET_TEAM_ID" --accepted-only --field output > "$CANDIDATE_OUTPUT"
      - name: Compose verification stage
        if: steps.prepare.outputs.skip != 'true'
        run: node --import tsx libs/security-review/src/main.ts compose-verify
      - name: Verify candidates against the diff
        id: verify
        if: steps.prepare.outputs.skip != 'true'
        uses: ./packages/agent-daemon-action
        with:
          task-spec-path: ${{ github.workspace }}/security-task.json
          profile: legreffier-security-review-v2
          max-attempts: '2'
      - name: Load accepted verification
        if: steps.prepare.outputs.skip != 'true'
        run: |
          npx -y @themoltnet/cli@${MOLTNET_CLI_VERSION} task attempts "${{ steps.verify.outputs.task-id }}" \
            --team-id "$MOLTNET_TEAM_ID" --accepted-only --field output > "$REVIEW_OUTPUT"
      - name: Mint publisher token
        id: app-token
        if: steps.prepare.outputs.skip != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MOLTNET_GITHUB_APP_ID }}
          private-key: ${{ secrets.MOLTNET_GITHUB_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      - name: Publish checked advisory
        if: steps.prepare.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          REVIEW_TASK_ID: ${{ steps.verify.outputs.task-id }}
        run: node --import tsx libs/security-review/src/main.ts publish
