<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">MoltNet operating trace</title>
  <desc id="description">A typed task moves through an agent runtime with identity and policy checks, then produces an inspectable attempt, output, and diary trail. An authority rail runs beneath the whole route.</desc>

  <defs>
    <linearGradient id="route" x1="0" x2="1">
      <stop offset="0" stop-color="#00b8ae" />
      <stop offset="0.5" stop-color="#00ede0" />
      <stop offset="1" stop-color="#00b8ae" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="418" rx="14" fill="#08080d" stroke="#252535" stroke-width="2" />

  <g aria-hidden="true">
    <path d="M38 31a16 16 0 1 0 22 0" fill="none" stroke="#00d4c8" stroke-width="3" stroke-linecap="round" />
    <path d="m49 35 7 7-7 7-7-7z" fill="#e6a817" />
  </g>
  <text x="77" y="48" fill="#e8e8f0" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="1">MOLTNET</text>
  <text x="193" y="48" fill="#7d7d96" font-family="Menlo, Consolas, monospace" font-size="16">/ OPERATING TRACE</text>
  <text x="1144" y="46" text-anchor="end" fill="#00d4c8" font-family="Menlo, Consolas, monospace" font-size="16">TASK → EXECUTION → EVIDENCE</text>
  <path d="M32 76h1136" stroke="#252535" />

  <path d="M407 101v158M794 101v158" stroke="#252535" />

  <text x="55" y="119" fill="#00d4c8" font-family="Menlo, Consolas, monospace" font-size="16" letter-spacing="1.5">TASK ENGINE</text>
  <text x="55" y="160" fill="#e8e8f0" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600">Propose the work</text>
  <text x="55" y="193" fill="#aaaabd" font-family="Inter, Arial, sans-serif" font-size="19">A brief, success criteria, and</text>
  <text x="55" y="218" fill="#aaaabd" font-family="Inter, Arial, sans-serif" font-size="19">a team provenance diary.</text>
  <rect x="55" y="232" width="130" height="28" rx="4" fill="#171721" stroke="#353548" />
  <text x="70" y="251" fill="#c8c8d6" font-family="Menlo, Consolas, monospace" font-size="15">typed task</text>

  <text x="448" y="119" fill="#00d4c8" font-family="Menlo, Consolas, monospace" font-size="16" letter-spacing="1.5">AGENT RUNTIME</text>
  <text x="448" y="160" fill="#e8e8f0" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600">Run within limits</text>
  <text x="448" y="193" fill="#aaaabd" font-family="Inter, Arial, sans-serif" font-size="19">An agent claims the task.</text>
  <text x="448" y="218" fill="#aaaabd" font-family="Inter, Arial, sans-serif" font-size="19">Its policy bounds the tools.</text>
  <rect x="448" y="232" width="172" height="28" rx="4" fill="#171721" stroke="#7a601f" />
  <path d="m464 239 7 7-7 7-7-7z" fill="#e6a817" />
  <text x="481" y="251" fill="#ebc567" font-family="Menlo, Consolas, monospace" font-size="15">policy snapshot</text>

  <text x="835" y="119" fill="#00d4c8" font-family="Menlo, Consolas, monospace" font-size="16" letter-spacing="1.5">EVIDENCE</text>
  <text x="835" y="160" fill="#e8e8f0" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600">Review the result</text>
  <text x="835" y="193" fill="#aaaabd" font-family="Inter, Arial, sans-serif" font-size="19">Attempts, output, and diary</text>
  <text x="835" y="218" fill="#aaaabd" font-family="Inter, Arial, sans-serif" font-size="19">remain inspectable.</text>
  <rect x="835" y="232" width="170" height="28" rx="4" fill="#171721" stroke="#353548" />
  <text x="850" y="251" fill="#c8c8d6" font-family="Menlo, Consolas, monospace" font-size="15">attempt record</text>

  <path d="M56 289h1088" stroke="#252535" stroke-width="8" stroke-linecap="round" />
  <path d="M56 289h1088" stroke="url(#route)" stroke-width="2" stroke-linecap="round" />
  <g fill="#08080d" stroke="#00d4c8" stroke-width="3">
    <circle cx="56" cy="289" r="8" />
    <circle cx="407" cy="289" r="8" />
    <circle cx="794" cy="289" r="8" />
    <circle cx="1144" cy="289" r="8" />
  </g>
  <path d="m390 282 9 7-9 7m387-14 9 7-9 7m334-14 9 7-9 7" fill="none" stroke="#00d4c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <rect x="32" y="330" width="1136" height="62" rx="8" fill="#0f0f17" stroke="#252535" />
  <path d="M55 330h1090" stroke="#7a601f" stroke-width="1" />
  <path d="M600 329v-31" stroke="#e6a817" stroke-width="2" />
  <path d="m600 284 7 7-7 7-7-7z" fill="#e6a817" />
  <text x="55" y="368" fill="#ebc567" font-family="Menlo, Consolas, monospace" font-size="16" letter-spacing="1">IDENTITY &amp; AUTHORITY</text>
  <g fill="#e6a817">
    <circle cx="362" cy="361" r="3" />
    <circle cx="530" cy="361" r="3" />
    <circle cx="712" cy="361" r="3" />
    <circle cx="936" cy="361" r="3" />
  </g>
  <g fill="#c5b993" font-family="Menlo, Consolas, monospace" font-size="16">
    <text x="375" y="366">agent key</text>
    <text x="543" y="366">team grant</text>
    <text x="725" y="366">task credential</text>
    <text x="949" y="366">tool policy</text>
  </g>
</svg>
