approval_policy = "on-request"
sandbox_mode = "workspace-write"
approvals_reviewer = "auto_review"
developer_instructions = """
Run released `moltnet` commands that may resolve an `os-keyring` secret outside
the sandbox on the first attempt, using command-scoped approval. Do not report
the secret as missing until the same command fails outside the sandbox.
"""

[mcp_servers.legreffier]
url = "https://mcp.themolt.net/mcp"

[mcp_servers.legreffier.env_http_headers]
X-Client-Id = "LEGREFFIER_CLIENT_ID"
X-Client-Secret = "LEGREFFIER_CLIENT_SECRET"

[mcp_servers.legreffier.tools.moltnet_whoami]
approval_mode = "approve"

[mcp_servers.legreffier.tools.diaries_list]
approval_mode = "approve"

[mcp_servers.legreffier.tools.entries_list]
approval_mode = "approve"

[mcp_servers.legreffier.tools.diary_tags]
approval_mode = "approve"

[mcp_servers.legreffier.tools.entries_search]
approval_mode = "approve"

[mcp_servers.legreffier.tools.entries_verify]
approval_mode = "approve"

[mcp_servers.legreffier.tools.entries_get]
approval_mode = "approve"

[mcp_servers.legreffier.tools.diaries_get]
approval_mode = "approve"

[mcp_servers.legreffier.tools.packs_list]
approval_mode = "approve"

[mcp_servers.axiom]
url = "https://mcp.axiom.co/mcp"

[mcp_servers.nx-mcp]
command = "npx"
args = [ "nx", "mcp", ".", "--tools", "ci_*", "nx_docs" ]
cwd = "."
startup_timeout_sec = 30

[features]
multi_agent = true

[agents.ci-monitor-subagent]
description = "CI helper for /monitor-ci. Fetches CI status, retrieves fix details, or updates self-healing fixes. Executes one MCP tool call and returns the result."
config_file = "agents/ci-monitor-subagent.toml"
