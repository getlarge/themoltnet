# OpenTelemetry Collector configuration for local development.
#
# Two OTLP receivers:
#
#   - otlp (4317 gRPC / 4318 HTTP) — UNAUTHENTICATED, for internal service-
#     mesh traffic (rest-api, mcp-server, etc.). Reachable only within the
#     docker network; host-side port bindings are a dev convenience.
#
#   - otlp/public (4319 HTTP) — authenticated via `moltnetauth`. OAuth tokens
#     go to Hydra; `ory_ak_` keys go to Talos and their actor is checked in
#     Kratos. All public signals pass through trusted attribution.
#
# Exports to debug (stdout) so telemetry is visible without cloud creds.

extensions:
  health_check:
    endpoint: '0.0.0.0:13133'

  moltnetauth:
    hydra_admin_url: 'http://hydra:4445'
    talos_admin_url: 'http://talos:4420'
    kratos_admin_url: 'http://kratos:4434'
    required_scopes: ['task:execute']
    cache_ttl: 60s
    cache_max_entries: 10000
    request_timeout: 5s
    global_rate: 100
    global_burst: 200
    agent_rate: 2
    agent_burst: 20
    limiter_max_entries: 10000
    limiter_idle_ttl: 10m

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: '0.0.0.0:4317'
      http:
        endpoint: '0.0.0.0:4318'

  otlp/public:
    protocols:
      http:
        endpoint: '0.0.0.0:4319'
        max_request_body_size: 4194304
        auth:
          authenticator: moltnetauth

processors:
  batch:
    timeout: 2s
    send_batch_size: 256

  memory_limiter/public:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15

  batch/public_traces:
    timeout: 2s
    send_batch_size: 256
  batch/public_logs:
    timeout: 2s
    send_batch_size: 256
  batch/public_metrics:
    timeout: 2s
    send_batch_size: 256

  moltnetattribution:

  resource:
    attributes:
      - key: service.namespace
        value: moltnet
        action: upsert
      - key: deployment.environment
        value: development
        action: upsert

  # Redact sensitive values from telemetry (mirrors production config).
  transform/redact:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["http.request.header.authorization"], ".*", "[REDACTED]")
          - replace_pattern(attributes["http.request.header.cookie"], ".*", "[REDACTED]")
          - replace_pattern(attributes["http.request.header.x-api-key"], ".*", "[REDACTED]")
          - replace_pattern(attributes["http.request.header.x-ory-api-key"], ".*", "[REDACTED]")
          - replace_pattern(attributes["http.response.header.set-cookie"], ".*", "[REDACTED]")
          - replace_pattern(attributes["password"], ".*", "[REDACTED]")
          - replace_pattern(attributes["token"], ".*", "[REDACTED]")
          - replace_pattern(attributes["secret"], ".*", "[REDACTED]")
          - replace_pattern(attributes["api_key"], ".*", "[REDACTED]")
          - replace_pattern(attributes["private_key"], ".*", "[REDACTED]")
          - replace_pattern(attributes["ory.recovery_codes"], ".*", "[REDACTED]")
          - replace_pattern(attributes["ory.credentials"], ".*", "[REDACTED]")
    log_statements:
      - context: log
        statements:
          - replace_pattern(attributes["http.request.header.authorization"], ".*", "[REDACTED]")
          - replace_pattern(attributes["http.request.header.cookie"], ".*", "[REDACTED]")
          - replace_pattern(attributes["http.request.header.x-api-key"], ".*", "[REDACTED]")
          - replace_pattern(attributes["http.request.header.x-ory-api-key"], ".*", "[REDACTED]")
          - replace_pattern(attributes["password"], ".*", "[REDACTED]")
          - replace_pattern(attributes["token"], ".*", "[REDACTED]")
          - replace_pattern(attributes["secret"], ".*", "[REDACTED]")
          - replace_pattern(attributes["api_key"], ".*", "[REDACTED]")
          - replace_pattern(attributes["private_key"], ".*", "[REDACTED]")

exporters:
  debug:
    verbosity: detailed

  debug/public_traces:
    verbosity: detailed
  debug/public_logs:
    verbosity: detailed
  debug/public_metrics:
    verbosity: detailed

service:
  extensions: [health_check, moltnetauth]

  pipelines:
    # Internal pipeline — unauthenticated receiver, full processing chain.
    traces:
      receivers: [otlp]
      processors: [transform/redact, resource, batch]
      exporters: [debug]

    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug]

    logs:
      receivers: [otlp]
      processors: [transform/redact, resource, batch]
      exporters: [debug]

    # Public pipeline — authenticated receiver. Shares processors with
    # internal (redaction, namespace tagging) but reads from the gated
    # receiver only. Keeping this as a separate pipeline makes the
    # authenticated surface explicit in the config and allows divergent
    # processing later (rate limiting, attribution enforcement) without
    # entangling internal traffic.
    traces/public:
      receivers: [otlp/public]
      processors:
        [
          memory_limiter/public,
          moltnetattribution,
          transform/redact,
          resource,
          batch/public_traces,
        ]
      exporters: [debug/public_traces]

    logs/public:
      receivers: [otlp/public]
      processors:
        [
          memory_limiter/public,
          moltnetattribution,
          transform/redact,
          resource,
          batch/public_logs,
        ]
      exporters: [debug/public_logs]

    metrics/public:
      receivers: [otlp/public]
      processors:
        [
          memory_limiter/public,
          moltnetattribution,
          resource,
          batch/public_metrics,
        ]
      exporters: [debug/public_metrics]

  telemetry:
    logs:
      level: debug
