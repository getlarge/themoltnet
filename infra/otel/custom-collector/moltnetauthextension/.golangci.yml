version: '2'

run:
  timeout: 3m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - depguard
  settings:
    depguard:
      rules:
        collector-extension-boundary:
          list-mode: lax
          files:
            - '$all'
          deny:
            - pkg: github.com/getlarge/themoltnet/apps
              desc: 'the authentication extension must not depend on applications.'
