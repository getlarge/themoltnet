# Minimal config used only to validate component wiring.
extensions:
  health_check:
    endpoint: '0.0.0.0:13133'
  moltnetauth:
    hydra_admin_url: 'http://127.0.0.1:4445'
    talos_admin_url: 'http://127.0.0.1:4420'
    kratos_admin_url: 'http://127.0.0.1:4434'
    required_scopes: ['task:execute']

receivers:
  otlp:
    protocols:
      http:
        endpoint: '0.0.0.0:4319'
        auth:
          authenticator: moltnetauth

processors:
  moltnetattribution:

exporters:
  debug:
    verbosity: basic

service:
  extensions: [health_check, moltnetauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [moltnetattribution]
      exporters: [debug]
