# MoltNet Docker Compose — Base Service Templates
#
# Pure service definitions. No volumes, no depends_on, no profiles.
# Extended by docker-compose.yaml (dev) and docker-compose.e2e.yaml (e2e).

services:
  app-db:
    image: pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moltnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moltnet_secret}
      POSTGRES_DB: ${POSTGRES_DB:-moltnet}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-moltnet}']
      interval: 5s
      timeout: 3s
      retries: 5

  app-db-migrate:
    build:
      context: .
      dockerfile: libs/database/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-moltnet}:${POSTGRES_PASSWORD:-moltnet_secret}@app-db:5432/${POSTGRES_DB:-moltnet}

  absurd-db:
    image: postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
    ports:
      - '${ABSURD_POSTGRES_BIND:-55434:5432}'
    environment:
      POSTGRES_USER: ${ABSURD_POSTGRES_USER:-absurd}
      POSTGRES_PASSWORD: ${ABSURD_POSTGRES_PASSWORD:-absurd_secret}
      POSTGRES_DB: ${ABSURD_POSTGRES_DB:-absurd}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${ABSURD_POSTGRES_USER:-absurd} -d ${ABSURD_POSTGRES_DB:-absurd}',
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  absurd-db-migrate:
    build:
      context: .
      dockerfile: infra/absurd/Dockerfile
    environment:
      ABSURD_DATABASE_URL: postgresql://${ABSURD_POSTGRES_USER:-absurd}:${ABSURD_POSTGRES_PASSWORD:-absurd_secret}@absurd-db:5432/${ABSURD_POSTGRES_DB:-absurd}
    command:
      - sh
      - -ec
      - |
        if psql "$${ABSURD_DATABASE_URL}" -tAc "select to_regprocedure('absurd.create_queue(text)')" | grep -q create_queue; then
          echo "Absurd schema already initialized"
        else
          uvx absurdctl init --ref 0.4.0
        fi

  kratos-postgres:
    image: postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
    environment:
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: kratos_secret
      POSTGRES_DB: kratosdb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kratos']
      interval: 5s
      timeout: 3s
      retries: 5

  kratos-migrate:
    image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    command: migrate sql -e --yes
    environment:
      DSN: postgres://kratos:kratos_secret@kratos-postgres:5432/kratosdb?sslmode=disable

  kratos:
    image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    command: serve --config /etc/config/kratos/kratos.yaml --dev --watch-courier
    ports:
      - '4433:4433'
      - '4434:4434'
    environment:
      DSN: postgres://kratos:kratos_secret@kratos-postgres:5432/kratosdb?sslmode=disable
    volumes:
      - ./infra/ory/kratos/kratos.yaml:/etc/config/kratos/kratos.yaml:ro
      - ./infra/ory/identity-schema.json:/etc/config/kratos/identity-schema.json:ro
      - ./infra/ory/human-identity-schema.json:/etc/config/kratos/human-identity-schema.json:ro
    healthcheck:
      test:
        ['CMD', 'wget', '--spider', '-q', 'http://localhost:4433/health/alive']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  hydra-postgres:
    image: postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: hydra_secret
      POSTGRES_DB: hydradb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hydra']
      interval: 5s
      timeout: 3s
      retries: 5

  hydra-migrate:
    image: oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    command: migrate sql up -e --yes
    environment:
      DSN: postgres://hydra:hydra_secret@hydra-postgres:5432/hydradb?sslmode=disable

  hydra:
    image: oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    command: serve all --config /etc/config/hydra/hydra.yaml --dev
    ports:
      - '4444:4444'
      - '4445:4445'
    environment:
      DSN: postgres://hydra:hydra_secret@hydra-postgres:5432/hydradb?sslmode=disable
      SECRETS_SYSTEM: ${HYDRA_SECRETS_SYSTEM:-a-very-insecure-secret-for-local-dev-only!!}
      OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT: ${OIDC_PAIRWISE_SALT:-local-dev-salt-not-for-production}
    volumes:
      - ./infra/ory/hydra/hydra.yaml:/etc/config/hydra/hydra.yaml:ro
    healthcheck:
      test:
        ['CMD', 'wget', '--spider', '-q', 'http://localhost:4444/health/alive']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keto-postgres:
    image: postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
    environment:
      POSTGRES_USER: keto
      POSTGRES_PASSWORD: keto_secret
      POSTGRES_DB: ketodb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keto']
      interval: 5s
      timeout: 3s
      retries: 5

  keto-migrate:
    image: oryd/keto:v26.2.0@sha256:bfdb8b9e283aedbd9e1d005c44eb1bbefd2096b2cb5b5aa0b7360b6e39c178d2
    command: migrate up --yes --config /etc/config/keto/keto.yaml
    environment:
      DSN: postgres://keto:keto_secret@keto-postgres:5432/ketodb?sslmode=disable
    volumes:
      - ./infra/ory/keto/keto.yaml:/etc/config/keto/keto.yaml:ro
      - ./infra/ory/permissions.ts:/etc/config/keto/permissions.ts:ro

  keto:
    image: oryd/keto:v26.2.0@sha256:bfdb8b9e283aedbd9e1d005c44eb1bbefd2096b2cb5b5aa0b7360b6e39c178d2
    command: serve --config /etc/config/keto/keto.yaml
    ports:
      - '4466:4466'
      - '4467:4467'
    environment:
      DSN: postgres://keto:keto_secret@keto-postgres:5432/ketodb?sslmode=disable
    volumes:
      - ./infra/ory/keto/keto.yaml:/etc/config/keto/keto.yaml:ro
      - ./infra/ory/permissions.ts:/etc/config/keto/permissions.ts:ro
    healthcheck:
      test:
        ['CMD', 'wget', '--spider', '-q', 'http://localhost:4466/health/alive']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  talos:
    image: oryd/talos:v26.2.0@sha256:6d475ee745395846c8c89b50987e76bce76a902d786967bedf6af6fbf88535d1
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        umask 077
        if [ ! -s /var/lib/talos/jwks.json ]; then
          talos jwk generate eddsa --jwks --kid moltnet-local-dev -o /var/lib/talos/jwks.json
        fi
        if [ ! -s /var/lib/talos/hmac-secret ]; then
          head -c 32 /dev/urandom | base64 > /var/lib/talos/hmac-secret
        fi
        export SECRETS_HMAC_CURRENT="$$(cat /var/lib/talos/hmac-secret)"
        export CREDENTIALS_DERIVED_TOKENS_JWT_SIGNING_KEYS_URLS_0="base64://$$(base64 -w 0 /var/lib/talos/jwks.json)"
        talos migrate up --database "$${DB_DSN}"
        exec talos serve --config /etc/config/talos/talos.yaml
    ports:
      - '4420:4420'
      - '4422:4422'
    environment:
      DB_DSN: sqlite3:///var/lib/talos/talos.db?_journal_mode=WAL
      CREDENTIALS_ISSUER: http://localhost:4420
    volumes:
      - ./infra/ory/talos/talos.yaml:/etc/config/talos/talos.yaml:ro
    healthcheck:
      test:
        ['CMD', 'wget', '--spider', '-q', 'http://localhost:4422/health/alive']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  otel-collector:
    # Built by Nx; Compose only runs the packaging-only image.
    image: ${OTEL_COLLECTOR_IMAGE:-ghcr.io/getlarge/themoltnet/otel-collector:dev}
    command: ['--config=/etc/otelcol/config.yaml']
    ports:
      # Host daemons use authenticated OTLP. Internal receivers remain reachable
      # only as otel-collector:4317/4318 on the Compose network.
      - '127.0.0.1:4319:4319'
      - '127.0.0.1:13133:13133'
    volumes:
      - ./infra/otel/collector-config.dev.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      hydra:
        condition: service_healthy
      kratos:
        condition: service_healthy
      talos:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports:
      - '1025:1025'
      - '8025:8025'

  redis:
    image: valkey/valkey:8-alpine@sha256:9971099af41c36e887aabdfe22b80c0fe45df949163dfc9cb434febc57cfc3fc
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  runtime-object-store:
    image: chrislusf/seaweedfs:4.36@sha256:800b2115c63236e8bd0e5d572dc25dd493dc2feed08b54a2a269dc0101c9d94a
    command:
      [
        'server',
        '-s3',
        '-s3.port=8333',
        '-dir=/data',
        '-master.volumeSizeLimitMB=64',
        '-volume.max=16',
      ]
    environment:
      AWS_ACCESS_KEY_ID: runtime-sessions
      AWS_SECRET_ACCESS_KEY: runtime-sessions-secret
