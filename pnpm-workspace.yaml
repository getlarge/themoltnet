packages:
  - 'apps/*'
  - 'libs/*'
  - 'tools'
  - 'packages/*'
  - 'packages/cli/npm/*'
  - 'docs'
enablePrePostScripts: true
injectWorkspacePackages: false
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@getlarge/fastify-mcp'
  # Release jobs consume repository-owned packages published earlier in the
  # same run, before the external-package quarantine has elapsed.
  - '@themoltnet/*'
  # Renovate security update: vite@8.0.16
  - vite@8.0.16
  # Renovate security update: smol-toml@1.9.0
  - smol-toml@1.9.0
  # Renovate security update: fastify@5.12.6
  - fastify@5.12.6
  # Renovate security update: undici@7.30.1
  - undici@7.30.1
  # Renovate security update: minimatch@11.0.4
  - minimatch@11.0.4
allowBuilds:
  '@github/keytar': true
  '@google/genai': false
  '@swc/core': true
  better-sqlite3: true
  cpu-features: false
  edgedriver: false
  esbuild: true
  eslint-plugin-n8n-nodes-base: false
  geckodriver: false
  isolated-vm: true
  node-hid: true
  nx: true
  # Its install script only downloads the optional Linux x64 CUDA provider
  # from the onnxruntime GitHub release; the CPU binaries ship in the npm
  # package. Nothing here uses CUDA, and the download fails when that
  # release asset is unavailable.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  ssh2: false
  tree-sitter-bash: true
  unrs-resolver: true
overrides:
  # Nx generators require the minimatch.makeRe API removed in v11.
  'minimatch': '>=10.2.6 <11'
  '@fastify/otel>minimatch': '>=11.0.1 <12'
  '@earendil-works/pi-coding-agent>minimatch': '>=11.0.1 <12'
  'brace-expansion@1': '>=1.1.13'
  'brace-expansion@2': '>=2.0.3'
  'brace-expansion': '>=5.0.12 <6'
  'picomatch': '>=4.0.4'
  'lodash': '>=4.18.1'
  'path-to-regexp': '>=8.4.2'
  'yaml': '>=2.8.3 <3'
  'ajv@8': '>=8.18.0'
  'fast-jwt': '>=6.3.0 <7'
  'sharp': '>=0.35.4 <0.36'
  '@opentelemetry/core': '>=2.8.0 <3'
  'uuid': '>=11.1.1 <12'
  'form-data@4': '>=4.0.6 <5'
auditConfig:
  ignoreGhsas:
    - GHSA-848j-6mx2-7j84
# Preserve the existing n8n ESLint 9 baseline until its official community-node
# tooling supports ESLint 10; do not drop its checks to upgrade the engine.
catalogs:
  n8n-lint:
    eslint: '9.39.5'

